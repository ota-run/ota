version: 1
project:
  name: sandbox-oci
  description: Real OCI sandbox enforcement regression fixture

execution:
  preferred: container
  supported:
    - container
  lifecycle: ephemeral
  backends:
    container:
      image: debian:bookworm-slim
      platform: linux/amd64
      engines:
        - docker
  runtime_boundary:
    filesystem:
      repo_root_mode: read_only
      writable_paths:
        - reports
      protected_paths:
        - ota.yaml

tasks:
  verify:
    description: Prove writable carve-out, protected root, network denial, and cleanup
    env:
      TARGET_VARIANT: host
    command:
      exe: bash
      args:
        - -c
        - |
          test "$TARGET_VARIANT" = linux
          mkdir -p reports
          printf verified > reports/result.txt
          if touch /workspace/forbidden.txt 2>/dev/null; then exit 70; fi
          if timeout 1 bash -c 'exec 3<>/dev/tcp/1.1.1.1/53' >/dev/null 2>&1; then exit 71; fi
    variants:
      - when:
          os: linux
        env:
          TARGET_VARIANT: linux
    runtime_boundary:
      network:
        default: deny
    after_success:
      - record
    safe_for_agent: true
  record:
    description: Record that the admitted success edge executed
    internal: true
    command:
      exe: bash
      args:
        - -c
        - printf hook > reports/hook.txt
    safe_for_agent: true

workflows:
  default: verify
  verify:
    intent: ci_validation
    setup:
      task: verify

agent:
  safe_tasks:
    - verify
    - record
  entrypoint: verify
  default_task: verify
