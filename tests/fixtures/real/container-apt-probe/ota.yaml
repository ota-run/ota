version: 1
project:
  name: container-apt-probe
execution:
  preferred: container
  lifecycle: persistent
  backends:
    container:
      image: rust:1.94-bookworm
      engines:
        - docker
tools:
  pv: "1.6.20-1"
policies:
  provisioning:
    pv:
      source: apt
      package: pv
      approved_versions:
        - "1.6.20-1"
tasks:
  setup:
    run: pv --version > prepared.txt
