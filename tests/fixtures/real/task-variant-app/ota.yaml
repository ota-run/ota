version: 1
project:
  name: task-variant-app
  description: Real fixture for contract discovery and task variants
  type: application
tasks:
  setup:
    description: Prepare the local environment
    category: setup
    run: sh ./scripts/setup.sh
    variants:
      - when:
          os: macos
        run: sh ./scripts/setup-macos.sh
      - when:
          os: windows
        run: .\scripts\setup.ps1
    safe_for_agent: true
  test:
    description: Verify setup side effects
    category: test
    run: test -f setup-output.txt
    depends_on:
      - setup
