version: 1
project:
  name: basic-node
runtimes:
  node: "22"
tools:
  pnpm: "10"
tasks:
  setup:
    run: pnpm install
  dev:
    run: pnpm dev
    depends_on:
      - setup
  test:
    run: pnpm test
    depends_on:
      - setup
checks:
  - name: node-installed
    kind: precondition
    severity: error
    run: node --version
agent:
  entrypoint: setup
  default_task: test
  safe_tasks:
    - setup
    - test
  verify_after_changes:
    - test
  writable_paths:
    - src
    - tests
    - docs
  protected_paths:
    - ota.yaml
  notes: |
    Use `ota validate` before changes and `ota doctor` after edits.
    Prefer `ota run test` as the verification step for agent work.
