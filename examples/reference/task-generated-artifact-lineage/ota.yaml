version: 1
project:
  name: generated-artifact-lineage
  description: Canonical generated SDK producer and consumer ownership

artifacts:
  typescript-sdk:
    kind: generated_source
    producer: sdk:generate
    paths:
      - sdk/typescript/src/api/client.gen.ts
    inputs:
      - schema/api.graphql

tasks:
  sdk:generate:
    description: Generate the typed TypeScript SDK from the declared API schema
    command:
      exe: api-generator
      args:
        - generate
        - --schema
        - schema/api.graphql
        - --output
        - sdk/typescript/src/api/client.gen.ts
    effects:
      writes:
        - sdk/typescript/src/api/client.gen.ts

  sdk:verify:
    description: Verify the generated TypeScript SDK after its producer materializes it
    command:
      exe: npm
      args:
        - run
        - test:sdk
    depends_on:
      - sdk:generate
    requires_artifacts:
      - typescript-sdk
