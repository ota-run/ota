version: 1
project:
  name: launch-runtime-projection
  description: Reference contract showing runtime-owned bind truth projected into a supported launch adapter

toolchains:
  python:
    version: ">=3.12,<3.14"
  node:
    version: ">=22"
    package_managers:
      pnpm: 11.5.1

surfaces:
  web:
    kind: http
    port: 8000
    path: /

tasks:
  dev:
    description: Start the uvicorn-backed local service without duplicating bind flags in launch args
    launch:
      kind: command
      exe: .venv/bin/uvicorn
      args:
        - web.app:app
      runtime_projection:
        listener: web:http
        adapter: uvicorn
    runtime:
      kind: service
      listeners:
        web:http:
          protocol: http
          bind:
            address: 127.0.0.1
            port:
              mode: fixed
              value: 8000
          project:
            host:
              address: 127.0.0.1
              port:
                mode: fixed
                value: 8000
              path: /
              primary: true
      surfaces:
        - web
      readiness:
        kind: http
        listener: web:http
        path: /healthz
    requirements:
      toolchains:
        - python

  next-dev:
    description: Start a Next.js development server without duplicating hostname or port flags in a package script
    launch:
      kind: command
      exe: pnpm
      args: [exec, next, dev, --turbopack]
      runtime_projection:
        listener: web:http
        adapter: nextjs
    runtime:
      kind: service
      listeners:
        web:http:
          protocol: http
          bind:
            address: 127.0.0.1
            port:
              mode: fixed
              value: 3005
          project:
            host:
              address: 127.0.0.1
              port:
                mode: fixed
                value: 3005
              path: /
              primary: true
      readiness:
        kind: http
        listener: web:http
        path: /
    requirements:
      toolchains:
        - node

workflows:
  default: local
  local:
    intent: local_development
    description: Minimal local service workflow using runtime-owned bind projection
    run:
      task: dev
