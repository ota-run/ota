version: 1
project:
  name: replay-baseline-regeneration
  description: Explicit recording and promoted read-only replay of a generated baseline

execution:
  contexts:
    replay:
      backend: container
      lifecycle: ephemeral
      container:
        image: alpine:3.21

artifacts:
  recorded-baseline:
    kind: replay_baseline
    producer: baseline:record
    paths:
      - data/baseline.txt
    replay:
      authority_manifest: replay/recorded-baseline.ota.json
      consumption: read_only

tasks:
  baseline:record:
    description: Explicitly materialize a candidate baseline; never runs in ordinary replay.
    action:
      kind: ensure_file
      path: data/baseline.txt
      value: recorded
    effects:
      writes:
        - data/baseline.txt

  baseline:replay:
    description: Consume only the explicitly promoted baseline through a read-only container overlay.
    context: replay
    command:
      exe: cat
      args:
        - data/baseline.txt
    requires_artifacts:
      - recorded-baseline

agent:
  safe_tasks:
    - baseline:replay
