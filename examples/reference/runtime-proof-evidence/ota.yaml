version: 1
project:
  name: runtime-proof-evidence
  description: Reference contract for marker-bound dependency exercise and fault-control evidence
metadata:
  ota:
    minimum_version: "1.6.24"

execution:
  default_context: host
  contexts:
    host:
      backend: native

surfaces:
  app:
    kind: http
    port: 8080
    readiness:
      kind: http
      path: /
      success:
        status: [200]

services:
  dependency:
    required: true
    manager:
      kind: compose
      name: runtime-proof-evidence
      service: dependency
      files:
        - compose.yaml
    endpoints:
      host:
        address: 127.0.0.1
        port: 8081
    readiness:
      from: host
      endpoint: host
      kind: tcp

tasks:
  proof:marker-produce:
    description: Send the runner-issued marker through the declared dependency seam
    command:
      exe: python3
      args: [scripts/produce_marker.py]
    requires_services: [dependency]
    effects:
      network: true
      network_kind: integration_test
      external_state: [dependency]
    internal: true

  proof:marker-observe:
    description: Recover the marker from the dependency and attest the observation
    command:
      exe: python3
      args: [scripts/observe_marker.py]
    depends_on: [proof:marker-produce]
    requires_services: [dependency]
    effects:
      writes: [.ota/proof]
      network: true
      network_kind: integration_test
      external_state: [dependency]
    internal: true

  proof:dependency-unavailable:
    description: Attest that the same dependency obligation fails against an unavailable endpoint
    command:
      exe: python3
      args: [scripts/negative_control.py]
    depends_on: [proof:marker-produce]
    effects:
      writes: [.ota/proof]
      network: true
      network_kind: integration_test
    internal: true

  app:
    description: Start the finite example runtime that Ota proves ready
    launch:
      kind: command
      exe: python3
      args: [-m, http.server, "8080"]
    runtime:
      kind: service
      listeners:
        app:
          protocol: http
          bind:
            address: 127.0.0.1
            port:
              mode: fixed
              value: 8080
          project:
            host:
              address: 127.0.0.1
              port:
                mode: fixed
                value: 8080
              path: /
              primary: true
      surfaces: [app]
      readiness:
        kind: http
        listener: app
        path: /

workflows:
  default: app-proof
  app-proof:
    intent: local_development
    description: Prove runtime readiness, dependency exercise, and the matching fault control
    setup:
      task: proof:marker-produce
    run:
      task: app
    readiness:
      surfaces: [app]
    proof:
      claim: bounded
      seam_observations:
        - id: dependency-marker
          dependency: dependency
          producer_task: proof:marker-produce
          task: proof:marker-observe
          marker_env: OTA_PROOF_DEPENDENCY_MARKER
      negative_controls:
        - id: dependency-unavailable
          dependency: dependency
          obligation: dependency-marker
          task: proof:dependency-unavailable
          intervention:
            kind: dependency_endpoint_override
          expected_failure: dependency_unavailable
    exposes:
      - surface: app

agent:
  safe_tasks: []
  protected_paths:
    - ota.yaml
    - compose.yaml
    - scripts
