version: 1
project:
  name: runtime-boundary
  description: Reference contract showing canonical runtime sandbox ownership across execution, workflow, and task lanes

execution:
  runtime_boundary:
    filesystem:
      repo_root_mode: read_only
      writable_paths:
        - .ota/state
    network:
      default: deny

tasks:
  verify:
    description: Run a targeted integration lane with explicit runtime boundary truth
    command:
      exe: python3
      args:
        - -m
        - pytest
        - tests/integration/test_api.py
    effects:
      network: true
      network_kind: integration_test
    runtime_boundary:
      filesystem:
        repo_root_mode: read_only
        writable_paths:
          - reports
        protected_paths:
          - .github/workflows
      network:
        default: allow
        outbound_targets:
          - kind: host
            value: staging.internal
            destination_shape: single_purpose_host
          - kind: domain
            value: api.stripe.com
            destination_shape: multi_tenant_host
            destination_constraint:
              kind: tenant_scope
              values: [acct_example]
              source_posture: repo_local_authoritative
              enforcement: authoritative_app_enforced
    safe_for_agent: true

workflows:
  default: verify
  verify:
    intent: ci_validation
    description: Workflow-level runtime boundary truth can specialize the selected path before task-local truth narrows it again
    runtime_boundary:
      filesystem:
        repo_root_mode: read_only
        writable_paths:
          - workflow-cache
      network:
        default: allow
        outbound_targets:
          - kind: service_alias
            value: postgres
            destination_shape: single_purpose_host
    run:
      task: verify

agent:
  safe_tasks:
    - verify
