version: 1
project:
  name: receipt-workflow-history
  description: Reference contract showing workflow-scoped receipt archive and baseline truth
  type: application

env:
  vars:
    APP_PORT:
      required: false
      default: "3000"
  profiles:
    app:
      render:
        dotenv:
          path: .env.app
          include:
            - APP_PORT

tasks:
  verify:
    description: Run the finite verification lane
    command:
      exe: npm
      args:
        - run
        - verify
  dev:
    description: Start the long-running app lane
    launch:
      kind: command
      exe: npm
      args:
        - run
        - dev

workflows:
  default: verify
  verify:
    run:
      task: verify
  app:
    env:
      profile: app
    run:
      task: dev
