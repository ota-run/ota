version: 1

project:
  name: runtime-boundary-destination-constrained
  description: Reference contract for destination-constrained outbound runtime boundary truth

tasks:
  notify:
    description: Deliver notification traffic through a send-style host with recipient constraints
    command:
      exe: ./bin/notify
    runtime_boundary:
      filesystem:
        repo_root_mode: read_only
        writable_paths:
          - tmp
      network:
        default: deny
        outbound_targets:
          - kind: domain
            value: api.sendgrid.com
            destination_shape: send_host
            destination_constraint:
              kind: recipient_domain_allowlist
              values:
                - example.com
                - internal.example
              source_posture: shared_pinned_authoritative
              enforcement: authoritative_app_enforced
              shared_pin:
                ref: policies/email-destinations@sha256:abc123
                freshness: warning
    safe_for_agent: true

agent:
  safe_tasks:
    - notify
