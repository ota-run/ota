version: 1
project:
  name: task-prepare-compose-hydration
  description: Canonical first-class Compose-wrapped package hydration
  type: service

tasks:
  setup:
    description: Hydrate Node dependencies structurally through the declared app service
    category: setup
    prepare:
      kind: dependency_hydration
      medium: package_dependencies
      source:
        kind: node_package_manager
        cwd: .
        manager: npm
        mode: ci
        compose:
          kind: run
          engine: docker
          service: app
          workdir: /workspace
          rm: true
    requirements:
      tools:
        docker: "*"
    effects:
      adapter_state:
        - compose_volume:node_modules
      network: true
      network_kind: dependency_hydration

  test:
    description: Run tests through the same service-side dependency state
    category: test
    compose:
      kind: exec
      engine: docker
      service: app
      workdir: /workspace
      exe: npm
      args:
        - test
    depends_on:
      - setup
    requirements:
      tools:
        docker: "*"
