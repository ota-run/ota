version: 1
project:
  name: ensure-git-checkouts
  description: Canonical deterministic multi-checkout materialization example using action.kind ensure_git_checkouts
  type: application
execution:
  default_context: host
  contexts:
    host:
      backend: native
      requirements:
        tools:
          git: "*"
tasks:
  bootstrap:deps:
    context: host
    description: Materialize several sibling dependency checkouts before local runtime preparation
    action:
      kind: ensure_bundle
      steps:
        - kind: ensure_git_checkouts
          checkouts:
            - path: vendor/wagtail
              source:
                git: https://github.com/wagtail/wagtail.git
                ref: main
              remotes:
                - name: upstream
                  git: git@github.com:wagtail/wagtail.git
            - path: vendor/bakerydemo
              source:
                git: https://github.com/wagtail/bakerydemo.git
                ref: main
        - kind: ensure_file
          path: vendor/bakerydemo/.env
          value: |
            DJANGO_SETTINGS_MODULE=bakerydemo.settings.dev
workflows:
  default: local-bootstrap
  local-bootstrap:
    intent: local_development
    description: Use one finite workflow prepare lane when readiness depends on several deterministic sibling checkouts
    prepare:
      task: bootstrap:deps
