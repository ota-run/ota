version: 1
project:
  name: ensure-git-checkout
  description: Canonical deterministic git checkout materialization example using action.kind ensure_git_checkout
  type: application
execution:
  default_context: host
  contexts:
    host:
      backend: native
      requirements:
        tools:
          git: "*"
tasks:
  bootstrap:deps:
    context: host
    description: Materialize one vendored dependency checkout when the repo-local path is missing
    action:
      kind: ensure_bundle
      steps:
        - kind: ensure_directory
          path: vendor
        - kind: ensure_git_checkout
          path: vendor/wagtail
          source:
            git: https://github.com/wagtail/wagtail.git
            ref: main
workflows:
  default: local-bootstrap
  local-bootstrap:
    intent: local_development
    description: Use one finite workflow prepare lane when local readiness depends on a deterministic sibling checkout
    prepare:
      task: bootstrap:deps
