version: 1
project:
  name: service-env-bindings
  description: Service-derived env binding example where one test task receives database URL truth from the declared Postgres service
  type: application

toolchains:
  ruby:
    version: "3.3.11"
    package_managers:
      bundler: "2.5.3"
    fulfillment:
      source: ruby
      mode: run

execution:
  default_context: host
  contexts:
    host:
      backend: native
      requirements:
        tools:
          docker: "*"

env:
  vars:
    POSTGRES_PASSWORD:
      required: true
      secret: true
    DATABASE_URL:
      secret: true
  sources:
    - kind: dotenv
      path: .env.local
      must_exist: true

services:
  postgres:
    manager:
      kind: compose
      name: local
      file: docker/docker-compose.yml
      env_file: .env.local
      service: postgres
    endpoints:
      host:
        address: 127.0.0.1
        port: 5432
    readiness:
      from: host
      kind: tcp
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

tasks:
  setup:env:
    internal: true
    description: Materialize the shared Postgres password into the local env file before service startup
    action:
      kind: ensure_env_file
      path: .env.local
      template: .env.example
      vars:
        POSTGRES_PASSWORD:
          random:
            bytes: 18
            encoding: hex
          mode: replace

  setup:
    description: Hydrate Ruby dependencies through the declared Bundler lane
    depends_on:
      - setup:env
    prepare:
      kind: dependency_hydration
      medium: package_dependencies
      source:
        kind: bundler
        cwd: .
        path: vendor/bundle
    requirements:
      toolchains:
        - ruby
      env:
        - POSTGRES_PASSWORD
    effects:
      writes:
        - .bundle
        - vendor/bundle
      network: true
      network_kind: dependency_hydration

  test:integration:
    description: Run integration tests with database env derived from the declared Postgres service
    depends_on:
      - setup
    requires_services:
      - postgres
    env_bindings:
      DB_HOST:
        from_service:
          service: postgres
          view: host
          format: host
      DATABASE_URL:
        from_service:
          service: postgres
          view: host
          format: url
          scheme: postgres
          username: postgres
          password_env: POSTGRES_PASSWORD
          database: app_test
    command:
      exe: bundle
      args:
        - exec
        - rails
        - test
    requirements:
      toolchains:
        - ruby
      env:
        - POSTGRES_PASSWORD

workflows:
  default: integration
  integration:
    intent: verification
    description: Prepare local env state, hydrate Bundler dependencies, and project service-derived database env into the integration test task
    prepare:
      task: setup:env
    setup:
      task: setup
    run:
      task: test:integration
    notes: |
      Use `env_bindings` when the task should follow declared service endpoint truth instead of
      freezing `localhost`, `host.docker.internal`, or hand-written DSNs into repo task bodies.

agent:
  entrypoint: setup
  default_task: test:integration
  safe_tasks:
    - setup
    - test:integration
  verify_after_changes:
    - test:integration
  writable_paths:
    - .bundle
    - vendor/bundle
    - app
    - config
    - lib
    - test
    - docs
  protected_paths:
    - .env.local
    - ota.yaml
  notes: |
    Keep credential input in `env.vars` and let `env_bindings` derive the runtime database URL from
    declared service topology. Use `password_env` for real credentials instead of embedding
    `from_service.password` in shared contract truth.
