version: 1
project:
  name: python-uv-requirements
  description: Canonical Python setup that separates virtualenv materialization from uv requirements hydration
  type: application
toolchains:
  python:
    version: "3.12"
    package_managers:
      uv: ">=0.7.0"
tasks:
  setup:venv:
    description: Materialize the local Python virtualenv deterministically
    action:
      kind: ensure_virtualenv
      path: .venv
      python: "3.12"
    requirements:
      toolchains:
        - python
    effects:
      writes:
        - .venv

  setup:
    description: Hydrate Python dependencies from requirements.txt through the declared uv lane
    depends_on:
      - setup:venv
    prepare:
      kind: dependency_hydration
      medium: package_dependencies
      source:
        kind: uv
        cwd: .
        mode: pip_requirements
        requirements_file: requirements.txt
        default_index: https://pypi.org/simple
    requirements:
      toolchains:
        - python
    effects:
      writes:
        - .venv
      network: true
      network_kind: dependency_hydration

  test:
    description: Run the Python test suite through uv
    command:
      exe: uv
      args:
        - run
        - pytest
    depends_on:
      - setup
    requirements:
      toolchains:
        - python
