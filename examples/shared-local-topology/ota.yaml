version: 1
project:
  name: shared-local-topology
  description: Minimal shared local backend example showing truthful internal target binding for a co-located helper app
execution:
  default_context: app
  contexts:
    app:
      backend: container
      lifecycle: persistent
      container:
        image: node:24-bookworm
  shared_backends:
    workbench:
      scope: local
      backend: container
      lifecycle: persistent
      context: app
tasks:
  dev:
    run: pnpm dev:api
    runtime:
      kind: service
      backend_binding: workbench
      readiness:
        kind: http
        listener: http
        method: GET
        path: /health
        headers:
          Accept: application/json
        success:
          status: [200]
        body:
          contains: '"status":"UP"'
        interval: 5s
        timeout: 3s
        retries: 5
        start_period: 10s
      listeners:
        http:
          protocol: http
          bind:
            address: 0.0.0.0
            port:
              mode: fixed
              value: 8080
          project:
            host:
              address: 127.0.0.1
              primary: true
              port:
                mode: fixed
                value: 8080
              path: /
  sandbox:
    inputs:
      base_url:
        description: Override the API target when the helper should point somewhere else explicitly
    run: pnpm dev:sandbox
    runtime:
      kind: service
      backend_binding: workbench
      listeners:
        web:
          protocol: http
          bind:
            address: 0.0.0.0
            port:
              mode: fixed
              value: 3000
          project:
            host:
              address: 127.0.0.1
              primary: true
              port:
                mode: fixed
                value: 3000
              path: /
    targets:
      api:
        service:
          task: dev
          listener: http
          address_view: internal
        override_input: base_url
agent:
  entrypoint: dev
  default_task: sandbox
  safe_tasks:
    - dev
    - sandbox
  verify_after_changes:
    - sandbox
  writable_paths:
    - src
    - docs
  protected_paths:
    - ota.yaml
  notes: |
    Use `address_view: internal` only when the helper truly shares the producer backend boundary.
    Use `address_view: topology` when ota should choose the best reachable local address for the current caller shape.
