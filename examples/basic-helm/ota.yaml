version: 1
project:
  name: basic-helm
  description: Minimal Helm chart repo that shows first-class chart dependency hydration plus finite render and install tasks
  type: application
execution:
  default_context: host
  contexts:
    host:
      backend: native
tools:
  helm: ">=3.18"
  kubectl: "*"
tasks:
  setup:
    context: host
    description: Hydrate Helm chart dependencies
    prepare:
      kind: dependency_hydration
      medium: package_dependencies
      source:
        kind: helm
        cwd: deploy/helm
    requirements:
      tools:
        helm: "*"
    effects:
      writes:
        - deploy/helm/charts
      network: true
      network_kind: dependency_hydration
  render:
    context: host
    description: Render the chart without mutating the cluster
    adapter_inputs:
      helm:
        cwd: deploy/helm
        chart: deploy/helm
        release_name: appsmith
        namespace: appsmith
    command:
      exe: helm
      args:
        - template
    depends_on:
      - setup
    requirements:
      tools:
        helm: "*"
  install:
    context: host
    description: Install the chart into Kubernetes
    adapter_inputs:
      helm:
        cwd: deploy/helm
        chart: deploy/helm
        release_name: appsmith
        namespace: appsmith
    command:
      exe: helm
      args:
        - install
        - --create-namespace
    depends_on:
      - setup
    requirements:
      tools:
        helm: "*"
        kubectl: "*"
    effects:
      external_state:
        - kubernetes
  verify:
    description: Aggregate the finite Helm prep and render path
    aggregate:
      tasks:
        - setup
        - render
agent:
  posture: readiness_strict
  entrypoint: render
  default_task: verify
  safe_tasks:
    - render
    - verify
  verify_after_changes:
    - verify
  writable_paths:
    - deploy/helm/charts
  protected_paths:
    - ota.yaml
  notes: |
    Use `ota run setup` to hydrate chart dependencies through the structured Helm lane.
    Use `ota run render` for a finite non-mutating chart proof before any install path.
