version: 1
project:
  name: bake-adapter-inputs
  description: Canonical Bake adapter ownership example for task-owned and workflow-owned Bake file truth
  type: application
execution:
  default_context: host
  contexts:
    host:
      backend: native
      requirements:
        tools:
          docker: "*"
tasks:
  bake:image:
    context: host
    description: Build the default image through task-owned Bake file selection
    adapter_inputs:
      bake:
        cwd: docker
        files:
          - docker/docker-bake.hcl
    command:
      exe: docker
      args:
        - buildx
        - bake
        - app
    requirements:
      tools:
        docker: "*"
  bake:ci:
    context: host
    description: Build the CI image through task-owned base Bake truth plus one task-local overlay
    adapter_inputs:
      bake:
        cwd: docker
        files:
          - docker/docker-bake.hcl
          - docker/docker-bake.ci.hcl
    command:
      exe: docker
      args:
        - buildx
        - bake
        - app
    requirements:
      tools:
        docker: "*"
  bake:workflow:
    context: host
    description: Build the workflow-selected image with workflow-owned Bake file truth
    command:
      exe: docker
      args:
        - buildx
        - bake
        - app
    requirements:
      tools:
        docker: "*"
workflows:
  default: release
  release:
    intent: release
    description: Prepend workflow-owned Bake file truth into the selected task path instead of hard-coding shell `docker buildx bake -f` flags
    env:
      adapter_inputs:
        bake:
          cwd: docker
          files:
            - docker/docker-bake.hcl
            - docker/docker-bake.platform.hcl
            - docker/docker-bake.release.hcl
    run:
      task: bake:workflow
