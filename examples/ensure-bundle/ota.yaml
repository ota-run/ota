version: 1
project:
  name: ensure-bundle
  description: Canonical bundled deterministic host bootstrap example using action.kind ensure_bundle
  type: application
execution:
  default_context: host
  contexts:
    host:
      backend: native
tasks:
  bootstrap:local:
    context: host
    description: Prepare the local repo state through one ordered bundle of deterministic host mutations
    action:
      kind: ensure_bundle
      steps:
        - kind: ensure_container_network
          name: local-dev
        - kind: copy_if_missing
          from: .env.example
          to: .env.local
        - kind: ensure_env_file
          path: .env.local
          vars:
            APP_ENV:
              value: local
              mode: replace
            API_TOKEN:
              random:
                bytes: 24
                encoding: hex
        - kind: ensure_directory
          path: .cache/ota
        - kind: ensure_file
          path: .secrets/dev-token
          random:
            bytes: 24
            encoding: hex
workflows:
  default: local-bootstrap
  local-bootstrap:
    intent: local_development
    description: Use one finite workflow prepare lane when repo bootstrap needs more than one deterministic host mutation
    prepare:
      task: bootstrap:local
