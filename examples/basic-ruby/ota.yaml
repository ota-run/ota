version: 1
project:
  name: basic-ruby
  description: Basic Ruby repo with Ruby toolchain ownership plus Bundler-backed setup and test tasks
  type: application
toolchains:
  ruby:
    version: "3.3.11"
    package_managers:
      bundler: "2.5"
tasks:
  setup:
    description: Hydrate Ruby gem dependencies through the declared Bundler lane
    prepare:
      kind: dependency_hydration
      medium: package_dependencies
      source:
        kind: bundler
        cwd: .
        path: vendor/bundle
    requirements:
      toolchains:
        - ruby
    effects:
      writes:
        - .bundle
        - vendor/bundle
      network: true
      network_kind: dependency_hydration
  test:
    description: Run the default Ruby test suite
    run: bundle exec rake test
    depends_on:
      - setup
    requirements:
      toolchains:
        - ruby
workflows:
  default: verify
  verify:
    description: Canonical Ruby toolchain setup and verification path
    setup:
      task: setup
    run:
      task: test
    notes: |
      Use this when the repo front door is the standard Bundler install plus Ruby test loop.
      `toolchains.ruby` keeps Ruby and Bundler governance under one toolchain contract.
agent:
  entrypoint: setup
  default_task: test
  safe_tasks:
    - setup
    - test
  verify_after_changes:
    - test
  writable_paths:
    - .bundle
    - vendor/bundle
    - app
    - lib
    - spec
    - test
    - docs
  protected_paths:
    - ota.yaml
  notes: |
    Use `ota validate` before changes and `ota up --workflow verify` to prepare the repo path.
    Keep Ruby ownership under `toolchains.ruby` and use `ota run test` to verify Ruby changes.
