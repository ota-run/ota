version: 1
project:
  name: ensure-env-file
  description: Canonical deterministic env bootstrap example using action.kind ensure_env_file
  type: application
execution:
  default_context: host
  contexts:
    host:
      backend: native
env:
  vars:
    DATABASE_URL:
      required: true
tasks:
  setup:env:
    context: host
    description: Create and normalize the local env overlay without shell copy or sed glue
    action:
      kind: ensure_env_file
      path: .env.local
      template: .env.example
      vars:
        APP_ENV:
          value: local
          mode: replace
        DATABASE_URL:
          from_env: DATABASE_URL
          mode: replace
        APP_SECRET:
          random:
            bytes: 24
            encoding: hex
        LEGACY_FLAG:
          mode: remove
workflows:
  default: local-env
  local-env:
    intent: local_development
    description: Workflow-scoped host preparation that seeds one local env file deterministically before the main runnable path
    prepare:
      task: setup:env
