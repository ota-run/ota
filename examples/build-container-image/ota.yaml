version: 1

project:
  name: build-container-image-example

tasks:
  image:build:
    description: Materialize the local image required by the container verification lane.
    action:
      kind: build_container_image
      file: Dockerfile
      context: .
      tag: build-container-image-example:local
    requirements:
      tools:
        docker: "*"
    effects:
      network: true
      network_kind: broad
      external_state:
        - docker
