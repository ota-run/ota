version: 1
project:
  name: compose-adapter-inputs
  description: Canonical compose adapter ownership example for workflow-owned overlays plus task-owned compose inputs
  type: application
execution:
  default_context: host
  contexts:
    host:
      backend: native
      requirements:
        tools:
          docker: "*"
env:
  vars:
    DATABASE_URL:
      required: true
  profiles:
    runtime:
      sources:
        - kind: dotenv
          path: .env.local
      env:
        REDIS_HOST: redis
      render:
        dotenv:
          path: .env.compose
          template: .env.example
          include:
            - DATABASE_URL
services:
  api:
    manager:
      kind: compose
      name: local
      file: docker-compose.yml
      service: api
  postgres:
    manager:
      kind: compose
      name: local
      file: docker-compose.yml
      service: postgres
tasks:
  compose:staged:up:
    context: host
    description: Start a finite staged Compose service group through first-class compose ownership
    adapter_inputs:
      overlays:
        compose:
          cwd: docker
          files:
            - docker/docker-compose.yml
          profiles:
            - runtime
    compose:
      kind: up
      detach: true
      services:
        - postgres
        - api
    requirements:
      tools:
        docker: "*"
  compose:build:
    context: host
    description: Build selected Compose services through first-class compose ownership
    adapter_inputs:
      overlays:
        compose:
          cwd: docker
          files:
            - docker/docker-compose.yml
    compose:
      kind: build
      services:
        - api
    requirements:
      tools:
        docker: "*"
  compose:up:
    context: host
    description: Start the compose stack with task-owned adapter truth
    adapter_inputs:
      overlays:
        compose:
          cwd: docker
          env_files:
            - docker/.env.task
    launch:
      kind: command
      exe: docker
      args:
        - compose
        - up
    requirements:
      tools:
        docker: "*"
  compose:down:
    context: host
    description: Stop the compose stack with task-owned compose file and profile truth
    adapter_inputs:
      overlays:
        compose:
          cwd: docker
          env_files:
            - docker/.env.task
          files:
            - docker/docker-compose.yml
          profiles:
            - app
    compose:
      kind: down
      remove_volumes: true
    requirements:
      tools:
        docker: "*"
  compose:debug:up:
    context: host
    description: Start a debug compose lane with task-owned project naming
    adapter_inputs:
      overlays:
        compose:
          cwd: docker
          env_files:
            - docker/.env.task
          files:
            - docker/docker-compose.yml
          profiles:
            - debug
          project_name: compose-adapter-inputs-debug
    launch:
      kind: command
      exe: docker
      args:
        - compose
        - up
    requirements:
      tools:
        docker: "*"
  compose:exec:command:
    context: host
    description: Run a direct argv command inside the api service through first-class compose execution
    adapter_inputs:
      overlays:
        compose:
          cwd: docker
          files:
            - docker/docker-compose.yml
    compose:
      kind: exec
      service: api
      workdir: /workspace
      exe: npm
      args:
        - run
        - lint
    requirements:
      tools:
        docker: "*"
  compose:exec:detached:
    context: host
    description: Start a detached in-service bootstrap command through first-class compose execution
    adapter_inputs:
      overlays:
        compose:
          cwd: docker
          files:
            - docker/docker-compose.yml
    compose:
      kind: exec
      detach: true
      service: api
      workdir: /workspace
      exe: sh
      args:
        - -lc
        - ./scripts/start-background-worker.sh
    requirements:
      tools:
        docker: "*"
  compose:workflow:up:
    context: host
    description: Start the compose stack with workflow-owned adapter root and overlays
    launch:
      kind: command
      exe: docker
      args:
        - compose
        - up
    requirements:
      tools:
        docker: "*"
workflows:
  default: runtime
  runtime:
    intent: packaged_runtime
    description: Render workflow-owned dotenv truth and prepend compose files, profiles, and project name into the selected compose task path
    adapter_inputs:
      overlays:
        compose:
          cwd: docker
          files:
            - docker/docker-compose.override.yml
          profiles:
            - runtime
          project_name: compose-adapter-inputs
    env:
      profile: runtime
      compose_env_file_services:
        - api
        - postgres
    run:
      task: compose:workflow:up
