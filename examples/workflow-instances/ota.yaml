version: 1
project:
  name: workflow-instances
  description: Canonical named workflow-instance example for one shared runtime family
  type: application
env:
  profiles:
    app:
      render:
        files:
          - path: .vscode/client.json
            format: json
            merge_into_existing: true
            sources:
              - config/client-shared.json
              - config/client-instance.json
execution:
  default_context: host
  contexts:
    host:
      backend: native
      requirements:
        tools:
          docker: "*"
surfaces:
  ui:
    kind: http
    port: 3000
    path: /
    purpose: Browser-facing app surface for the selected instance
tasks:
  app:up:
    context: host
    env:
      APP_SOURCE_PATH: ${OTA_HOST_WORKSPACE}
    adapter_inputs:
      compose:
        files:
          - docker-compose.yml
        project_name: app-ws0
    runtime:
      kind: service
      listeners:
        ui:http:
          protocol: http
          bind:
            address: 0.0.0.0
            port:
              mode: fixed
              value: 3000
          project:
            host:
              address: 127.0.0.1
              port:
                mode: fixed
                value: 3000
              primary: true
              path: /
      surfaces:
        - ui
      readiness:
        kind: http
        listener: ui:http
        path: /
        interval: 3s
        timeout: 3s
        retries: 20
    command:
      exe: docker
      args:
        - compose
        - up
        - -d
        - app
    requirements:
      tools:
        docker: "*"
  app:down:
    context: host
    env:
      APP_SOURCE_PATH: ${OTA_HOST_WORKSPACE}
    adapter_inputs:
      compose:
        files:
          - docker-compose.yml
        project_name: app-ws0
    command:
      exe: docker
      args:
        - compose
        - down
  app:attach:
    context: host
    env:
      APP_SOURCE_PATH: ${OTA_HOST_WORKSPACE}
    adapter_inputs:
      compose:
        files:
          - docker-compose.yml
        project_name: app-ws0
    compose:
      kind: attach
      service: app
      exe: sh
    requirements:
      tools:
        docker: "*"
workflows:
  default: app
  app:
    intent: packaged_runtime
    description: One shared app runtime family with one explicit default instance plus generated workspace instances
    env:
      profile: app
    instances:
      default: ws0
      ws0:
        description: Bind the live repo as the default app instance
        env:
          APP_CLIENT_PORT: "3001"
      generated:
        cloned-workspaces:
          prefix: ws
          start: 1
          end: 2
          template:
            description: Bind a cloned workspace instance under OTA_HOST_HOME
            topology:
              requires_instances:
                - ws0
            env:
              APP_SOURCE_PATH: ${OTA_HOST_HOME}/.example/workspaces/${OTA_WORKFLOW_INSTANCE}
            tasks:
              app:up:
                adapter_inputs:
                  compose:
                    project_name: app-${OTA_WORKFLOW_INSTANCE}
                runtime:
                  listeners:
                    ui:http:
                      bind:
                        port:
                          mode: fixed
                          value: 3000
                          stride: 10000
                      project:
                        host:
                          port:
                            mode: fixed
                            value: 3000
                            stride: 10000
              app:attach:
                adapter_inputs:
                  compose:
                    project_name: app-${OTA_WORKFLOW_INSTANCE}
              app:down:
                adapter_inputs:
                  compose:
                    project_name: app-${OTA_WORKFLOW_INSTANCE}
            surfaces:
              ui:
                port: 3000
                port_stride: 10000
    run:
      task: app:up
    attach:
      task: app:attach
agent:
  safe_tasks:
    - app:down
  protected_paths:
    - docker-compose.yml
