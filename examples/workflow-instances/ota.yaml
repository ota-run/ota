version: 1
project:
  name: workflow-instances
  description: Canonical named workflow-instance example for one shared runtime family
  type: application
execution:
  default_context: host
  contexts:
    host:
      backend: native
      requirements:
        tools:
          docker: "*"
surfaces:
  ui:
    kind: http
    port: 3000
    path: /
    purpose: Browser-facing app surface for the selected instance
tasks:
  app:up:
    context: host
    env:
      APP_SOURCE_PATH: ${OTA_HOST_WORKSPACE}
    adapter_inputs:
      compose:
        files:
          - docker-compose.yml
        project_name: app-ws0
    runtime:
      kind: service
      surfaces:
        - ui
      readiness:
        kind: http
        listener: ui
        path: /
        interval: 3s
        timeout: 3s
        retries: 20
    command:
      exe: docker
      args:
        - compose
        - up
        - -d
        - app
    requirements:
      tools:
        docker: "*"
  app:down:
    context: host
    env:
      APP_SOURCE_PATH: ${OTA_HOST_WORKSPACE}
    adapter_inputs:
      compose:
        files:
          - docker-compose.yml
        project_name: app-ws0
    command:
      exe: docker
      args:
        - compose
        - down
workflows:
  default: app
  app:
    intent: packaged_runtime
    description: One shared app runtime family with named selected instances
    instances:
      default: ws0
      ws0:
        description: Bind the live repo as the default app instance
      ws1:
        description: Bind the first cloned workspace under OTA_HOST_HOME
        env:
          APP_SOURCE_PATH: ${OTA_HOST_HOME}/.example/workspaces/ws1
        tasks:
          app:up:
            adapter_inputs:
              compose:
                project_name: app-ws1
          app:down:
            adapter_inputs:
              compose:
                project_name: app-ws1
        surfaces:
          ui:
            port: 13000
    run:
      task: app:up
agent:
  safe_tasks:
    - app:down
  protected_paths:
    - docker-compose.yml
metadata:
  ota:
    minimum_version: "1.6.22"
