version: 1
project:
  name: basic-dotnet
  description: Basic .NET repo with dotnet tasks
  type: application
runtimes:
  dotnet: "8.0"
tools:
  dotnet: "*"
tasks:
  setup:
    description: Restore .NET dependencies
    run: dotnet restore
    requirements:
      runtimes:
        dotnet: "8.0"
      tools:
        dotnet: "*"
      checks:
        - dotnet-installed
  build:
    description: Build the .NET repo
    run: dotnet build
    depends_on:
      - setup
    requirements:
      tools:
        dotnet: "*"
  test:
    description: Run the .NET test suite
    run: dotnet test
    depends_on:
      - setup
    requirements:
      tools:
        dotnet: "*"
workflows:
  default: verify
  verify:
    description: Canonical .NET restore and verification path
    setup:
      task: setup
    run:
      task: test
    notes: |
      Use this when you want one declared repo path instead of separate restore and test commands.
checks:
  - name: dotnet-installed
    kind: precondition
    severity: error
    run: dotnet --version
agent:
  entrypoint: setup
  default_task: test
  safe_tasks:
    - setup
    - build
    - test
  verify_after_changes:
    - test
  writable_paths:
    - src
    - tests
    - docs
  protected_paths:
    - ota.yaml
  notes: |
    Use `ota validate` before changes and `ota up --workflow verify` to prepare the repo path.
    Use `ota run build` when you want to confirm the .NET toolchain still matches the contract.
