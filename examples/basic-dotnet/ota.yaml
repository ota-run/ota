version: 1
project:
  name: basic-dotnet
  description: Basic .NET repo with toolchain-owned dotnet tasks
  type: application
toolchains:
  dotnet:
    version: "9.0"
tasks:
  setup:
    description: Restore .NET dependencies
    prepare:
      kind: dependency_hydration
      medium: package_dependencies
      source:
        kind: dotnet_restore
        cwd: .
    requirements:
      toolchains:
        - dotnet
    effects:
      writes:
        - obj
      network: true
      network_kind: dependency_hydration
  build:
    description: Build the .NET repo
    command:
      exe: dotnet
      args:
        - build
    depends_on:
      - setup
    requirements:
      toolchains:
        - dotnet
  test:
    description: Run the .NET test suite
    command:
      exe: dotnet
      args:
        - test
    depends_on:
      - setup
    requirements:
      toolchains:
        - dotnet
workflows:
  default: verify
  verify:
    description: Canonical .NET toolchain restore and verification path
    setup:
      task: setup
    run:
      task: test
    notes: |
      Use this when you want one declared repo path instead of separate restore and test commands.
      `toolchains.dotnet` owns both the .NET runtime and the `dotnet` CLI.
agent:
  entrypoint: setup
  default_task: test
  safe_tasks:
    - setup
    - build
    - test
  verify_after_changes:
    - test
  writable_paths:
    - src
    - tests
    - docs
    - obj
  protected_paths:
    - ota.yaml
  notes: |
    Use `ota validate` before changes and `ota up --workflow verify` to prepare the repo path.
    Keep .NET ownership under `toolchains.dotnet` and use `ota run build` or `ota run test`
    to verify C# changes.
