version: 1
project:
  name: basic-dotnet
  description: Basic .NET repo with dotnet tasks
  type: application
runtimes:
  dotnet: "8.0"
tools:
  dotnet: "*"
tasks:
  setup:
    run: dotnet restore
  build:
    run: dotnet build
    depends_on:
      - setup
  test:
    run: dotnet test
    depends_on:
      - setup
checks:
  - name: dotnet-installed
    kind: precondition
    severity: error
    run: dotnet --version
agent:
  entrypoint: setup
  default_task: test
  safe_tasks:
    - setup
    - build
    - test
  verify_after_changes:
    - test
  writable_paths:
    - src
    - tests
    - docs
  protected_paths:
    - ota.yaml
  notes: |
    Use `ota validate` before changes and `ota run test` after edits.
    Build, test, and restore are the primary safe paths for this example.
