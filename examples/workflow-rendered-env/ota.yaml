version: 1
project:
  name: workflow-rendered-env
  description: Workflow-owned compose env-file example rendered from repo template truth plus selected env overlays
  type: application
toolchains:
  node:
    version: "22"
    package_managers:
      pnpm: "10.0.0"
    fulfillment:
      source: corepack
      mode: run
execution:
  default_context: host
  contexts:
    host:
      backend: native
      requirements:
        tools:
          docker: "*"
env:
  vars:
    DATABASE_URL:
      required: true
  profiles:
    compose:
      sources:
        - kind: dotenv
          path: .env.local
      env:
        REDIS_HOST: redis
      render:
        dotenv:
          path: .env.compose
          template: .env.example
          include:
            - DATABASE_URL
services:
  api:
    manager:
      kind: compose
      name: local
      file: docker-compose.yml
      env_files:
        - .env.compose
      service: api
  postgres:
    manager:
      kind: compose
      name: local
      file: docker-compose.yml
      env_files:
        - .env.compose
      service: postgres
tasks:
  setup:
    context: host
    description: Hydrate dependencies before running the dev server
    prepare:
      kind: dependency_hydration
      medium: package_dependencies
      source:
        kind: node_package_manager
        cwd: .
        manager: pnpm
        mode: install
        frozen_lockfile: true
    requirements:
      toolchains:
        - node
    effects:
      writes:
        - node_modules
        - .pnpm-store
      network: true
      network_kind: dependency_hydration
  dev:
    context: host
    description: Start the app using the workflow-owned compose env truth
    launch:
      kind: command
      exe: pnpm
      args:
        - dev
    depends_on:
      - setup
    requires_services:
      - api
      - postgres
    requirements:
      env:
        - DATABASE_URL
workflows:
  default: compose-dev
  compose-dev:
    intent: local_development
    description: Render `.env.compose` from `.env.example` plus selected workflow env truth, then start the service-backed dev path
    env:
      profile: compose
      compose_env_file_services:
        - api
        - postgres
    setup:
      task: setup
    run:
      task: dev
agent:
  entrypoint: setup
  default_task: dev
  safe_tasks:
    - setup
  verify_after_changes:
    - setup
  writable_paths:
    - node_modules
    - .pnpm-store
    - src
    - docs
  protected_paths:
    - ota.yaml
  notes: |
    Use `env.profiles.compose.render.dotenv` when the workflow owns one rendered compose env file.
    Keep repo example truth in `.env.example` and let Ota overlay the workflow-specific values.
