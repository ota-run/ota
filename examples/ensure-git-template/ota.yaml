version: 1
project:
  name: ensure-git-template
  description: Canonical deterministic Git template materialization example using action.kind ensure_git_template
  type: application
execution:
  default_context: host
  contexts:
    host:
      backend: native
      requirements:
        tools:
          git: "*"
tasks:
  scaffold:sample:
    context: host
    description: Materialize a fresh local sample repo from one Git-backed template
    action:
      kind: ensure_bundle
      steps:
        - kind: ensure_directory
          path: .ota-pressure
        - kind: ensure_git_template
          path: .ota-pressure/sample-extension
          source:
            git: https://github.com/codyhxyz/create-chrome-extension.git
            ref: main
workflows:
  default: local-bootstrap
  local-bootstrap:
    intent: local_development
    description: Use one finite workflow prepare lane when setup owns deterministic scaffold materialization
    prepare:
      task: scaffold:sample
metadata:
  ota:
    minimum_version: "1.6.23"
