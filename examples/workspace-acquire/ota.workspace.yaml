version: 1
workspace:
  name: ota-acquire-workspace
  description: Example workspace that acquires repos from git before bootstrap
  git_base: https://github.com/ota
repos:
  web:
    path: repos/web
    required: true
    source:
      repo: web
  api:
    path: repos/api
    required: true
    depends_on:
      - web
    source:
      git: https://github.com/ota/api.git
      ref: main
