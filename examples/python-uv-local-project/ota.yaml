version: 1
project:
  name: python-uv-local-project
  description: Canonical uv local-project hydration that keeps editable install truth and dependency groups on the typed setup surface
  type: application
toolchains:
  python:
    version: "3.12"
    package_managers:
      uv: ">=0.7.0"
tasks:
  setup:venv:
    description: Materialize the local Python virtualenv deterministically
    action:
      kind: ensure_virtualenv
      path: .venv
      python: "3.12"
    requirements:
      toolchains:
        - python
    effects:
      writes:
        - .venv

  setup:
    description: Hydrate an editable local project plus its declared dependency groups through uv
    depends_on:
      - setup:venv
    prepare:
      kind: dependency_hydration
      medium: package_dependencies
      source:
        kind: uv
        cwd: .
        mode: pip_local_project
        local_project:
          path: packages/sdk
          editable: true
          extras:
            - cli
          groups:
            - dev
          lockfile: packages/sdk/uv.lock
        default_index: https://pypi.org/simple
    requirements:
      toolchains:
        - python
    effects:
      writes:
        - .venv
      network: true
      network_kind: dependency_hydration

  test:
    description: Run the Python test suite through uv
    command:
      exe: uv
      args:
        - run
        - pytest
    depends_on:
      - setup
    requirements:
      toolchains:
        - python

workflows:
  default: verify
  verify:
    description: Canonical editable local-project hydration plus verification path
    setup:
      task: setup
    run:
      task: test
    notes: |
      Use this when the repo owns a local Python package under source control and wants Ota to
      keep the editable-install, extras, and dependency-group truth on the typed uv hydration lane
      instead of in shell glue.

agent:
  entrypoint: setup
  default_task: test
  safe_tasks:
    - setup
    - test
  verify_after_changes:
    - test
  writable_paths:
    - .venv
    - packages/sdk
    - tests
  protected_paths:
    - ota.yaml
  notes: |
    Use `ota validate` before changes and `ota workflows` to inspect the local-project setup lane.
    Keep uv local-project install truth under `prepare.source.local_project` instead of hand-written
    `uv pip install` shell commands.
