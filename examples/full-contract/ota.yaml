version: 1
project:
  name: full-contract
  description: Full example of the current Ota contract surface
  type: application
execution:
  default_context: host
  contexts:
    host:
      backend: native
    app:
      backend: container
      lifecycle: persistent
      container:
        image: node:24-bookworm
        resources:
          memory:
            minimum: 2GiB
            default: 3GiB
runtimes:
  node: "22"
  python: ">=3.12"
  java:
    version: "21"
    provider: sdkman
    distribution: temurin
    only_on:
      - windows
      - macos
    platforms:
      windows:
        distribution: zulu
tools:
  pnpm:
    version: "10"
  uv: "0.6.0"
  pwsh:
    version: "7.6.0"
    required: false
    only_on:
      - windows
env:
  vars:
    OTA_ENV:
      required: true
      allowed:
        - local
        - ci
    OTA_LOG_LEVEL:
      default: info
      allowed:
        - debug
        - info
        - warn
    PATH:
      prepend:
        - ./node_modules/.bin
  sources:
    - kind: dotenv
      path: .env.local
    - kind: dotenv
      path: .env
tasks:
  setup:
    context: host
    description: Install project dependencies
    category: setup
    script: |
      pnpm install
      pnpm exec prisma generate
    safe_for_agent: true
  dev:
    context: host
    description: Start the local development server
    category: dev
    run: pnpm dev
    depends_on:
      - setup
  dev:container:
    context: app
    description: Start the local development server in a container context
    category: dev
    run: pnpm dev --host 0.0.0.0 --port 3000
    runtime:
      kind: service
      listeners:
        http:
          protocol: http
          bind:
            address: 0.0.0.0
            port:
              mode: fixed
              value: 3000
          project:
            host:
              address: 127.0.0.1
              port:
                mode: fixed
                value: 3000
              path: /
  test:
    context: host
    description: Run the validation suite
    category: test
    run: pnpm test
    depends_on:
      - setup
    safe_for_agent: true
checks:
  - name: node-installed
    kind: precondition
    severity: error
    run: node --version
    timeout: 10
  - name: repo-tests
    kind: health
    severity: warn
    run: pnpm test -- --runInBand
agent:
  entrypoint: setup
  default_task: test
  safe_tasks:
    - setup
    - test
  verify_after_changes:
    - test
  writable_paths:
    - src
    - docs
  protected_paths:
    - ota.yaml
    - Cargo.lock
    - LICENSE
  notes: |
    Use `ota validate` before execution and `ota doctor` after contract changes.
    Use `ota run test` to keep the contract and the implementation aligned.
metadata:
  owner: ota
  team: platform
