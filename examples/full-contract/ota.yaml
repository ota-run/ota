version: 1
project:
  name: full-contract
  description: Full example of the current Ota contract surface
  type: application
execution:
  default_context: host
  contexts:
    host:
      backend: native
    app:
      backend: container
      lifecycle: persistent
      container:
        image: node:24-bookworm
        resources:
          memory:
            minimum: 2GiB
            default: 3GiB
runtimes:
  node: "22"
  python: ">=3.12"
  java:
    version: "21"
    provider: sdkman
    distribution: temurin
    only_on:
      - windows
      - macos
    platforms:
      windows:
        distribution: zulu
tools:
  pnpm:
    version: "10"
    acquisition:
      provider: corepack
      package: pnpm
      version: "10.0.0"
  uv: "0.6.0"
  pwsh:
    version: "7.6.0"
    required: false
    only_on:
      - windows
env:
  vars:
    OTA_ENV:
      required: true
      allowed:
        - local
        - ci
    OTA_LOG_LEVEL:
      default: info
      allowed:
        - debug
        - info
        - warn
    PATH:
      prepend:
        - ./node_modules/.bin
  sources:
    - kind: dotenv
      path: .env.local
    - kind: dotenv
      path: .env
surfaces:
  site:
    kind: http
    label: Docs App
    purpose: Canonical browser-facing application surface
    visibility: public
    port: 3000
    path: /
    readiness:
      kind: http
      path: /health
      headers:
        Accept: application/json
      body:
        contains: '"status":"UP"'
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
tasks:
  setup:
    context: host
    description: Install project dependencies
    category: setup
    script: |
      pnpm install
      pnpm exec prisma generate
    requirements:
      tools:
        pnpm: "10"
      checks:
        - node-installed
    safe_for_agent: true
  setup:container:
    context: app
    description: Install project dependencies in the container context
    category: setup
    script: |
      pnpm install
      pnpm exec prisma generate
  dev:
    context: host
    description: Start the local development server on the host
    category: dev
    run: pnpm dev --host 127.0.0.1 --port 3000
    requirements:
      tools:
        pnpm: "10"
    depends_on:
      - setup
    runtime:
      kind: service
      surfaces:
        - site
  dev:container:
    context: app
    description: Start the local development server in a container context
    category: dev
    run: pnpm dev --host 0.0.0.0 --port 3000
    depends_on:
      - setup:container
    runtime:
      kind: service
      surfaces:
        site:
          bind:
            address: 0.0.0.0
            port:
              mode: fixed
              value: 3000
          project:
            host:
              address: 127.0.0.1
              port:
                mode: fixed
                value: 3000
              path: /
              primary: true
  preview:quickstart:
    context: host
    description: Start the packaged preview through a structured command launch
    category: dev
    launch:
      kind: command
      exe: npx
      args:
        - vite
        - --host
        - 127.0.0.1
        - --port
        - "3000"
    requirements:
      runtimes:
        node: "22"
      tools:
        npx: "*"
      checks:
        - node-installed
    depends_on:
      - setup
    runtime:
      kind: service
      surfaces:
        - site
  preview:packaged:
    context: host
    description: Start the packaged preview image through a structured container launch
    category: dev
    launch:
      kind: container
      image: ghcr.io/ota/full-contract-docs:latest
      volumes:
        - name: full_contract_docs
          target: /var/lib/full-contract
    requirements:
      tools:
        docker: "*"
    runtime:
      kind: service
      surfaces:
        site:
          bind:
            address: 0.0.0.0
            port:
              mode: fixed
              value: 3000
          project:
            host:
              address: 127.0.0.1
              port:
                mode: fixed
                value: 3000
              path: /
              primary: true
  test:
    context: host
    description: Run the validation suite
    category: test
    run: pnpm test
    requirements:
      tools:
        pnpm: "10"
    depends_on:
      - setup
    safe_for_agent: true
workflows:
  default: app
  app:
    intent: local_development
    description: Canonical container-backed app path
    setup:
      task: setup:container
    run:
      task: dev:container
    readiness:
      surfaces:
        - site
    exposes:
      - surface: site
  host:
    description: Direct host-backed dev path for local debugging
    setup:
      task: setup
    run:
      task: dev
    readiness:
      surfaces:
        - site
    exposes:
      - surface: site
  quickstart:
    intent: quickstart
    description: Structured packaged-command path for the browser preview
    setup:
      task: setup
    run:
      task: preview:quickstart
    readiness:
      surfaces:
        - site
    exposes:
      - surface: site
  packaged:
    intent: packaged_runtime
    description: Structured packaged-container path for the browser preview
    run:
      task: preview:packaged
    readiness:
      surfaces:
        - site
    exposes:
      - surface: site
checks:
  - name: node-installed
    kind: precondition
    severity: error
    run: node --version
    timeout: 10
  - name: repo-tests
    kind: health
    severity: warn
    run: pnpm test -- --runInBand
agent:
  entrypoint: setup
  default_task: test
  safe_tasks:
    - setup
    - test
  verify_after_changes:
    - test
  writable_paths:
    - src
    - docs
  protected_paths:
    - ota.yaml
    - Cargo.lock
    - LICENSE
  notes: |
    Use `ota workflows` to inspect the canonical repo paths before preparing or running them.
    Use `ota up --workflow app` for the main container-backed development path.
    Use `ota run test` to keep the contract and the implementation aligned.
metadata:
  owner: ota
  team: platform
