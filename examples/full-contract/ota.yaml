version: 1
project:
  name: full-contract
  description: Full example of the current Ota contract surface
  type: application
execution:
  preferred: native
  supported:
    - native
runtimes:
  node: "22"
  python: ">=3.12"
  java:
    version: "21"
    provider: sdkman
    distribution: temurin
    only_on:
      - windows
      - macos
    platforms:
      windows:
        distribution: zulu
tools:
  pnpm:
    version: "10"
  uv: "0.6.0"
  pwsh:
    version: "7.6.0"
    required: false
    only_on:
      - windows
env:
  vars:
    OTA_ENV:
      required: true
      allowed:
        - local
        - ci
    OTA_LOG_LEVEL:
      default: info
      allowed:
        - debug
        - info
        - warn
    PATH:
      prepend:
        - ./node_modules/.bin
  sources:
    - kind: dotenv
      path: .env.local
    - kind: dotenv
      path: .env
tasks:
  setup:
    description: Install project dependencies
    category: setup
    script: |
      pnpm install
      pnpm exec prisma generate
    safe_for_agent: true
  dev:
    description: Start the local development server
    category: dev
    run: pnpm dev
    depends_on:
      - setup
  test:
    description: Run the validation suite
    category: test
    run: pnpm test
    depends_on:
      - setup
    safe_for_agent: true
checks:
  - name: node-installed
    kind: precondition
    severity: error
    run: node --version
    timeout: 10
  - name: repo-tests
    kind: health
    severity: warn
    run: pnpm test -- --runInBand
agent:
  entrypoint: setup
  default_task: test
  safe_tasks:
    - setup
    - test
  verify_after_changes:
    - test
  writable_paths:
    - src
    - docs
  protected_paths:
    - ota.yaml
    - Cargo.lock
    - LICENSE
  notes: |
    Use `ota validate` before execution and `ota doctor` after contract changes.
    Use `ota run test` to keep the contract and the implementation aligned.
metadata:
  owner: ota
  team: platform
