version: 1
project:
  name: ota-script-example
  description: Minimal script-first repo with an explicit setup and verification workflow
  type: application
tasks:
  setup:
    description: Prepare generated files with an inline shell script
    category: setup
    script: |
      mkdir -p .ota
      printf ready > .ota/state.txt
  test:
    description: Validate the prepared state
    category: test
    depends_on:
      - setup
    run: test -f .ota/state.txt
workflows:
  default: bootstrap
  bootstrap:
    description: Canonical script-driven setup and verification path
    setup:
      task: setup
    run:
      task: test
    notes: |
      Use this when the repo value is generated state or filesystem preparation rather than a package toolchain.
agent:
  entrypoint: setup
  default_task: test
  safe_tasks:
    - setup
    - test
  verify_after_changes:
    - test
  writable_paths:
    - .ota
    - scripts
    - tests
  protected_paths:
    - ota.yaml
  notes: |
    Use `ota workflows` to inspect the script-driven front door before running tasks directly.
    Use the setup step to prepare generated files before validation.
    Use `ota run test` as the confirmation path after edits.
