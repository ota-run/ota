version: 1
project:
  name: basic-rust
  description: Basic Rust repo with a Rustup-backed toolchain and Cargo tasks
  type: application
toolchains:
  rust:
    version: "1.94.0"
    components:
      - rustfmt
tasks:
  setup:
    description: Fetch Cargo dependencies
    run: cargo fetch
    requirements:
      toolchains:
        - rust
  build:
    description: Compile the crate
    run: cargo build
    depends_on:
      - setup
    requirements:
      toolchains:
        - rust
  fmt:
    description: Check Rust formatting through the selected toolchain
    run: cargo fmt --check
    depends_on:
      - setup
    requirements:
      toolchains:
        - rust
  test:
    description: Run the Cargo test suite
    run: cargo test
    depends_on:
      - fmt
      - build
    requirements:
      toolchains:
        - rust
workflows:
  default: verify
  verify:
    description: Canonical Rustup-backed setup, format, build, and verification path
    setup:
      task: setup
    run:
      task: test
    notes: |
      Use this when you want the repo front door instead of calling Cargo commands ad hoc.
agent:
  entrypoint: setup
  default_task: test
  safe_tasks:
    - setup
    - fmt
    - build
    - test
  verify_after_changes:
    - fmt
    - test
  writable_paths:
    - src
    - tests
    - docs
  protected_paths:
    - ota.yaml
  notes: |
    Use `ota workflows` to inspect the main Rust path before running direct tasks.
    The selected Rust toolchain is the owner for `cargo` and `rustfmt`; do not restate those
    capabilities under `runtimes` or `tools`.
    Use `ota run test` after edits and keep changes small and reviewable.
    Use `ota run build` to confirm the crate still compiles before broader verification.
