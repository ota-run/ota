version: 1
project:
  name: basic-rust
  description: Basic Rust repo with Cargo tasks
  type: application
runtimes:
  rust: "1.85"
tools:
  cargo: "*"
tasks:
  setup:
    run: cargo fetch
  build:
    run: cargo build
    depends_on:
      - setup
  test:
    run: cargo test
    depends_on:
      - setup
checks:
  - name: rust-installed
    kind: precondition
    severity: error
    run: rustc --version
