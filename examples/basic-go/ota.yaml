version: 1
project:
  name: basic-go
runtimes:
  go: "1.24"
tasks:
  setup:
    run: go mod download
  test:
    run: go test ./...
checks:
  - name: go-installed
    kind: precondition
    severity: error
    run: go version
agent:
  entrypoint: setup
  default_task: test
  safe_tasks:
    - setup
    - test
  verify_after_changes:
    - test
  writable_paths:
    - .
    - docs
    - tests
  protected_paths:
    - ota.yaml
  notes: |
    Use `ota validate` before changes and `ota run test` after edits.
    Use `ota run test` as the main verification step for Go changes.
