version: 1
project:
  name: systemd-host-service
  description: Host-managed systemd service ownership with derived lifecycle and structured active readiness
  type: application

execution:
  default_context: host
  contexts:
    host:
      backend: native
      requirements:
        tools:
          systemctl: "*"

services:
  redis:
    manager:
      kind: host
      host:
        kind: systemd
        unit: redis.service
        scope: system
    readiness:
      kind: systemd_active
      interval: 2s
      retries: 5
      start_period: 1s

tasks:
  verify:
    description: Check that the app can still talk to the declared host service
    command:
      exe: redis-cli
      args:
        - ping
    requires_services:
      - redis
    requirements:
      tools:
        redis-cli: "*"

workflows:
  default: host-redis
  host-redis:
    intent: local_development
    description: Bring the declared systemd service under ota readiness and then verify it
    services:
      required:
        - redis
    run:
      task: verify

metadata:
  ota:
    minimum_version: "1.6.21"
