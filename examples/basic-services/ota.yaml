version: 1
project:
  name: basic-services
execution:
  default_context: host
  contexts:
    host:
      backend: native
      requirements:
        tools:
          docker: "*"
services:
  api:
    manager:
      kind: compose
      name: local
      file: docker-compose.yml
      service: api
    endpoints:
      host:
        address: 127.0.0.1
        port: 3000
    readiness:
      from: host
      kind: http
      method: GET
      path: /health
      headers:
        Accept: application/json
      success:
        status: [200]
      body:
        contains: '"ok":true'
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
  postgres:
    manager:
      kind: compose
      name: local
      file: docker-compose.yml
      service: postgres
    endpoints:
      host:
        address: 127.0.0.1
        port: 5432
    readiness:
      from: host
      kind: tcp
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
  redis:
    manager:
      kind: compose
      name: local
      file: docker-compose.yml
      service: redis
    endpoints:
      host:
        address: 127.0.0.1
        port: 6379
    readiness:
      from: host
      kind: tcp
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
tasks:
  setup:
    context: host
    run: pnpm install
  dev:
    context: host
    run: pnpm dev
    depends_on:
      - setup
    requires_services:
      - api
      - postgres
      - redis
agent:
  entrypoint: setup
  default_task: dev
  safe_tasks:
    - setup
  verify_after_changes:
    - dev
  writable_paths:
    - src
    - infra
    - docs
  protected_paths:
    - ota.yaml
  notes: |
    Use `ota up` before starting the service stack.
    Keep service startup and readiness in the contract instead of in README prose.
