version: 1
project:
  name: basic-java
  description: Basic Java repo with Maven tasks
  type: application
runtimes:
  java: "21"
tools:
  maven: "*"
tasks:
  build:
    run: mvn package
  test:
    run: mvn test
checks:
  - name: java-installed
    kind: precondition
    severity: error
    run: java --version
agent:
  entrypoint: build
  default_task: test
  safe_tasks:
    - build
    - test
  verify_after_changes:
    - test
  writable_paths:
    - src
    - test
    - docs
  protected_paths:
    - ota.yaml
  notes: |
    Use `ota validate` before execution and `ota run test` after changes.
    Build and test are the primary safe paths for this example.
