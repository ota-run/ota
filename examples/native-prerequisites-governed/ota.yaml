version: 1
project:
  name: native-prerequisites-governed
  description: Canonical manager-scoped native prerequisite example with governed host package truth
  type: application
native_prerequisites:
  node-native-build-tools:
    description: Native compiler toolchain for source installs
    platforms:
      linux:
        check: node-native-build-tools-linux
        apt:
          - build-essential
          - python3
      macos:
        check: node-native-build-tools-macos
        xcode_clt: true
        brew:
          - pkg-config
      windows:
        check: node-native-build-tools-windows
        visual_studio:
          components:
            - Microsoft.VisualStudio.Component.VC.Tools.x86.x64
        winget:
          - Microsoft.VisualStudio.2022.BuildTools
checks:
  - name: node-native-build-tools-linux
    kind: precondition
    severity: error
    run: sh -c "cc --version && python3 --version"
  - name: node-native-build-tools-macos
    kind: precondition
    severity: error
    run: sh -c "xcode-select -p && pkg-config --version"
  - name: node-native-build-tools-windows
    kind: precondition
    severity: error
    run: where cl
tasks:
  setup:
    description: Install repo dependencies after the selected host-native build tools are available
    run: pnpm install --frozen-lockfile
    requirements:
      native:
        - node-native-build-tools
workflows:
  default: contributor
  contributor:
    intent: local_development
    description: Keep host package truth manager-scoped and OS-specific
    setup:
      task: setup
