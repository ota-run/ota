version: 1
project:
  name: ensure-container-network
  description: Canonical deterministic external Docker network bootstrap using action.kind ensure_container_network
  type: application
tasks:
  network:ensure:
    description: Ensure the shared Docker network exists before Compose-managed projects attach to it
    action:
      kind: ensure_container_network
      name: penpot_shared
