version: 1
project:
  name: ota
  description: Ota CLI and Contract Engine
  type: application
metadata:
  team: Engineering
  owner: ota
  repo_class: open-core
execution:
  preferred: native
  supported:
    - native
tools:
  cargo: "*"
checks:
  - name: rust-installed
    kind: precondition
    severity: error
    run: rustc --version
tasks:
  setup:
    description: Fetch Rust dependencies
    category: setup
    run: cargo fetch
    safe_for_agent: true
  build:
    description: Compile the CLI
    category: build
    run: cargo build
    depends_on:
      - setup
    safe_for_agent: true
  fmt:
    description: Check Rust formatting
    category: test
    run: cargo fmt --check
    safe_for_agent: true
  check:
    description: Type-check the crate
    category: test
    run: cargo check
    depends_on:
      - setup
    safe_for_agent: true
  test:
    description: Run the Rust test suite
    category: test
    run: cargo test
    depends_on:
      - setup
    safe_for_agent: true
  ci:
    description: Run the standard local verification suite
    category: test
    script: |
      cargo fmt --check
      cargo check
      cargo test -- --test-threads=1
    depends_on:
      - setup
    safe_for_agent: true
  doctor-annotations:
    description: Render ota doctor findings for CI or local review
    category: dev
    inputs:
      render_format:
        description: Output format for findings rendering
        default: plain
        allowed:
          - plain
          - github
    script: |
      ota doctor --json . > doctor.json || true
      sh scripts/emit-ota-findings.sh --mode doctor --format "${OTA_INPUT_RENDER_FORMAT}" --input doctor.json
    variants:
      - when:
          os: windows
        script: |
          ota doctor --json . > doctor.json
          powershell -ExecutionPolicy Bypass -File .\scripts\emit-ota-findings.ps1 -Mode doctor -Format $env:OTA_INPUT_RENDER_FORMAT -Input doctor.json
    depends_on:
      - setup
    safe_for_agent: true
  compat:
    description: Run the compatibility test gate
    category: test
    script: |
      cargo test contract_is_stable
      cargo test --test json_schema_contracts
      cargo test --test detect_fixtures
    depends_on:
      - setup
    safe_for_agent: true
  release-gate:
    description: Run the GitHub Actions verification suite
    category: test
    script: |
      cargo test --test real_repo_fixtures
      cargo test --test examples_validate
    depends_on:
      - ci
      - compat
    safe_for_agent: true
  bump-version:
    description: Bump Cargo.toml to a new release version
    category: release
    script: |
      ./scripts/bump-version.sh
    inputs:
      version:
        description: New release version to apply
        required: true
    depends_on:
      - ci
  install:
    description: Reinstall ota from the local workspace
    category: dev
    run: ./scripts/install.sh --from-source
    variants:
      - when:
          os: windows
        run: powershell -ExecutionPolicy Bypass -File .\scripts\install.ps1 -FromSource
    depends_on:
      - ci
agent:
  entrypoint: setup
  default_task: ci
  safe_tasks:
    - setup
    - build
    - fmt
    - check
    - test
    - ci
    - doctor-annotations
  verify_after_changes:
    - fmt
    - check
    - test
    - ci
  writable_paths:
    - src
    - docs
    - README.md
    - scripts
    - tests
  protected_paths:
    - Cargo.lock
    - ota.yaml
    - LICENSE
  notes: |
    Treat Ota as the default workflow, the way npm is the default in Node repos.
    Use `ota validate` to verify the contract.
    Use `ota doctor` to inspect readiness and agent guidance.
    Use `ota tasks` to discover runnable repo actions.
    Use `ota run setup` to prepare the repo.
    Use `ota run ci` to run the canonical verification path.
    Prefer narrow changes with regression tests.
    Keep public docs and contracts aligned with implementation.
