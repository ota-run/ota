version: 1
project:
  name: ota
  description: Ota CLI and Contract Engine
  type: application
metadata:
  team: Engineering
  owner: ota
  repo_class: open-core
execution:
  preferred: container
  lifecycle: persistent
  supported:
    - native
    - container
  backends:
    container:
      image: rust:1.95-bookworm
      engines:
        - docker
        - podman
env:
  vars:
    PATH:
      prepend:
        - /usr/local/cargo/bin
        - /usr/local/rustup/bin
tools:
toolchains:
  rust:
    provider: rustup
    version: "1.95.0"
    fulfillment: run
checks:
  - name: repository-readme
    kind: file
    severity: info
    path: README.md
    expect: file
tasks:
  setup:
    description: Prepare the Rust toolchain and fetch dependencies
    notes: |
      Use this as the first step in a fresh checkout or after dependency changes.
      Ota fulfills the declared Rust toolchain on the selected execution path, then
      prepares the workspace without compiling the crate.
    category: setup
    internal: true
    run: cargo fetch && rustup component add rustfmt
    safe_for_agent: true
  build:
    description: Compile the CLI
    notes: |
      Use this when you want to confirm the crate still builds after code changes.
    category: build
    run: cargo build
    depends_on:
      - setup
    safe_for_agent: true
  fmt:
    description: Check Rust formatting
    notes: |
      Use this before committing to catch formatting drift early.
    category: test
    run: cargo fmt --check
    safe_for_agent: true
  check:
    description: Type-check the crate
    notes: |
      Use this for a fast compiler-only verification pass without running tests.
    category: test
    run: cargo check
    depends_on:
      - setup
    safe_for_agent: true
  test:
    description: Run the Rust test suite
    notes: |
      Use this when you want the full unit and integration test coverage.
    category: test
    run: cargo test
    depends_on:
      - setup
    safe_for_agent: true
  ci:
    description: Run the standard local verification suite
    notes: |
      Use this as the canonical local pre-commit gate.
      It matches the light-weight verification path used during development.
      A few process-global tests run in separate cargo invocations so container CI
      preserves coverage without leaking test-local PATH or service state.
    category: test
    script: |
      set -e
      cargo fmt --check
      cargo check
      cargo test --lib -- --test-threads=1 \
        --skip cli::tests::up_skips_policy_backed_provisioning_when_doctor_is_ready \
        --skip doctor::tests::remote_doctor_mode_probes_tool_versions_through_remote_contexts \
        --skip runner::tests::restart_ready_activation_restarts_reachable_backend_provider_host_producer \
        --skip runner::tests::restart_ready_activation_restarts_reachable_backend_provider_topology_target \
        --skip runner::tests::restart_ready_activation_restarts_reachable_native_producer
      cargo test up_skips_policy_backed_provisioning_when_doctor_is_ready --lib -- --test-threads=1
      cargo test remote_doctor_mode_probes_tool_versions_through_remote_contexts --lib -- --test-threads=1
      cargo test restart_ready_activation_restarts_reachable --lib -- --test-threads=1
    variants:
      - when:
          os: windows
        script: |
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --lib -- --test-threads=1 --skip cli::tests::up_skips_policy_backed_provisioning_when_doctor_is_ready --skip doctor::tests::remote_doctor_mode_probes_tool_versions_through_remote_contexts --skip runner::tests::restart_ready_activation_restarts_reachable_backend_provider_host_producer --skip runner::tests::restart_ready_activation_restarts_reachable_backend_provider_topology_target --skip runner::tests::restart_ready_activation_restarts_reachable_native_producer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test up_skips_policy_backed_provisioning_when_doctor_is_ready --lib -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test remote_doctor_mode_probes_tool_versions_through_remote_contexts --lib -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test restart_ready_activation_restarts_reachable --lib -- --test-threads=1
    depends_on:
      - setup
    safe_for_agent: true
  doctor-annotations:
    description: Render ota doctor findings for CI or local review
    notes: |
      Use this to turn ota doctor JSON into plain CI output or GitHub annotations.
      It is the repo-side adapter for hosted validation demos and PR checks.
    category: dev
    inputs:
      render_format:
        description: Output format for findings rendering
        default: plain
        allowed:
          - plain
          - github
    script: |
      ota doctor --json . | ota annotations --mode doctor --format "${OTA_INPUT_RENDER_FORMAT}" --input -
    variants:
      - when:
          os: windows
        script: |
          ota doctor --json . | ota annotations --mode doctor --format $env:OTA_INPUT_RENDER_FORMAT --input -
    depends_on:
      - setup
    safe_for_agent: true
  contract:validate:
    description: Validate the ota repo contract with the current checkout
    notes: |
      Use this to self-host the contract validator against `./ota.yaml`.
      It exercises hook follow-ups inside the main repo without touching build artifacts or snapshots.
    category: dev
    run: cargo run --quiet -- validate ./ota.yaml --plain
    after_success:
      - contract:tasks
    after_failure:
      - contract:doctor
    depends_on:
      - setup
    safe_for_agent: true
  contract:tasks:
    description: Show the next runnable task surface after contract validation succeeds
    notes: |
      Use this as the success follow-up for `ota run contract:validate`.
      It keeps the repo contract self-hosting by pointing straight at the validated task surface.
    category: dev
    run: cargo run --quiet -- tasks . --use --plain
    safe_for_agent: true
  contract:doctor:
    description: Show readiness detail after contract validation fails
    notes: |
      Use this as the failure follow-up for `ota run contract:validate`.
      It points the operator at concrete readiness findings instead of stopping at a raw validation error.
    category: dev
    run: cargo run --quiet -- doctor . --plain
    safe_for_agent: true
  compat:
    description: Run the compatibility test gate
    notes: |
      Use this to validate schema stability and fixture coverage before release work.
    category: test
    script: |
      set -e
      cargo test contract_is_stable
      cargo test --test json_schema_contracts
      cargo test --test json_output_conformance
      cargo test --test detect_fixtures
    variants:
      - when:
          os: windows
        script: |
          cargo test contract_is_stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --test json_schema_contracts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --test json_output_conformance
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --test detect_fixtures
    depends_on:
      - setup
    safe_for_agent: true
  release-gate:
    description: Run the GitHub Actions verification suite
    notes: |
      Use this to verify the repo against the release gate checks that run in GitHub Actions.
    category: test
    script: |
      set -e
      if [ "$OSTYPE" != "msys" ] && [ "$OSTYPE" != "win32" ]; then
        cargo test --test real_repo_fixtures -- --test-threads=1
        cargo test --test examples_validate -- --test-threads=1
      else
        echo "Skipping integration tests on Windows"
      fi
    variants:
      - when:
          os: windows
        script: |
          echo Skipping integration tests on Windows
    depends_on:
      - ci
      - compat
    safe_for_agent: true
  ux-review:
    description: Run the premium CLI UX review suite
    notes: |
      Use this after changing help text, human-readable command output, or docs that promise
      specific CLI presentation. It keeps the premium snapshot-backed text surfaces honest.
    category: test
    script: |
      cargo test snapshot_is_stable -- --test-threads=1
    depends_on:
      - setup
    safe_for_agent: true
  ux:refresh:
    description: Refresh premium CLI UX snapshots
    notes: |
      Use this when snapshot-backed output intentionally changes. It updates snapshots before
      rerunning `ota run ux-review`.
    category: test
    inputs:
      test_threads:
        description: Test threads for snapshot refresh (default 1)
        default: "1"
    script: |
      OTA_UPDATE_SNAPSHOTS=1 cargo test snapshot_is_stable -- --test-threads=${OTA_INPUT_TEST_THREADS}
    depends_on:
      - setup
    safe_for_agent: true
  bump:version:
    description: Bump the repo release version surfaces
    notes: |
      Use this through `ota run bump:version --version <patch|minor|major>` when preparing
      a release and you need to update Cargo.toml, CHANGELOG.md, and the readiness workflow
      pin consistently.
    category: release
    script: |
      ./scripts/bump-version.sh
    inputs:
      version:
        description: Release bump selector (`patch`, `minor`, `major`) or explicit semver version
        required: true
    depends_on:
      - ci
  install:
    description: Reinstall ota from the local workspace
    notes: |
      Use this after local changes when you want the installed ota binary to point at this checkout.
    category: dev
    execution:
      default_mode: native
    run: ./scripts/install.sh --from-source
    variants:
      - when:
          os: windows
        run: powershell -ExecutionPolicy Bypass -File .\scripts\install.ps1 -FromSource
  install:from:source:
    description: Reinstall ota from the local workspace source
    notes: |
      Use this when you want a task name that makes the source-based reinstall path explicit.
    category: dev
    execution:
      default_mode: native
    run: ./scripts/install.sh --from-source
    variants:
      - when:
          os: windows
        run: powershell -ExecutionPolicy Bypass -File .\scripts\install.ps1 -FromSource
agent:
  entrypoint: setup
  default_task: ci
  safe_tasks:
    - setup
    - build
    - fmt
    - check
    - test
    - ci
    - contract:validate
    - doctor-annotations
  verify_after_changes:
    - fmt
    - check
    - test
    - ci
  writable_paths:
    - src
    - docs
    - README.md
    - scripts
    - tests
  protected_paths:
    - Cargo.lock
    - ota.yaml
    - LICENSE
  bootstrap:
    ota:
      note: Only install ota if it is missing and installation is approved.
      sh: curl -fsSL https://dist.ota.run/install.sh | sh
      powershell: irm https://dist.ota.run/install.ps1 | iex
  notes: |
    Treat Ota as the default workflow, the way npm is the default in Node repos.
    Use `ota validate` to verify the contract.
    Use `ota doctor` to inspect readiness and agent guidance.
    Use `ota tasks` to discover runnable repo actions.
    Use `ota run setup` to prepare the repo.
    Use `ota run contract:validate` to self-host the contract validator against this checkout.
    Use `ota run ci` to run the canonical verification path.
    Prefer narrow changes with regression tests.
    Keep public docs and contracts aligned with implementation.
