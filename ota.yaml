version: 1
project:
  name: ota
  description: Ota CLI and Contract Engine
  type: application
metadata:
  team: Engineering
  owner: ota
  repo_class: open-core
execution:
  preferred: container
  lifecycle: ephemeral
  supported:
    - native
    - container
  backends:
    container:
      image: rust:1.94-bookworm
      engines:
        - docker
        - podman
env:
  PATH:
    prepend:
      - /usr/local/cargo/bin
      - /usr/local/rustup/bin
tools:
  cargo: "*"
checks:
  - name: rust-installed
    kind: precondition
    severity: error
    run: rustc --version
tasks:
  setup:
    description: Fetch Rust dependencies
    notes: |
      Use this as the first step in a fresh checkout or after dependency changes.
      It prepares the workspace without compiling the crate.
    category: setup
    run: cargo fetch
    safe_for_agent: true
  build:
    description: Compile the CLI
    notes: |
      Use this when you want to confirm the crate still builds after code changes.
    category: build
    run: cargo build
    depends_on:
      - setup
    safe_for_agent: true
  fmt:
    description: Check Rust formatting
    notes: |
      Use this before committing to catch formatting drift early.
    category: test
    run: cargo fmt --check
    safe_for_agent: true
  check:
    description: Type-check the crate
    notes: |
      Use this for a fast compiler-only verification pass without running tests.
    category: test
    run: cargo check
    depends_on:
      - setup
    safe_for_agent: true
  test:
    description: Run the Rust test suite
    notes: |
      Use this when you want the full unit and integration test coverage.
    category: test
    run: cargo test
    depends_on:
      - setup
    safe_for_agent: true
  ci:
    description: Run the standard local verification suite
    notes: |
      Use this as the canonical local pre-commit gate.
      It matches the light-weight verification path used during development.
    category: test
    script: |
      cargo fmt --check
      cargo check
      cargo test -- --test-threads=1
    depends_on:
      - setup
    safe_for_agent: true
  doctor-annotations:
    description: Render ota doctor findings for CI or local review
    notes: |
      Use this to turn ota doctor JSON into plain CI output or GitHub annotations.
      It is the repo-side adapter for hosted validation demos and PR checks.
    category: dev
    inputs:
      render_format:
        description: Output format for findings rendering
        default: plain
        allowed:
          - plain
          - github
    script: |
      ota doctor --json . | ota annotations --mode doctor --format "${OTA_INPUT_RENDER_FORMAT}" --input -
    variants:
      - when:
          os: windows
        script: |
          ota doctor --json . | ota annotations --mode doctor --format $env:OTA_INPUT_RENDER_FORMAT --input -
    depends_on:
      - setup
    safe_for_agent: true
  compat:
    description: Run the compatibility test gate
    notes: |
      Use this to validate schema stability and fixture coverage before release work.
    category: test
    script: |
      cargo test contract_is_stable
      cargo test --test json_schema_contracts
      cargo test --test detect_fixtures
    depends_on:
      - setup
    safe_for_agent: true
  release-gate:
    description: Run the GitHub Actions verification suite
    notes: |
      Use this to verify the repo against the release gate checks that run in GitHub Actions.
    category: test
    script: |
      cargo test --test real_repo_fixtures
      cargo test --test examples_validate
    depends_on:
      - ci
      - compat
    safe_for_agent: true
  bump-version:
    description: Bump Cargo.toml to a new release version
    notes: |
      Use this when preparing a release and you need to update Cargo.toml consistently.
    category: release
    script: |
      ./scripts/bump-version.sh
    inputs:
      version:
        description: New release version to apply
        required: true
    depends_on:
      - ci
  install:
    description: Reinstall ota from the local workspace
    notes: |
      Use this after local changes when you want the installed ota binary to point at this checkout.
    category: dev
    run: ./scripts/install.sh --from-source
    variants:
      - when:
          os: windows
        run: powershell -ExecutionPolicy Bypass -File .\scripts\install.ps1 -FromSource
    depends_on:
      - ci
  install-from-source:
    description: Reinstall ota from the local workspace source
    notes: |
      Use this when you want a task name that makes the source-based reinstall path explicit.
    category: dev
    run: ./scripts/install.sh --from-source
    variants:
      - when:
          os: windows
        run: powershell -ExecutionPolicy Bypass -File .\scripts\install.ps1 -FromSource
    depends_on:
      - ci

agent:
  entrypoint: setup
  default_task: ci
  safe_tasks:
    - setup
    - build
    - fmt
    - check
    - test
    - ci
    - doctor-annotations
  verify_after_changes:
    - fmt
    - check
    - test
    - ci
  writable_paths:
    - src
    - docs
    - README.md
    - scripts
    - tests
  protected_paths:
    - Cargo.lock
    - ota.yaml
    - LICENSE
  notes: |
    Treat Ota as the default workflow, the way npm is the default in Node repos.
    Use `ota validate` to verify the contract.
    Use `ota doctor` to inspect readiness and agent guidance.
    Use `ota tasks` to discover runnable repo actions.
    Use `ota run setup` to prepare the repo.
    Use `ota run ci` to run the canonical verification path.
    Prefer narrow changes with regression tests.
    Keep public docs and contracts aligned with implementation.
