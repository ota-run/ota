[package]
name = "ota"
version = "0.1.5"
edition = "2024"

[dependencies]
clap = { version = "4.5.39", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
thiserror = "2.0.12"
toml = "0.8.23"
time = { version = "0.3.44", features = ["formatting", "macros"] }

[dev-dependencies]
tempfile = "3.23.0"
