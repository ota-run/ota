[package]
name = "ota"
version = "1.6.23"
edition = "2024"
license = "Apache-2.0"

[dependencies]
clap = { version = "4.5.39", features = ["derive"] }
clap_complete = { version = "4.6.2", features = ["unstable-dynamic"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
semver = "1.0.27"
thiserror = "2.0.12"
toml = "1.1.2"
time = { version = "0.3.48", features = ["formatting", "macros"] }
dotenvy = "0.15.7"
ctrlc = "3.5.0"
signal-hook = "0.3.18"
jsonschema = { version = "0.18.3", features = ["draft202012"] }
getrandom = "0.2.16"
fs2 = "0.4.3"
sha2 = "0.10.9"

[dev-dependencies]
tempfile = "3.23.0"
