[package]
name = "ota"
version = "1.6.28"
edition = "2024"
license = "Apache-2.0"

[features]
# Non-default fault injection used only by publication regression tests.
test-candidate-publication-faults = []
test-effect-refusal-archive-faults = []
test-proof-assurance-faults = []

[dependencies]
clap = { version = "4.5.39", features = ["derive"] }
clap_complete = { version = "4.6.2", features = ["unstable-dynamic"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
semver = "1.0.27"
thiserror = "2.0.12"
toml = "1.1.2"
time = { version = "0.3.48", features = ["formatting", "macros"] }
dotenvy = "0.15.7"
ctrlc = "3.5.0"
signal-hook = "0.3.18"
jsonschema = { version = "0.18.3", features = ["draft202012"] }
getrandom = "0.2.16"
fs2 = "0.4.3"
include_dir = "0.7.4"
sha2 = "0.10.9"
base64 = "0.22.1"
ed25519-dalek = "3.0.0"
serde_jcs = "0.2.0"
ota-authority-protocol = { git = "https://github.com/ota-run/authority-protocol.git", rev = "04a199a1eddd72b5b61958e0fe7f2d4e662e05cf" }
quick-xml = "0.41.0"
tempfile = "3.23.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.177"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
