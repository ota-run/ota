[package]
name = "ota"
version = "1.4.18"
edition = "2024"

[dependencies]
clap = { version = "4.5.39", features = ["derive"] }
clap_complete = { version = "4.6.2", features = ["unstable-dynamic"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
semver = "1.0.27"
thiserror = "2.0.12"
toml = "1.1.2"
time = { version = "0.3.44", features = ["formatting", "macros"] }

[dev-dependencies]
tempfile = "3.23.0"
