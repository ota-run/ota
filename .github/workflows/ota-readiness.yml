name: Ota Readiness

on:
  pull_request:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  json-schema-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Verify JSON schema/output conformance
        run: |
          cargo test --test json_schema_contracts
          cargo test --test json_output_conformance

  readiness:
    runs-on: ubuntu-latest
    needs: json-schema-guard

    steps:
      - uses: actions/checkout@v5
      - name: Publish ota readiness
        uses: ota-run/action@v1
        with:
          command: receipt
          path: .
          ota-version: 1.6.16
          execution-mode: container
          archive: true
          artifact-name: ota-readiness
          github-token: ${{ github.token }}
