name: Ota Readiness

on:
  pull_request:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref_name || github.run_id }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  json-schema-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Verify JSON schema/output conformance
        run: |
          cargo test --test json_schema_contracts
          cargo test --test json_output_conformance
      - name: Verify native Podman engine-unavailable classification
        run: cargo test run_failure_text_classifies_podman_engine_unavailable_for_native_compose_task --lib -- --test-threads=1

  readiness:
    runs-on: ubuntu-latest
    needs: json-schema-guard

    steps:
      - uses: actions/checkout@v7
      - name: Install ota from contract truth
        uses: ota-run/setup@v1.0.8
        with:
          source: contract
      - name: Prepare ota repo readiness path
        run: ota up --mode container --json . > ota-readiness.json
      - name: Upload ota readiness artifact
        uses: actions/upload-artifact@v4
        with:
          name: ota-readiness
          path: ota-readiness.json
