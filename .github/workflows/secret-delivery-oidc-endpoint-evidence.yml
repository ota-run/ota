name: secret-delivery-oidc-endpoint-evidence

on:
  workflow_dispatch:
  push:
    branches:
      - 1.6.28-implementation
    paths:
      - ".github/workflows/secret-delivery-oidc-endpoint-evidence.yml"

permissions:
  contents: read
  id-token: write

jobs:
  capture-endpoint-shape:
    runs-on:
      - self-hosted
      - linux
      - arm64
    timeout-minutes: 5

    steps:
      - name: Capture non-secret endpoint evidence
        shell: bash
        env:
          EVIDENCE_PATH: ${{ runner.temp }}/secret-delivery-oidc-endpoint-evidence.json
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path
          from urllib.parse import parse_qsl, urlsplit

          request_url = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_URL", "")
          request_token = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_TOKEN", "")
          if not request_url or not request_token:
              raise SystemExit("GitHub OIDC request capability is unavailable")

          parsed = urlsplit(request_url)
          if parsed.scheme != "https" or not parsed.hostname or parsed.username or parsed.password:
              raise SystemExit("GitHub OIDC request endpoint is not canonical HTTPS")
          if parsed.fragment:
              raise SystemExit("GitHub OIDC request endpoint contains a fragment")

          uuid = re.compile(
              r"^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-"
              r"[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
          )
          opaque = re.compile(r"^[A-Za-z0-9_-]{16,}$")

          def classify_segment(segment):
              if uuid.fullmatch(segment):
                  return "{uuid}"
              if segment.isdecimal():
                  return "{decimal}"
              if opaque.fullmatch(segment):
                  return "{opaque}"
              if not re.fullmatch(r"[A-Za-z0-9._~-]+", segment):
                  return "{encoded}"
              return segment

          path_shape = "/".join(classify_segment(part) for part in parsed.path.split("/"))
          query_pairs = parse_qsl(parsed.query, keep_blank_values=True, strict_parsing=True)
          query_keys = sorted(key for key, _ in query_pairs)
          if len(query_keys) != len(set(query_keys)):
              raise SystemExit("GitHub OIDC request endpoint contains duplicate query keys")

          runner_version = None
          pid = os.getppid()
          for _ in range(16):
              try:
                  executable = Path(os.readlink(f"/proc/{pid}/exe"))
                  stat = Path(f"/proc/{pid}/stat").read_text(encoding="utf-8")
                  closing = stat.rfind(")")
                  parent_pid = int(stat[closing + 1 :].split()[1])
              except (FileNotFoundError, PermissionError, ValueError):
                  break
              if executable.name == "Runner.Worker":
                  listener = executable.parent / "Runner.Listener"
                  result = subprocess.run(
                      [str(listener), "--version"],
                      check=True,
                      capture_output=True,
                      text=True,
                      timeout=10,
                  )
                  runner_version = result.stdout.strip()
                  break
              if parent_pid <= 1 or parent_pid == pid:
                  break
              pid = parent_pid
          if not runner_version or not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", runner_version):
              raise SystemExit("self-hosted GitHub Runner version is unavailable")

          evidence = {
              "schema_version": 1,
              "evidence_kind": "github_actions_self_hosted_oidc_request_endpoint",
              "source": {
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "revision": os.environ["GITHUB_SHA"],
                  "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
                  "run_id": os.environ["GITHUB_RUN_ID"],
                  "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              },
              "runner": {
                  "environment": "self-hosted",
                  "os": os.environ["RUNNER_OS"].lower(),
                  "architecture": os.environ["RUNNER_ARCH"].lower(),
                  "version": runner_version,
              },
              "request_endpoint": {
                  "scheme": parsed.scheme,
                  "host": parsed.hostname.lower(),
                  "port": parsed.port,
                  "path_shape": path_shape,
                  "query_keys": query_keys,
                  "audience_present": "audience" in query_keys,
                  "userinfo_present": False,
                  "fragment_present": False,
              },
              "provider_contact": "not_attempted",
              "bearer_retained": False,
              "request_url_values_retained": False,
          }
          output = Path(os.environ["EVIDENCE_PATH"])
          output.write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload endpoint evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: secret-delivery-oidc-endpoint-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/secret-delivery-oidc-endpoint-evidence.json
          if-no-files-found: error
          retention-days: 30
