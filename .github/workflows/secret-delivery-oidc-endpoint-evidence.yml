      - name: Prove the protected Core command reaches the provider-free boundary
        shell: bash
        env:
          CLIENT_RESULT: ${{ runner.temp }}/secret-delivery-service-path-client.json
          CLIENT_PUBLIC_RESULT: ${{ runner.temp }}/secret-delivery-service-path-client-public.json
          CLIENT_STDERR: ${{ runner.temp }}/secret-delivery-service-path-client.stderr.txt
          CLIENT_PRIVACY_STDERR: ${{ runner.temp }}/secret-delivery-service-path-client-privacy-stderr.txt
          CLIENT_DIAGNOSTIC: ${{ runner.temp }}/secret-delivery-service-path-client-diagnostic.json
          PRIVATE_DISCLOSURE_PATTERN: provider_binding|source_evidence|private_locator|secret_version|protected_launcher_capability|secret_delivery_(binding|source|invocation|evaluation|plan|transaction)
        run: |
          set -euo pipefail

          runner_version="$(
            python3 "$CORE_SOURCE/.github/ota/verify-protected-runner-listener.py" \
              --installation-evidence "$INSTALLATION_EVIDENCE"
          )"
          export OTA_CAPABILITY_OBSERVATION_RUNNER_VERSION="$runner_version"
          cmp \
            "$CORE_SOURCE/docs/pressure/fixtures/secret-delivery-service-path/ota.yaml" \
            "$PRESSURE_REPOSITORY/ota.yaml"
          test ! -e "$PRESSURE_REPOSITORY/selected-work-executed"

          set +e
          "$CLIENT" \
            --authority-id "$AUTHORITY_ID" \
            --repository "$PRESSURE_REPOSITORY" \
            --json -- run governed --grant "$AUTHORITY_ID" \
            >"$CLIENT_RESULT" 2>"$CLIENT_STDERR"
          client_status=$?
          set -e

          CLIENT_STATUS="$client_status" python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          result_path = Path(os.environ["CLIENT_RESULT"])
          stderr_path = Path(os.environ["CLIENT_STDERR"])
          try:
              result = json.loads(result_path.read_text())
          except (OSError, json.JSONDecodeError):
              result = None
          try:
              stderr = stderr_path.read_text()
          except OSError:
              stderr = None
          plain_stderr = (
              re.sub(r"\x1b\[[0-9;]*m", "", stderr) if stderr is not None else None
          )
          normalized_stderr = (
              " ".join(plain_stderr.split()) if plain_stderr is not None else None
          )
          expected_provider_free_refusal = (
              "selected secret requirements reached the verified same-child "
              "snapshot-bound transaction boundary, but provider contact remains unavailable "
              "in this V12.1 Step 7 slice; refusing before provider contact or task execution"
          )
          terminal = result.get("terminal") if isinstance(result, dict) else None
          stage_markers = [
              "capability_observation_issued",
              "capability_observation_response_received",
              "projection_verifier_load_refused",
              "projection_verifier_loaded",
              "same_child_prelude_reconciliation_refused",
              "same_child_prelude_reconciled",
              "same_child_prelude_structure_invalid",
              "same_child_capability_observation_reconciliation_refused",
              "same_child_startup_continuation_invalid",
              "same_child_session_identity_derivation_refused",
              "same_child_startup_continuation_identity_invalid",
              "same_child_observation_request_identity_mismatch",
              "same_child_projection_identity_mismatch",
              "same_child_verifier_identity_mismatch",
              "same_child_installation_evidence_identity_mismatch",
              "same_child_launcher_request_identity_mismatch",
              "same_child_startup_continuation_identity_mismatch",
              "same_child_session_identity_mismatch",
              "same_child_expiry_mismatch",
              "invocation_context_reconstruction_refused",
              "invocation_context_reconstructed",
              "authority_snapshot_issue_refused",
              "authority_snapshot_issued",
              "authority_snapshot_v2_response_reconciled",
              "binding_v3_response_reconciled",
              "binding_v4_response_reconciled",
          ]
          binding_v2_stage_markers = [
              "snapshot_reconciliation_refused",
              "request_invalid",
              "prelude_invalid",
              "challenge_invalid",
              "verifier_invalid",
              "startup_continuation_identity_mismatch",
              "launcher_request_identity_mismatch",
              "prelude_identity_mismatch",
              "snapshot_identity_mismatch",
              "response_shape_invalid",
              "response_request_identity_mismatch",
              "response_prelude_identity_mismatch",
              "response_snapshot_identity_mismatch",
              "response_projection_invalid",
              "binding_invalid",
              "binding_request_identity_mismatch",
              "binding_launcher_request_identity_mismatch",
              "binding_startup_continuation_identity_mismatch",
              "binding_session_identity_mismatch",
              "binding_prelude_identity_mismatch",
              "binding_snapshot_identity_mismatch",
              "binding_candidate_identity_mismatch",
              "binding_observation_identity_mismatch",
              "binding_prelude_launcher_request_mismatch",
              "binding_prelude_startup_continuation_mismatch",
              "binding_prelude_session_mismatch",
              "binding_expiry_mismatch",
              "binding_projection_identity_mismatch",
              "binding_verifier_identity_mismatch",
              "binding_signing_key_identity_mismatch",
              "binding_challenge_identity_mismatch",
              "binding_runner_version_mismatch",
              "binding_installation_evidence_identity_mismatch",
              "unclassified_protocol_refusal",
              "response_reconciled",
              "projection_reuse_mismatch",
          ]
          allowed_pressure_lines = {
              "ota: bounded pressure stage=secret_delivery_" + stage
              for stage in stage_markers
          } | {
              "ota: bounded pressure stage=secret_delivery_binding_v2_" + stage
              for stage in binding_v2_stage_markers
          }
          def strip_closed_pressure_marker(line):
              for allowed_line in allowed_pressure_lines:
                  if line.endswith(allowed_line):
                      return line[:-len(allowed_line)]
              return line

          marker = (
              "ota: bounded pressure stage="
              "secret_delivery_invocation_context_reconstructed"
          )
          privacy_pattern = re.compile(os.environ["PRIVATE_DISCLOSURE_PATTERN"])
          if strip_closed_pressure_marker(marker) != "":
              raise SystemExit("exact pressure marker sanitization failed")
          if strip_closed_pressure_marker("logger: " + marker) != "logger: ":
              raise SystemExit("decorated pressure marker sanitization failed")
          adversarial_markers = [
              marker + "_unexpected",
              marker[:-1],
              marker.replace("reconstructed", "substituted"),
              marker + marker,
              marker + " provider_binding=opaque",
          ]
          if any(
              privacy_pattern.search(strip_closed_pressure_marker(value)) is None
              for value in adversarial_markers
          ):
              raise SystemExit("altered pressure marker escaped privacy detection")
          privacy_stderr_lines = [
              strip_closed_pressure_marker(line)
              for line in (
                  plain_stderr.splitlines() if plain_stderr is not None else []
              )
          ]
          Path(os.environ["CLIENT_PRIVACY_STDERR"]).write_text(
              "\n".join(privacy_stderr_lines) + "\n"
          )
          summary = {
              "schema_version": 1,
              "record_kind": "secret_delivery_service_path_failure_diagnostic",
              "client_status": int(os.environ["CLIENT_STATUS"]),
              "result_json_valid": isinstance(result, dict),
              "expected_client_envelope": isinstance(result, dict)
              and sorted(result) == ["ok", "output_complete", "request_identity", "terminal"],
              "expected_terminal_envelope": isinstance(terminal, dict)
              and sorted(terminal) == [
                  "exit_code",
                  "finalization",
                  "invocation_id",
                  "message_kind",
                  "outcome",
                  "protocol_version",
                  "stage",
              ],
              "stderr_available": stderr is not None,
              "stage_marker_counts": {
                  stage: stderr.count(
                      f"ota: bounded pressure stage=secret_delivery_{stage}"
                  ) if stderr is not None else None
                  for stage in stage_markers
              },
              "binding_v2_stage_counts": {
                  stage: stderr.count(
                      f"ota: bounded pressure stage=secret_delivery_binding_v2_{stage}"
                  ) if stderr is not None else None
                  for stage in binding_v2_stage_markers
              },
              "exact_snapshot_outbound_marker_count": stderr.count(
                  "ota: bounded pressure stage="
                  "secret_delivery_outbound_frame_2_"
                  "authority_snapshot_request_serialized_complete"
              ) if stderr is not None else None,
              "expected_provider_free_refusal_count": normalized_stderr.count(
                  expected_provider_free_refusal
              ) if normalized_stderr is not None else None,
              "identity_pattern_absent": plain_stderr is not None
              and re.search(r"sha256:[0-9a-f]{64}", plain_stderr) is None,
          }
          diagnostic = Path(os.environ["CLIENT_DIAGNOSTIC"])
          diagnostic.write_text(json.dumps(summary, sort_keys=True) + "\n")
          print(diagnostic.read_text(), end="")
          PY

          test "$client_status" -eq 1
          jq -e \
            '.stage_marker_counts.authority_snapshot_v2_response_reconciled == 1
             and .stage_marker_counts.binding_v4_response_reconciled == 1
             and .stage_marker_counts.binding_v3_response_reconciled == 0
             and .binding_v2_stage_counts.response_reconciled == 0' \
            "$CLIENT_DIAGNOSTIC"
          jq -S 'del(.request_identity)' "$CLIENT_RESULT" >"$CLIENT_PUBLIC_RESULT"
          jq -e \
            '.ok == false
             and (keys | sort) == ["ok", "output_complete", "request_identity", "terminal"]
             and .output_complete == true
             and (.terminal | keys | sort) == ["exit_code", "finalization", "invocation_id", "message_kind", "outcome", "protocol_version", "stage"]
             and .terminal.stage == "selected_execution_failed_boundary_removed"
             and .terminal.outcome == "failed"
             and .terminal.exit_code == 1
             and (.terminal.finalization | keys | sort) == ["active_slot_removed", "cgroup_empty_or_absent", "child_identity", "child_reaped", "completion", "identity", "observed_exit_code", "schema_version", "scope_identity", "scope_removed"]
             and ((.terminal.finalization.completion | keys | sort) as $completion_keys
               | $completion_keys == ["crossing_transaction_id", "crossing_transaction_identity", "exit_code", "identity", "invocation_id", "lease_consumption_admission_identity", "message_kind", "outcome", "pending_crossing_transaction_identity", "receipt_status", "schema_version", "work_unit_identity"]
                 or $completion_keys == ["crossing_transaction_id", "crossing_transaction_identity", "exit_code", "identity", "invocation_id", "lease_consumption_admission_identity", "message_kind", "outcome", "pending_crossing_transaction_identity", "receipt_archive_identity", "receipt_status", "schema_version", "work_unit_identity"])
             and .terminal.finalization.child_reaped == true
             and .terminal.finalization.scope_removed == true
             and .terminal.finalization.cgroup_empty_or_absent == true
             and .terminal.finalization.active_slot_removed == true' \
            "$CLIENT_RESULT"
          test ! -e "$PRESSURE_REPOSITORY/selected-work-executed"
          if grep -Eq \
            "$PRIVATE_DISCLOSURE_PATTERN" \
            "$CLIENT_RESULT" "$CLIENT_PRIVACY_STDERR"; then
            echo "protected Core output disclosed secret-delivery correlation material" >&2
            exit 1
          fi
          jq -e \
            '(keys | sort) == ["ok", "output_complete", "terminal"]
             and (.ok == false)
             and (.output_complete == true)' \
            "$CLIENT_PUBLIC_RESULT"
          CLIENT_STDERR="$CLIENT_STDERR" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          expected = (
              "selected secret requirements reached the verified same-child "
              "snapshot-bound transaction boundary, but provider contact remains unavailable "
              "in this V12.1 Step 7 slice; refusing before provider contact or task execution"
          )
          stderr = Path(os.environ["CLIENT_STDERR"]).read_text()
          plain = re.sub(r"\x1b\[[0-9;]*m", "", stderr)
          normalized = " ".join(plain.split())
          if normalized.count(expected) != 1:
              raise SystemExit("protected Core refusal was missing or ambiguous")
          if re.search(r"sha256:[0-9a-f]{64}", plain):
              raise SystemExit("protected Core refusal disclosed an identity")
          PY

      - name: Retain checksummed job-owned failure diagnostic for administrator retrieval
        if: ${{ failure() }}
        shell: bash
        env:
          CLIENT_DIAGNOSTIC: ${{ runner.temp }}/secret-delivery-service-path-client-diagnostic.json
        run: |
          set -euo pipefail
          expected_group="ota-authority-job"
          test "$(stat -c '%U:%G:%a' "$HOSTED_EVIDENCE_ROOT")" = "root:${expected_group}:770"
          test -d "$HOSTED_EVIDENCE_ROOT"
          test ! -L "$HOSTED_EVIDENCE_ROOT"
          if [[ ! -f "$CLIENT_DIAGNOSTIC" ]]; then
            echo "primary failure preceded protected client execution; retaining no synthetic diagnostic" >&2
            exit 0
          fi
          destination="$HOSTED_EVIDENCE_ROOT/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          staging="$HOSTED_EVIDENCE_ROOT/.${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.staging"
          umask 077
          mkdir "$staging"
          trap 'rm -rf -- "$staging"' EXIT
          install -m 0400 "$CLIENT_DIAGNOSTIC" "$staging/client-diagnostic.json"
          (
            cd "$staging"
            sha256sum client-diagnostic.json > SHA256SUMS
            sha256sum --check SHA256SUMS
            chmod 0400 SHA256SUMS
          )
          STAGING="$staging" python3 - <<'PY'
          import os

          staging = os.environ["STAGING"]
          for name in ("client-diagnostic.json", "SHA256SUMS"):
              descriptor = os.open(os.path.join(staging, name), os.O_RDONLY)
              try:
                  os.fsync(descriptor)
              finally:
                  os.close(descriptor)
          descriptor = os.open(staging, os.O_RDONLY | os.O_DIRECTORY)
          try:
              os.fsync(descriptor)
          finally:
              os.close(descriptor)
          PY
          : > "$staging/COMPLETE"
          chmod 0400 "$staging/COMPLETE"
          STAGING="$staging" python3 - <<'PY'
          import os

          staging = os.environ["STAGING"]
          marker = os.open(os.path.join(staging, "COMPLETE"), os.O_RDONLY)
          try:
              os.fsync(marker)
          finally:
              os.close(marker)
          directory = os.open(staging, os.O_RDONLY | os.O_DIRECTORY)
          try:
              os.fsync(directory)
          finally:
              os.close(directory)
          PY
          STAGING="$staging" DESTINATION="$destination" HOSTED_EVIDENCE_ROOT="$HOSTED_EVIDENCE_ROOT" python3 - <<'PY'
          import ctypes
          import os

          renameat2 = ctypes.CDLL(None, use_errno=True).renameat2
          renameat2.argtypes = [
              ctypes.c_int,
              ctypes.c_char_p,
              ctypes.c_int,
              ctypes.c_char_p,
              ctypes.c_uint,
          ]
          renameat2.restype = ctypes.c_int
          result = renameat2(
              -100,
              os.fsencode(os.environ["STAGING"]),
              -100,
              os.fsencode(os.environ["DESTINATION"]),
              1,
          )
          if result != 0:
              error = ctypes.get_errno()
              raise OSError(error, os.strerror(error), os.environ["DESTINATION"])
          root = os.open(os.environ["HOSTED_EVIDENCE_ROOT"], os.O_RDONLY | os.O_DIRECTORY)
          try:
              os.fsync(root)
          finally:
              os.close(root)
          PY
          trap - EXIT

