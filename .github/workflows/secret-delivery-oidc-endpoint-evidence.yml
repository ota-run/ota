      - name: Reconcile root-custodied provider-free pressure evidence
        shell: bash
        run: |
          set -euo pipefail
          record="$HOSTED_EVIDENCE_CAPTURE_ROOT/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          for _ in $(seq 1 30); do
            if test -f "$record"; then
              break
            fi
            sleep 1
          done
          test -f "$record"
          test "$(stat -c '%U:%G:%a' "$HOSTED_EVIDENCE_CAPTURE_ROOT")" = 'root:root:755'
          test "$(stat -c '%U:%G:%a' "$record")" = 'root:root:644'
          RECORD="$record" \
          INSTALLATION="$PRESSURE_INSTALLATION_EVIDENCE" \
          EXPECTED_CORE="$EXPECTED_CORE_SOURCE_REVISION" \
          EXPECTED_LAUNCHER="$EXPECTED_LAUNCHER_SOURCE_REVISION" \
          EXPECTED_PROTOCOL="$EXPECTED_PROTOCOL_SOURCE_REVISION" \
          python3 - <<'PY'
          import hashlib
          import hmac
          import json
          import os
          import re

          with open(os.environ["RECORD"], encoding="utf-8") as handle:
              value = json.load(handle)
          with open(os.environ["INSTALLATION"], encoding="utf-8") as handle:
              installation = json.load(handle)
          expected = {
              "schema_version", "record_kind", "identity", "installation_identity",
              "request_identity", "core_source_revision", "launcher_source_revision",
              "protocol_source_revision", "workflow_run_id", "workflow_run_attempt",
              "capture_class", "bundle_digest",
          }
          if set(value) != expected:
              raise SystemExit("root capture record is not closed")
          if value["schema_version"] != 1 or value["record_kind"] != "secret_delivery_pressure_public_capture":
              raise SystemExit("root capture record is not the expected schema")
          if value["workflow_run_id"] != os.environ["GITHUB_RUN_ID"] or value["workflow_run_attempt"] != os.environ["GITHUB_RUN_ATTEMPT"]:
              raise SystemExit("root capture record is for another workflow invocation")
          if value["installation_identity"] != installation.get("identity") or value["request_identity"] != installation.get("request_identity"):
              raise SystemExit("root capture record is not bound to the installed pressure authority")
          if value["capture_class"] != "success_set":
              raise SystemExit("root capture record did not retain the closed success evidence set")
          for field, expected_revision in {
              "core_source_revision": os.environ["EXPECTED_CORE"],
              "launcher_source_revision": os.environ["EXPECTED_LAUNCHER"],
              "protocol_source_revision": os.environ["EXPECTED_PROTOCOL"],
          }.items():
              if value[field] != expected_revision:
                  raise SystemExit(f"root capture record {field} is substituted")
          for field in ("identity", "installation_identity", "request_identity", "bundle_digest"):
              if not re.fullmatch(r"sha256:[0-9a-f]{64}", value[field]):
                  raise SystemExit(f"root capture record {field} is malformed")
          canonical = dict(value)
          actual_identity = canonical["identity"]
          canonical["identity"] = ""
          payload = json.dumps(
              canonical,
              ensure_ascii=False,
              separators=(",", ":"),
              sort_keys=True,
          ).encode("utf-8")
          expected_identity = "sha256:" + hashlib.sha256(
              b"ota.authority-launcher.pressure-evidence-capture-record.v1\0" + payload
          ).hexdigest()
          if not hmac.compare_digest(actual_identity, expected_identity):
              raise SystemExit("root capture record identity does not match its canonical payload")
          PY
