name: secret-delivery-x64-endpoint-discovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-toolkit-request-url:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Prove the pinned Actions Toolkit uses its supplied request URL
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          TOOLKIT_EVIDENCE_PATH: ${{ runner.temp }}/actions-toolkit-oidc-url-probe.json
        with:
          script: |
            const fs = require('fs')
            const http = require('http')

            if (
              process.env.ACTIONS_ID_TOKEN_REQUEST_URL ||
              process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN
            ) {
              throw new Error('Actions Toolkit received an OIDC capability without id-token permission')
            }

            let observed
            const server = http.createServer((request, response) => {
              observed = {
                authorization: request.headers.authorization,
                method: request.method,
                url: request.url,
              }
              response.writeHead(200, { 'content-type': 'application/json' })
              response.end(JSON.stringify({ value: 'fixture-jwt' }))
            })
            await new Promise((resolve, reject) => {
              server.once('error', reject)
              server.listen(0, '127.0.0.1', resolve)
            })

            try {
              const address = server.address()
              process.env.ACTIONS_ID_TOKEN_REQUEST_URL =
                `http://127.0.0.1:${address.port}/supplied/idtoken?api-version=2.0`
              process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN = 'fixture-bearer'
              const token = await core.getIDToken('ota-fixture-audience')
              if (token !== 'fixture-jwt') {
                throw new Error('Actions Toolkit returned an unexpected fixture token')
              }
              if (
                observed?.method !== 'GET' ||
                observed?.authorization !== 'Bearer fixture-bearer' ||
                observed?.url !==
                  '/supplied/idtoken?api-version=2.0&audience=ota-fixture-audience'
              ) {
                throw new Error('Actions Toolkit did not use the supplied request URL exactly')
              }
              fs.writeFileSync(
                process.env.TOOLKIT_EVIDENCE_PATH,
                JSON.stringify(
                  {
                    schema_version: 1,
                    actions_github_script_revision:
                      'ed597411d8f924073f98dfc5c65a23a2325f34cd',
                    oidc_capability_at_action_start: 'absent',
                    supplied_request_url_observed: true,
                    jwt_issuer_used_as_request_origin: false,
                    test_core_get_id_token_request_target: 'loopback',
                  },
                  null,
                  2,
                ) + '\n',
              )
            } finally {
              await new Promise((resolve, reject) =>
                server.close((error) => (error ? reject(error) : resolve())),
              )
            }

      - name: Upload Toolkit loopback probe
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: actions-toolkit-oidc-url-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/actions-toolkit-oidc-url-probe.json
          if-no-files-found: error
          retention-days: 30

  capture-endpoint-shape:
    needs: probe-toolkit-request-url
    runs-on:
      - self-hosted
      - Linux
      - X64
      - ota-authority-independent
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      INSTALLATION_EVIDENCE: /usr/share/ota/authority-launcher/installation-evidence.json
      EXPECTED_CORE_SOURCE_REVISION: ${{ github.sha }}
      EXPECTED_LAUNCHER_SOURCE_REVISION: 017d866bf9aab8b193ef0ce0515acc95545f3399
      EXPECTED_PROTOCOL_SOURCE_REVISION: d16947b87d84e66a4164a275c703b47fce6ded20

    steps:
      - name: Check out exact Core revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v6

      - name: Download Toolkit loopback probe
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: actions-toolkit-oidc-url-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/actions-toolkit-oidc-url-probe

      - name: Derive and reconcile protected capability observation
        shell: bash
        env:
          OTA_CAPABILITY_OBSERVATION_REPOSITORY: /srv/ota-v3-pressure
          OTA_CAPABILITY_OBSERVATION_AUTHORITY_ID: platform-release-authority
          CAPABILITY_PROJECTION_PATH: ${{ runner.temp }}/protected-capability-observation.json
        run: |
          set -euo pipefail

          runner_version=""
          pid="$PPID"
          for _ in $(seq 1 16); do
            executable="$(readlink "/proc/$pid/exe" 2>/dev/null || true)"
            if [[ "${executable##*/}" == "Runner.Worker" ]]; then
              runner_version="$("${executable%/*}/Runner.Listener" --version)"
              break
            fi
            parent="$(awk '{ close=index($0, ") "); print substr($0, close + 2) }' "/proc/$pid/stat" 2>/dev/null | awk '{print $2}' || true)"
            [[ "$parent" =~ ^[1-9][0-9]*$ && "$parent" != "$pid" ]] || break
            pid="$parent"
          done
          [[ -n "$runner_version" ]]
          export OTA_CAPABILITY_OBSERVATION_RUNNER_VERSION="$runner_version"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/ota-capability-observation-target"
          test_name="protected_capability_observation::tests::protected_linux_x64_service_route_returns_one_verified_projection"
          cargo test --locked --lib "$test_name" -- --exact --ignored --nocapture --test-threads=1 \
            | tee "$RUNNER_TEMP/protected-capability-observation.log"
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' \
            "$RUNNER_TEMP/protected-capability-observation.log" >/dev/null
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          marker = "OTA_CAPABILITY_OBSERVATION_PROJECTION="
          def extract_projection(log: str) -> dict:
              projections = [
                  line.split(marker, 1)[1]
                  for line in log.splitlines()
                  if marker in line
              ]
              if len(projections) != 1:
                  raise ValueError(
                      f"expected exactly one capability projection, found {len(projections)}"
                  )
              return json.loads(projections[0])

          assert extract_projection(f"test route ... {marker}{{}}") == {}
          for invalid in ("", f"{marker}{{}}\n{marker}{{}}"):
              try:
                  extract_projection(invalid)
              except ValueError:
                  pass
              else:
                  raise AssertionError("invalid projection marker count was accepted")

          log = Path(os.environ["RUNNER_TEMP"]).joinpath(
              "protected-capability-observation.log"
          ).read_text(encoding="utf-8")
          projection = extract_projection(log)
          Path(os.environ["CAPABILITY_PROJECTION_PATH"]).write_text(
              json.dumps(projection, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verify protected runner and capture non-secret endpoint evidence
        shell: bash
        env:
          EVIDENCE_PATH: ${{ runner.temp }}/secret-delivery-oidc-endpoint-evidence.json
          TOOLKIT_EVIDENCE_PATH: ${{ runner.temp }}/actions-toolkit-oidc-url-probe/actions-toolkit-oidc-url-probe.json
          CAPABILITY_PROJECTION_PATH: ${{ runner.temp }}/protected-capability-observation.json
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import stat
          import subprocess
          from pathlib import Path
          from urllib.parse import urlsplit

          request_url = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_URL", "")
          request_token = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_TOKEN", "")
          if not request_url or not request_token:
              raise SystemExit("GitHub OIDC request capability is unavailable")

          if os.geteuid() == 0:
              raise SystemExit("protected runner job must be non-root")
          try:
              sudo = subprocess.run(
                  ["sudo", "-n", "true"],
                  check=False,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
          except FileNotFoundError:
              sudo = None
          if sudo is not None and sudo.returncode == 0:
              raise SystemExit("protected runner job unexpectedly has passwordless sudo")
          status = Path("/proc/self/status").read_text(encoding="utf-8")
          required_status = {
              "CapEff:": "0000000000000000",
              "CapPrm:": "0000000000000000",
              "CapInh:": "0000000000000000",
              "CapAmb:": "0000000000000000",
              "NoNewPrivs:": "1",
          }
          for key, expected in required_status.items():
              observed = next(
                  (line.split()[1] for line in status.splitlines() if line.startswith(key)),
                  None,
              )
              if observed != expected:
                  raise SystemExit(f"protected runner posture mismatch: {key}")
          expected_runner_cgroup = "/system.slice/ota-authority-pressure-runner.service"
          observed_runner_cgroup = next(
              (
                  line.removeprefix("0::")
                  for line in Path("/proc/self/cgroup").read_text(encoding="utf-8").splitlines()
                  if line.startswith("0::")
              ),
              None,
          )
          if observed_runner_cgroup != expected_runner_cgroup:
              raise SystemExit("job is outside the protected runner service cgroup")

          installation_path = Path(os.environ["INSTALLATION_EVIDENCE"])
          current = installation_path
          while True:
              metadata = current.lstat()
              if stat.S_ISLNK(metadata.st_mode) or metadata.st_uid != 0 or metadata.st_mode & 0o022:
                  raise SystemExit("installation evidence ownership chain is invalid")
              if current.parent == current:
                  break
              current = current.parent
          metadata = installation_path.lstat()
          if (
              not stat.S_ISREG(metadata.st_mode)
              or metadata.st_uid != 0
              or metadata.st_nlink != 1
              or stat.S_IMODE(metadata.st_mode) != 0o644
          ):
              raise SystemExit("installation evidence file is invalid")
          installation = json.loads(installation_path.read_bytes())
          observed_revisions = {
              "core": installation.get("core_source_revision"),
              "launcher": installation.get("launcher_source_revision"),
              "protocol": installation.get("protocol_source_revision"),
          }
          expected_revisions = {
              "core": os.environ["EXPECTED_CORE_SOURCE_REVISION"],
              "launcher": os.environ["EXPECTED_LAUNCHER_SOURCE_REVISION"],
              "protocol": os.environ["EXPECTED_PROTOCOL_SOURCE_REVISION"],
          }
          if observed_revisions != expected_revisions:
              raise SystemExit("installed source revisions do not match the exact evidence run")
          claimed_installation_identity = installation.get("identity", "")
          canonical_installation = dict(installation)
          canonical_installation["identity"] = ""
          canonical_bytes = json.dumps(
              canonical_installation,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
          ).encode()
          observed_installation_identity = "sha256:" + hashlib.sha256(
              b"ota.authority-launcher.public-installation-evidence.v1\0" + canonical_bytes
          ).hexdigest()
          if claimed_installation_identity != observed_installation_identity:
              raise SystemExit("installation evidence identity is invalid")

          expected_host = "run-actions-1-azure-eastus.actions.githubusercontent.com"
          canonical_uuid = re.compile(
              r"^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-"
              r"[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
          )
          canonical_semver = re.compile(
              r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)"
              r"(?:-(?:(?:0|[1-9][0-9]*)|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)"
              r"(?:\.(?:(?:0|[1-9][0-9]*)|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?"
              r"(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?"
          )

          def canonical_positive_decimal(segment):
              if not re.fullmatch(r"[1-9][0-9]*", segment):
                  return False
              try:
                  value = int(segment)
              except ValueError:
                  return False
              return value <= 18446744073709551615 and str(value) == segment

          def canonical_runner_version(version):
              return canonical_semver.fullmatch(version) is not None

          # Keep discovery acceptance aligned with Core's positive-u64, lowercase UUID and
          # canonical SemVer requirements before inspecting a live protected-runner value.
          if any(canonical_positive_decimal(value) for value in ("0", "001", "18446744073709551616")):
              raise SystemExit("OIDC endpoint decimal grammar self-test failed")
          if not canonical_positive_decimal("158853568"):
              raise SystemExit("OIDC endpoint decimal grammar self-test failed")
          if canonical_uuid.fullmatch("123E4567-e89b-12d3-a456-426614174000"):
              raise SystemExit("OIDC endpoint UUID grammar self-test failed")
          if not canonical_uuid.fullmatch("123e4567-e89b-12d3-a456-426614174000"):
              raise SystemExit("OIDC endpoint UUID grammar self-test failed")
          if not canonical_runner_version("2.337.0-rc.1+build.7") or any(
              canonical_runner_version(value) for value in ("02.337.0", "2.337", "2.337.0-01")
          ):
              raise SystemExit("GitHub Runner semantic-version grammar self-test failed")

          endpoint_prefix = f"https://{expected_host}/"
          if (
              not request_url.isascii()
              or any(ord(character) < 32 or ord(character) == 127 for character in request_url)
              or "#" in request_url
              or "%" in request_url
              or not request_url.startswith(endpoint_prefix)
          ):
              raise SystemExit("GitHub OIDC request endpoint is outside the discovery grammar")
          endpoint_path, separator, endpoint_query = request_url[len(endpoint_prefix) :].partition("?")
          path_parts = endpoint_path.split("/")
          if (
              not separator
              or "?" in endpoint_query
              or endpoint_query != "api-version=2.0"
              or len(path_parts) != 5
              or not canonical_positive_decimal(path_parts[0])
              or path_parts[1] != ""
              or path_parts[2] != "idtoken"
              or not canonical_uuid.fullmatch(path_parts[3])
              or not canonical_uuid.fullmatch(path_parts[4])
          ):
              raise SystemExit("GitHub OIDC request endpoint path is outside the discovery grammar")
          parsed = urlsplit(request_url)
          path_shape = "/{decimal}//idtoken/{uuid}/{uuid}"
          query_shape = [{"key": "api-version", "public_value": "2.0"}]

          runner_version = None
          pid = os.getppid()
          for _ in range(16):
              try:
                  executable = Path(os.readlink(f"/proc/{pid}/exe"))
                  process_stat = Path(f"/proc/{pid}/stat").read_text(encoding="utf-8")
                  closing = process_stat.rfind(")")
                  parent_pid = int(process_stat[closing + 1 :].split()[1])
              except (FileNotFoundError, PermissionError, ValueError):
                  break
              if executable.name == "Runner.Worker":
                  listener = executable.parent / "Runner.Listener"
                  result = subprocess.run(
                      [str(listener), "--version"],
                      check=True,
                      capture_output=True,
                      text=True,
                      timeout=10,
                  )
                  runner_version = result.stdout.strip()
                  break
              if parent_pid <= 1 or parent_pid == pid:
                  break
              pid = parent_pid
          if not runner_version or not canonical_runner_version(runner_version):
              raise SystemExit("self-hosted GitHub Runner version is unavailable")
          if os.environ["RUNNER_OS"] != "Linux" or os.environ["RUNNER_ARCH"] != "X64":
              raise SystemExit("fixture is not running on the activated Linux/X64 target")

          toolkit_evidence = json.loads(Path(os.environ["TOOLKIT_EVIDENCE_PATH"]).read_bytes())
          if toolkit_evidence != {
              "schema_version": 1,
              "actions_github_script_revision": "ed597411d8f924073f98dfc5c65a23a2325f34cd",
              "oidc_capability_at_action_start": "absent",
              "supplied_request_url_observed": True,
              "jwt_issuer_used_as_request_origin": False,
              "test_core_get_id_token_request_target": "loopback",
          }:
              raise SystemExit("Actions Toolkit request-URL probe did not reconcile")
          capability_projection = json.loads(
              Path(os.environ["CAPABILITY_PROJECTION_PATH"]).read_bytes()
          )
          payload = capability_projection.get("payload", {})
          if (
              payload.get("derivation") != "verified"
              or payload.get("challenge_identity", "").startswith("sha256:") is False
              or payload.get("target")
              != {"environment": "self_hosted", "os": "linux", "architecture": "x64"}
              or payload.get("capability_class") != "systemd_protected_launcher_v4"
              or payload.get("runner_version") != runner_version
              or not capability_projection.get("projection_identity", "").startswith("sha256:")
              or not capability_projection.get("signature")
          ):
              raise SystemExit("protected capability observation projection is invalid")

          evidence = {
              "schema_version": 1,
              "evidence_kind": "github_actions_self_hosted_oidc_request_endpoint",
              "source": {
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "revision": os.environ["GITHUB_SHA"],
                  "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
                  "run_id": os.environ["GITHUB_RUN_ID"],
                  "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              },
              "runner": {
                  "environment": "self-hosted",
                  "os": os.environ["RUNNER_OS"].lower(),
                  "architecture": os.environ["RUNNER_ARCH"].lower(),
                  "version": runner_version,
              },
              "request_endpoint": {
                  "scheme": parsed.scheme,
                  "host": parsed.hostname.lower(),
                  "port": parsed.port,
                  "path_shape": path_shape,
                  "query_shape": query_shape,
                  "audience_present": False,
                  "userinfo_present": False,
                  "fragment_present": False,
              },
              "protected_launcher": {
                  "installation_identity": claimed_installation_identity,
                  "installation_source_revisions": observed_revisions,
                  "capability_identity": None,
                  "capability_derivation": "verified",
                  "public_projection": capability_projection,
              },
              "actions_toolkit": toolkit_evidence,
              "provider_contact_observation": "not_instrumented",
              "bearer_retained": False,
              "protected_request_url_values_retained": False,
          }
          output = Path(os.environ["EVIDENCE_PATH"])
          output.write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload endpoint evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: secret-delivery-oidc-endpoint-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/secret-delivery-oidc-endpoint-evidence.json
          if-no-files-found: error
          retention-days: 30
