name: docs-quality

on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs-quality.yml"
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/docs-quality.yml"

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          config: .markdownlint-cli2.yaml
          globs: |
            docs/site/src/**/*.md

  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --verbose
            docs/site/src/**/*.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
