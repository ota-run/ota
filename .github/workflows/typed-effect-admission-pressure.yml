name: typed-effect-admission-pressure

on:
  workflow_dispatch:
  push:
    branches:
      - 1.6.27-implementation
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/effect_application_plan.rs"
      - "src/effect_domain.rs"
      - "src/runner.rs"
      - "src/cli/commands.rs"
      - "src/published_contract_schemas.rs"
      - "docs/spec/json-schemas/contract.json"
      - "docs/spec/json-schemas/run-preview.json"
      - ".github/workflows/typed-effect-admission-pressure.yml"

permissions:
  contents: read

jobs:
  typed-effect-admission:
    name: Typed effect admission (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout exact Core revision
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build immutable test binary
        shell: bash
        run: cargo build --locked --release --quiet

      - name: Exercise typed admission before side effects
        shell: bash
        run: |
          set -euo pipefail

          ota="$GITHUB_WORKSPACE/target/release/ota"
          proof_root="$RUNNER_TEMP/ota-typed-effect-admission-pressure"
          fixture="$proof_root/fixture"
          preview_fixture="$proof_root/preview-fixture"
          mkdir -p "$fixture/migrations" "$preview_fixture/migrations"
          printf 'create table example ();\n' > "$fixture/migrations/001.sql"
          cp "$fixture/migrations/001.sql" "$preview_fixture/migrations/001.sql"

          python3 - "$fixture" "$preview_fixture" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          fixture = pathlib.Path(sys.argv[1])
          preview_fixture = pathlib.Path(sys.argv[2])
          migration = fixture / "migrations" / "001.sql"
          file_identity = "sha256:" + hashlib.sha256(migration.read_bytes()).hexdigest()
          manifest = {
              "schema_version": 1,
              "root": "migrations",
              "files": [{"path": "001.sql", "identity": file_identity}],
          }
          manifest_json = json.dumps(manifest, sort_keys=True, separators=(",", ":"), ensure_ascii=False)
          manifest_identity = "sha256:" + hashlib.sha256(
              b"ota.schema-migration-manifest.v1\0" + manifest_json.encode()
          ).hexdigest()
          common = f"""version: 1
          metadata:
            ota:
              minimum_version: \"1.6.27\"
          project:
            name: typed-effect-admission-pressure
          resource_bindings:
            primary:
              kind: database
              provider: postgresql
              namespace: {{ authority: dns:example.org, environment: pressure, account: primary }}
          effect_definitions:
            migration:
              kind: database_schema_mutation
              action: apply_migration_set
              resource: {{ engine: postgresql, target_ref: primary, schema: public }}
              bounds:
                migration_set: {{ root: migrations, content_identity: {manifest_identity} }}
                start_state: any_within_set
          """.replace("          ", "")
          (preview_fixture / "ota.yaml").write_text((common + """tasks:
            migrate:
              action: { kind: database_schema_mutation, effect: migration }
              effects:
                declared: [migration]
          workflows:
            default: typed
            typed:
              run:
                task: migrate
          """).replace("          ", ""))
          (fixture / "ota.yaml").write_text((common + """env:
            profiles:
              typed:
                env:
                  TYPED_SENTINEL: must-not-render
                render:
                  dotenv:
                    path: .env.typed
                    include: [TYPED_SENTINEL]
          tasks:
            setup:
              command:
                exe: sh
                args: [-c, \"touch setup-sentinel\"]
            migrate:
              action: {{ kind: database_schema_mutation, effect: migration }}
              effects:
                declared: [migration]
          workflows:
            default: typed
            typed:
              env:
                profile: typed
              setup:
                task: setup
              run:
                task: migrate
              proof:
                claim: bounded
          """).replace("          ", ""))
          PY

          git -C "$GITHUB_WORKSPACE" rev-parse HEAD > "$proof_root/core-revision.txt"
          "$ota" validate "$fixture" --plain | tee "$proof_root/validate.txt"
          "$ota" validate "$preview_fixture" --plain | tee "$proof_root/preview-validate.txt"

          "$ota" json validate \
            --schema run-preview.json \
            --assert-eq dry_run=true \
            --assert-eq task=migrate \
            --assert-non-empty-string plan.effect_application_plans.0.identity \
            --write-payload "$proof_root/run-dry-run.json" \
            -- "$ota" run migrate --dry-run --json "$preview_fixture"

          "$ota" json validate \
            --schema up.json \
            --assert-eq dry_run=true \
            --assert-eq phase=preview \
            --write-payload "$proof_root/up-dry-run.json" \
            -- "$ota" up --dry-run --json "$preview_fixture"

          set +e
          "$ota" run migrate --plain "$fixture" > "$proof_root/run-refusal.txt" 2>&1
          run_status=$?
          "$ota" up --plain "$fixture" > "$proof_root/up-refusal.txt" 2>&1
          up_status=$?
          "$ota" proof runtime --plain "$fixture" > "$proof_root/proof-refusal.txt" 2>&1
          proof_status=$?
          set -e

          test "$run_status" -eq 1
          test "$up_status" -eq 1
          test "$proof_status" -eq 1
          rg -q 'provider execution is disabled' "$proof_root/run-refusal.txt"
          rg -q 'provider execution is disabled' "$proof_root/up-refusal.txt"
          rg -q 'provider execution is disabled' "$proof_root/proof-refusal.txt"
          test ! -e "$fixture/setup-sentinel"
          test ! -e "$fixture/.env.typed"
          test ! -e "$fixture/.ota/state/logs"

          "$ota" json validate \
            --schema up.json \
            --allow-exit 1 \
            --assert-eq ok=false \
            --assert-eq governance.post_execution.execution_attempted=false \
            --write-payload "$proof_root/up-refusal.json" \
            -- "$ota" up --json "$fixture"

          cp -R "$fixture" "$proof_root/stale-fixture"
          printf 'alter table example add column value integer;\n' >> "$proof_root/stale-fixture/migrations/001.sql"
          set +e
          "$ota" run migrate --dry-run --json "$proof_root/stale-fixture" > "$proof_root/stale-refusal.json" 2>&1
          stale_status=$?
          set -e
          test "$stale_status" -eq 1
          rg -q 'effect_application_plan' "$proof_root/stale-refusal.json"
          test ! -e "$proof_root/stale-fixture/setup-sentinel"

          mkdir -p "$proof_root/outside/migrations"
          cp "$fixture/migrations/001.sql" "$proof_root/outside/migrations/001.sql"
          cp -R "$fixture" "$proof_root/symlink-fixture"
          ln -s "$proof_root/outside" "$proof_root/symlink-fixture/alias"
          python3 - "$proof_root/symlink-fixture/ota.yaml" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          value = path.read_text()
          path.write_text(value.replace("root: migrations", "root: alias/migrations", 1))
          PY
          set +e
          "$ota" run migrate --dry-run --json "$proof_root/symlink-fixture" > "$proof_root/symlink-refusal.json" 2>&1
          symlink_status=$?
          set -e
          test "$symlink_status" -eq 1
          rg -q 'effect_application_plan' "$proof_root/symlink-refusal.json"

      - name: Upload pressure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: typed-effect-admission-pressure-${{ matrix.os }}
          path: ${{ runner.temp }}/ota-typed-effect-admission-pressure
          if-no-files-found: warn
