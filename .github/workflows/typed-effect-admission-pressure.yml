name: typed-effect-admission-pressure

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typed-effect-admission:
    name: Typed effect admission (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout exact Core revision
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build immutable test binary
        shell: bash
        run: cargo build --locked --release --quiet

      - name: Exercise typed admission before side effects
        shell: bash
        env:
          OTA_PRESSURE_TARGET_OS: ${{ runner.os == 'macOS' && 'macos' || 'linux' }}
        run: |
          set -euo pipefail
          proof_root="$RUNNER_TEMP/ota-typed-effect-admission-pressure"
          "$GITHUB_WORKSPACE/scripts/typed-effect-admission-pressure.sh" \
            "$GITHUB_WORKSPACE/target/release/ota" \
            "$proof_root" \
            "$GITHUB_WORKSPACE"

      - name: Exercise Core-owned execution and sandbox admission controls
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked effect_application_plan::tests::admitted_plan_refuses_source_plan_and_materialized_input_substitution \
            --lib -- --test-threads=1 2>&1 | tee \
            "$RUNNER_TEMP/ota-typed-effect-admission-pressure/plan-to-executor-continuity.txt"
          cargo test --locked tasks_json_binds_typed_effect_policy_and_refuses_provider_capability \
            --lib -- --test-threads=1 2>&1 | tee \
            "$RUNNER_TEMP/ota-typed-effect-admission-pressure/sandbox-admission-continuity.txt"

      - name: Upload pressure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: typed-effect-admission-pressure-${{ matrix.os }}
          path: ${{ runner.temp }}/ota-typed-effect-admission-pressure
          if-no-files-found: warn
          include-hidden-files: true
