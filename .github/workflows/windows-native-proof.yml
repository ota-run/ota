name: windows-native-proof

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "docs/spec/**"
      - ".github/workflows/windows-native-proof.yml"
  push:
    branches:
      - main
      - "**"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "docs/spec/**"
      - ".github/workflows/windows-native-proof.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual-studio-dev-shell-proof:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        shell: pwsh
        run: cargo build --release --quiet

      - name: Run native activation proof
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ota = Join-Path $PWD "target/release/ota.exe"
          $proofRoot = Join-Path $env:RUNNER_TEMP "ota-windows-native-proof"
          if (Test-Path $proofRoot) {
            Remove-Item -Recurse -Force $proofRoot
          }
          New-Item -ItemType Directory -Path $proofRoot | Out-Null

          @'
          version: 1
          project:
            name: windows-native-proof
            type: application
          native_prerequisites:
            msvc-shell:
              platforms:
                windows:
                  check: msvc-shell-check
                  visual_studio:
                    components:
                      - Microsoft.VisualStudio.Component.VC.Tools.x86.x64
                  activation:
                    kind: visual_studio_dev_shell
                    arch: x64
          checks:
            - name: msvc-shell-check
              kind: precondition
              severity: error
              run: where cl
          tasks:
            setup:
              run: where cl
              requirements:
                native:
                  - msvc-shell
          workflows:
            default: app
            app:
              setup:
                task: setup
          '@ | Set-Content -Path (Join-Path $proofRoot "ota.yaml") -NoNewline

          $doctorRawPath = Join-Path $proofRoot "doctor.raw.txt"
          & $ota doctor --json $proofRoot *> $doctorRawPath
          $doctorExit = $LASTEXITCODE
          $doctorJson = Get-Content $doctorRawPath -Raw
          if ($doctorExit -ne 0) {
            if ($doctorJson) {
              Write-Host $doctorJson
            }
            throw "ota doctor failed on the Windows native proof fixture"
          }
          $doctorJson | Set-Content -Path (Join-Path $proofRoot "doctor.json") -NoNewline
          $doctor = Get-Content (Join-Path $proofRoot "doctor.json") -Raw | ConvertFrom-Json
          if (-not $doctor.ok) {
            throw "doctor did not report ready on the Windows native proof fixture"
          }
          if ($doctor.summary.verdict -ne "ready") {
            throw "doctor did not report a ready verdict on the Windows native proof fixture"
          }

          $upRawPath = Join-Path $proofRoot "up.raw.txt"
          & $ota up --json $proofRoot *> $upRawPath
          $upExit = $LASTEXITCODE
          $upJson = Get-Content $upRawPath -Raw
          if ($upExit -ne 0) {
            if ($upJson) {
              Write-Host $upJson
            }
            throw "ota up failed on the Windows native proof fixture"
          }
          $upJson | Set-Content -Path (Join-Path $proofRoot "up.json") -NoNewline
          $up = Get-Content (Join-Path $proofRoot "up.json") -Raw | ConvertFrom-Json
          if (-not $up.ok) {
            throw "ota up did not complete successfully on the Windows native proof fixture"
          }
          if (-not $up.receipt.native_prerequisites[0].activation.applied) {
            throw "ota up receipt did not mark the native activation as applied"
          }

          $proofRawPath = Join-Path $proofRoot "proof.raw.txt"
          & $ota proof runtime --json $proofRoot *> $proofRawPath
          $proofExit = $LASTEXITCODE
          $proofJson = Get-Content $proofRawPath -Raw
          if ($proofExit -ne 0) {
            if ($proofJson) {
              Write-Host $proofJson
            }
            throw "ota proof runtime failed on the Windows native proof fixture"
          }
          $proofJson | Set-Content -Path (Join-Path $proofRoot "proof.json") -NoNewline
          $proof = Get-Content (Join-Path $proofRoot "proof.json") -Raw | ConvertFrom-Json
          if (-not $proof.ok) {
            throw "ota proof runtime did not complete successfully on the Windows native proof fixture"
          }
          if ($proof.mode -ne "runtime-proof") {
            throw "ota proof runtime reported an unexpected mode"
          }
          if ($proof.workflow -ne "app") {
            throw "ota proof runtime reported an unexpected workflow"
          }
          if ($proof.summary.verdict -ne "ready") {
            throw "ota proof runtime did not report a ready verdict"
          }
          if (-not $proof.artifacts.topology -or -not $proof.artifacts.doctor -or -not $proof.artifacts.up_log) {
            throw "ota proof runtime did not report all canonical artifact paths"
          }

          foreach ($artifact in @($proof.artifacts.topology, $proof.artifacts.doctor, $proof.artifacts.up_log)) {
            $artifactPath = $artifact
            if (-not [System.IO.Path]::IsPathRooted($artifactPath)) {
              $artifactPath = Join-Path $proofRoot $artifactPath
            }
            if (-not (Test-Path $artifactPath)) {
              throw "ota proof runtime artifact missing: $artifact"
            }
          }

      - name: Upload proof artifacts
        id: upload-proof-artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: windows-native-proof-artifacts
          path: ${{ runner.temp }}/ota-windows-native-proof
          if-no-files-found: ignore

      - name: Warn when artifact upload flakes
        if: always() && steps.upload-proof-artifacts.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::proof artifacts failed to upload, but the Windows native proof itself completed"
          {
            echo "### Artifact upload warning"
            echo
            echo "- workflow: windows-native-proof"
            echo "- job: native-proof"
            echo "- note: diagnostic artifact upload failed after proof execution"
          } >> "$GITHUB_STEP_SUMMARY"
