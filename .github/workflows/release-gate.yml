name: Release Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  annotations-demo:
    name: Annotations Demo
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'codex/ota-annotations-demo'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Create demo contract
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          cat > "$tmpdir/ota.yaml" <<'EOF'
          version: 1
          project:
            name: annotations-demo
          env:
            DEMO_REQUIRED:
              required: true
          EOF
          echo "DEMO_DIR=$tmpdir" >> "${GITHUB_ENV}"

      - name: Diagnose demo contract
        run: cargo run -- doctor --json "$DEMO_DIR" > doctor.json || true

      - name: Emit annotations
        run: sh scripts/emit-ota-findings.sh --mode doctor --format github --input doctor.json

      - name: Fail on blocker
        run: jq -e '.summary.error_count > 0' doctor.json >/dev/null

  release-gate:
    name: Release Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-C link-arg=/STACK:8388608' || '' }}
      COLUMNS: "120"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install ota
        run: cargo install --path . --locked

      - name: Validate contract
        run: ota validate

      - name: Run release gate
        run: ota run release-gate --backend native --stream

  release-tag:
    name: Create Release Tag
    outputs:
      created: ${{ steps.tag.outputs.created }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    needs: release-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: meta
        run: |
          version="$(awk -F'"' '/^version = / {print $2; exit}' Cargo.toml)"
          tag="v${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Create release tag
        id: tag
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          git fetch --tags --force
          if git rev-parse "${tag}" >/dev/null 2>&1; then
            echo "tag already exists: ${tag}"
            echo "created=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "Release ${tag}"
          git push origin "${tag}"
          echo "created=true" >> "${GITHUB_OUTPUT}"

  release-assets-linux:
    name: Build Release Asset (Linux)
    needs: release-tag
    if: needs.release-tag.outputs.created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --locked --release

      - name: Package release asset
        run: |
          target="$(rustc -vV | awk '/host:/{print $2; exit}')"
          asset="ota-${target}.tar.gz"
          mkdir -p dist
          tar -czf "dist/${asset}" -C target/release ota

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ota-release-linux
          path: dist/*.tar.gz
          if-no-files-found: error

  release-assets-macos:
    name: Build Release Asset (macOS)
    needs: release-tag
    if: needs.release-tag.outputs.created == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --locked --release

      - name: Package release asset
        run: |
          target="$(rustc -vV | awk '/host:/{print $2; exit}')"
          asset="ota-${target}.tar.gz"
          mkdir -p dist
          tar -czf "dist/${asset}" -C target/release ota

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ota-release-macos
          path: dist/*.tar.gz
          if-no-files-found: error

  release-assets-windows:
    name: Build Release Asset (Windows)
    needs: release-tag
    if: needs.release-tag.outputs.created == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --locked --release

      - name: Package release assets
        shell: pwsh
        run: |
          $target = (& rustc -vV | Select-String '^host:' | ForEach-Object { ($_ -split '\s+')[1] })
          $dist = Join-Path $PWD 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          $tarAsset = Join-Path $dist "ota-$target.tar.gz"
          $zipAsset = Join-Path $dist "ota-$target.zip"

          tar -czf $tarAsset -C target/release ota.exe
          Compress-Archive -Path target/release/ota.exe -DestinationPath $zipAsset -Force

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ota-release-windows
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  publish-schemas:
    name: Publish JSON Schemas to R2
    needs: release-tag
    if: needs.release-tag.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: release
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Publish schema files
        run: |
          version="${{ needs.release-tag.outputs.version }}"
          find docs/spec/json-schemas -maxdepth 1 -type f | sort | while read -r file; do
            filename="$(basename "${file}")"
            for prefix in "spec/json-schemas/latest" "spec/json-schemas/v${version}"; do
              key="${prefix}/${filename}"
              npx --yes wrangler r2 object put "${CLOUDFLARE_R2_BUCKET}/${key}" \
                --file "${file}" \
                --remote \
                --content-type application/json
            done
          done

      - name: Publish install scripts
        run: |
          for file in scripts/install.sh scripts/install.ps1 scripts/bootstrap.ps1; do
            filename="$(basename "${file}")"
            npx --yes wrangler r2 object put "${CLOUDFLARE_R2_BUCKET}/${filename}" \
              --file "${file}" \
              --remote \
              --content-type text/plain
          done

      - name: Publish release version manifest
        run: |
          version="${{ needs.release-tag.outputs.version }}"
          updated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '{"version":"%s","updated_at":"%s"}\n' "${version}" "${updated_at}" > version.json
          npx --yes wrangler r2 object put "${CLOUDFLARE_R2_BUCKET}/version.json" \
            --file version.json \
            --remote \
            --content-type application/json

  publish-release:
    name: Publish GitHub Release
    needs:
      - release-tag
      - release-assets-linux
      - release-assets-macos
      - release-assets-windows
      - publish-schemas
    if: needs.release-tag.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ota-release-*
          merge-multiple: true

      - name: Generate release checksums
        run: |
          find dist -type f \( -name '*.tar.gz' -o -name '*.zip' \) | sort | while read -r file; do
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$file"
            else
              shasum -a 256 "$file"
            fi
          done > dist/ota-checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-tag.outputs.tag }}
          name: ${{ needs.release-tag.outputs.tag }}
          files: |
            dist/**/*.tar.gz
            dist/**/*.zip
            dist/ota-checksums.txt
          generate_release_notes: true

  publish-discord:
    name: Publish Discord Release Message
    needs:
      - release-tag
      - publish-release
    if: needs.release-tag.outputs.created == 'true' && needs.publish-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.release-tag.outputs.tag }}
    steps:
      - name: Build Discord message
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          output_file="discord-release-message.txt"
          release_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}"
          release_json="$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${release_api}")"

          release_name="$(printf '%s' "${release_json}" | jq -r '.name // .tag_name // env.RELEASE_TAG')"
          release_url="$(printf '%s' "${release_json}" | jq -r '.html_url // ("https://github.com/" + env.GITHUB_REPOSITORY + "/releases/tag/" + env.RELEASE_TAG)')"
          release_body="$(printf '%s' "${release_json}" | jq -r '.body // ""')"
          previous_tag="$(printf '%s' "${release_json}" | jq -r '.previous_tag_name // ""')"

          mapfile -t release_bullets < <(
            printf '%s\n' "${release_body}" \
              | awk '/^##[[:space:]]*What/ { in_section=1; next }
                     /^##[[:space:]]/ { if (in_section) exit }
                     in_section && /^[[:space:]]*[-*][[:space:]]+/ {
                       gsub(/^[[:space:]]*[-*][[:space:]]+/, "", $0)
                       if ($0 !~ /^Full Changelog/ && length($0) > 0) {
                         print $0
                       }
                     }' \
              | head -n 3
          )

          if (( ${#release_bullets[@]} == 0 )) && [[ -n "${previous_tag}" ]]; then
            compare_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/compare/${previous_tag}...${RELEASE_TAG}"
            compare_json="$(curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${compare_api}")"

            mapfile -t release_bullets < <(
              printf '%s\n' "${compare_json}" \
                | jq -r '.commits | reverse | .[].commit.message | split("\n")[0]' \
                | sed '/^Merge pull request #/d' \
                | sed -E '/^release: /d' \
                | sed '/^$/d' \
                | head -n 3
            )
          fi

          if (( ${#release_bullets[@]} == 0 )); then
            commits_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/commits?sha=${RELEASE_TAG}&per_page=3"
            commits_json="$(curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${commits_api}")"

            mapfile -t release_bullets < <(
              printf '%s\n' "${commits_json}" \
                | jq -r '.[] | .commit.message | split("\n")[0]' \
                | sed -E '/^release: /d' \
                | sed '/^$/d' \
                | head -n 3
            )
          fi

          if (( ${#release_bullets[@]} == 0 )); then
            release_bullets=("Release published.")
            why_statement="This release is now live with the latest validated changes."
          else
            why_statement="These are the top items pulled from this release and recent commit activity."
          fi

          {
            printf '🚀 **%s**\n\n' "${release_name}"
            printf "**What's new**\n"
            for bullet in "${release_bullets[@]}"; do
              printf -- '- %s\n' "${bullet}"
            done
            printf "\n**Why it matters**\n"
            printf '%s\n\n' "${why_statement}"
            printf '🔗 %s\n' "${release_url}"
          } > "${output_file}"

      - name: Publish Discord message
        shell: bash
        env:
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          webhook_url="${DISCORD_RELEASE_WEBHOOK_URL:-}"
          if [[ -z "${webhook_url}" ]]; then
            echo "Discord webhook secret is not configured; skipping Discord release announcement."
            exit 0
          fi

          jq -Rs '{content: .}' discord-release-message.txt \
            | curl -fsSL -H "Content-Type: application/json" -d @- "${webhook_url}"
