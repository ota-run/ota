name: Release Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_release:
        description: Force release asset creation even if the release tag already exists.
        type: boolean
        required: false
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  annotations-demo:
    name: Annotations Demo
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'codex/ota-annotations-demo'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Create demo contract
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          cat > "$tmpdir/ota.yaml" <<'EOF'
          version: 1
          project:
            name: annotations-demo
          env:
            DEMO_REQUIRED:
              required: true
          EOF
          echo "DEMO_DIR=$tmpdir" >> "${GITHUB_ENV}"

      - name: Diagnose demo contract
        run: cargo run -- doctor --json "$DEMO_DIR" > doctor.json || true

      - name: Emit annotations
        run: sh scripts/emit-ota-findings.sh --mode doctor --format github --input doctor.json

      - name: Fail on blocker
        run: jq -e '.summary.error_count > 0' doctor.json >/dev/null

  release-gate:
    name: Release Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-C link-arg=/STACK:8388608' || '' }}
      COLUMNS: "120"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install ota
        shell: bash
        run: |
          set -euo pipefail
          if command -v rustup >/dev/null 2>&1; then
            toolchain="$(rustup default | awk '{print $1}')"
            toolchain="${toolchain%% *}"

            if [ -z "$toolchain" ]; then
              echo "failed to resolve active rustup toolchain"
              exit 1
            fi

            rustup run "$toolchain" cargo install --path . --locked
            exit 0
          fi

          if ! command -v cargo >/dev/null 2>&1; then
            echo "cargo not found in PATH"
            exit 1
          fi

          cargo_command="$(command -v cargo)"
          "$cargo_command" install --path . --locked

      - name: Ensure cargo is on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cargoBin = Join-Path $env:USERPROFILE ".cargo\bin"
          if (-not (Test-Path $cargoBin)) {
            throw "cargo bin path not found: $cargoBin"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $cargoBin

      - name: Validate contract
        run: ota validate

      - name: Run release gate (non-Windows)
        if: runner.os != 'Windows'
        run: ota run release-gate --backend native --stream

      - name: Run release gate (Windows) - cargo version
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 2
        run: cargo --version

      - name: Run release gate (Windows) - fmt
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 10
        run: cargo fmt --check

      - name: Run release gate (Windows) - check
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 20
        run: cargo check

      - name: Run release gate (Windows) - lib tests (core)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 45
        run: |
          cargo test --lib cli::tests -- --test-threads=1 --skip cli::tests::up_skips_policy_backed_provisioning_when_doctor_is_ready
          cargo test --lib cli::commands -- --test-threads=1
          cargo test --lib contract_drift:: -- --test-threads=1
          cargo test --lib detector:: -- --test-threads=1
          cargo test --lib doctor:: -- --test-threads=1 --skip doctor::tests::remote_doctor_mode_probes_tool_versions_through_remote_contexts
          cargo test --lib execution:: -- --test-threads=1
          cargo test --lib parser:: -- --test-threads=1
          cargo test --lib policy_pack:: -- --test-threads=1
          cargo test --lib provisioning:: -- --test-threads=1
          cargo test --lib runner:: -- --test-threads=1 --skip runner::tests::restart_ready_activation_restarts_reachable_backend_provider_host_producer --skip runner::tests::restart_ready_activation_restarts_reachable_backend_provider_topology_target
          cargo test --lib schema:: -- --test-threads=1
          cargo test --lib terminal:: -- --test-threads=1
          cargo test --lib update:: -- --test-threads=1
          cargo test --lib validator:: -- --test-threads=1
          cargo test --lib workspace:: -- --test-threads=1

      - name: Run release gate (Windows) - policy-backed provisioning test
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 10
        run: cargo test up_skips_policy_backed_provisioning_when_doctor_is_ready --lib -- --test-threads=1

      - name: Run release gate (Windows) - remote doctor mode test
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 10
        run: cargo test remote_doctor_mode_probes_tool_versions_through_remote_contexts --lib -- --test-threads=1

      - name: Run release gate (Windows) - restart ready activation tests
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 10
        run: cargo test restart_ready_activation_restarts_reachable --lib -- --test-threads=1

      - name: Run release gate (Windows) - contract stability
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 10
        run: cargo test contract_is_stable

      - name: Run release gate (Windows) - JSON schema contracts
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 10
        run: cargo test --test json_schema_contracts

      - name: Run release gate (Windows) - detect fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 10
        run: cargo test --test detect_fixtures

      - name: Run release gate (Windows) - integration note
        if: runner.os == 'Windows'
        shell: pwsh
        run: Write-Host "Skipping integration tests on Windows"

  release-tag:
    name: Create Release Tag
    outputs:
      created: ${{ steps.tag.outputs.created }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    needs: release-gate
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && github.event.inputs.force_release == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: meta
        run: |
          version="$(awk -F'"' '/^version = / {print $2; exit}' Cargo.toml)"
          tag="v${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Create release tag
        id: tag
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          force_release="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_release == 'true' }}"

          if [[ "${force_release}" == "true" ]]; then
            if git rev-parse "${tag}" >/dev/null 2>&1; then
              git tag -d "${tag}" || true
              git push --delete origin "${tag}" || true
            fi
          fi

          git fetch --tags --force
          if git rev-parse "${tag}" >/dev/null 2>&1; then
            if [[ "${force_release}" == "true" ]]; then
              echo "tag already exists, recreating: ${tag}"
            else
              echo "tag already exists: ${tag}"
              echo "created=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "Release ${tag}"
          git push origin "${tag}"
          echo "created=true" >> "${GITHUB_OUTPUT}"

  release-assets-linux:
    name: Build Release Asset (Linux)
    needs: release-tag
    if: needs.release-tag.outputs.created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: ota-release-x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: ota-release-aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Package release asset
        run: |
          target="${{ matrix.target }}"
          asset="ota-${target}.tar.gz"
          mkdir -p dist
          tar -czf "dist/${asset}" -C "target/${target}/release" ota

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release-assets-macos:
    name: Build Release Asset (macOS)
    needs: release-tag
    if: needs.release-tag.outputs.created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: x86_64-apple-darwin
            artifact_name: ota-release-x86_64-apple-darwin
          - runner: macos-latest
            target: aarch64-apple-darwin
            artifact_name: ota-release-aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Package release asset
        run: |
          target="${{ matrix.target }}"
          asset="ota-${target}.tar.gz"
          mkdir -p dist
          tar -czf "dist/${asset}" -C "target/${target}/release" ota

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release-assets-windows:
    name: Build Release Asset (Windows)
    needs: release-tag
    if: needs.release-tag.outputs.created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: ota-release-x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact_name: ota-release-aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Package release assets
        shell: pwsh
        run: |
          $target = "${{ matrix.target }}"
          $dist = Join-Path $PWD 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          $tarAsset = Join-Path $dist "ota-$target.tar.gz"
          $zipAsset = Join-Path $dist "ota-$target.zip"

          tar -czf $tarAsset -C "target/$target/release" ota.exe
          Compress-Archive -Path "target/$target/release/ota.exe" -DestinationPath $zipAsset -Force

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  publish-schemas:
    name: Publish JSON Schemas to R2
    needs: release-tag
    if: needs.release-tag.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: release
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Publish schema files
        run: |
          version="${{ needs.release-tag.outputs.version }}"
          find docs/spec/json-schemas -maxdepth 1 -type f | sort | while read -r file; do
            filename="$(basename "${file}")"
            for prefix in "spec/json-schemas/latest" "spec/json-schemas/v${version}"; do
              key="${prefix}/${filename}"
              npx --yes wrangler r2 object put "${CLOUDFLARE_R2_BUCKET}/${key}" \
                --file "${file}" \
                --remote \
                --content-type application/json
            done
          done

      - name: Publish install scripts
        run: |
          for file in scripts/install.sh scripts/install.ps1 scripts/bootstrap.ps1; do
            filename="$(basename "${file}")"
            npx --yes wrangler r2 object put "${CLOUDFLARE_R2_BUCKET}/${filename}" \
              --file "${file}" \
              --remote \
              --content-type text/plain
          done

      - name: Publish release version manifest
        run: |
          version="${{ needs.release-tag.outputs.version }}"
          updated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '{"version":"%s","updated_at":"%s"}\n' "${version}" "${updated_at}" > version.json
          npx --yes wrangler r2 object put "${CLOUDFLARE_R2_BUCKET}/version.json" \
            --file version.json \
            --remote \
            --content-type application/json

  publish-release:
    name: Publish GitHub Release
    needs:
      - release-tag
      - release-assets-linux
      - release-assets-macos
      - release-assets-windows
      - publish-schemas
    if: needs.release-tag.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.release-tag.outputs.tag }}

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ota-release-*
          merge-multiple: true

      - name: Generate release checksums
        run: |
          find dist -type f \( -name '*.tar.gz' -o -name '*.zip' \) | sort | while read -r file; do
            asset="$(basename "$file")"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$file" | awk -v asset="$asset" '{print $1 "  " asset}'
            else
              shasum -a 256 "$file" | awk -v asset="$asset" '{print $1 "  " asset}'
            fi
          done > dist/ota-checksums.txt

      - name: Prepare changelog release notes
        run: |
          set -euo pipefail
          version="${{ needs.release-tag.outputs.version }}"
          python3 - "$version" <<'PY'
          import sys
          from pathlib import Path

          release_version = sys.argv[1]
          changelog_path = Path("CHANGELOG.md")
          if not changelog_path.exists():
              body = "- changelog entry for this version is missing.\n"
          else:
              release_lines = changelog_path.read_text(encoding="utf-8").splitlines()
              in_section = False
              collected = []
              for raw_line in release_lines:
                  if raw_line.startswith("## "):
                      current_heading = raw_line[3:].strip()
                      if in_section:
                          break
                      if current_heading == release_version:
                          in_section = True
                          continue
                  if in_section:
                      collected.append(raw_line)

              section = "\n".join(collected).strip()
              if section:
                  body = f"{section}\n"
              else:
                  body = "- changelog entry for this version is missing.\n"

          Path("release-notes.md").write_text(body, encoding="utf-8")
          PY

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-tag.outputs.tag }}
          name: ${{ needs.release-tag.outputs.tag }}
          body_path: release-notes.md
          files: |
            dist/**/*.tar.gz
            dist/**/*.zip
            dist/ota-checksums.txt

  publish-discord:
    name: Publish Discord Release Message
    needs:
      - release-tag
      - publish-release
    if: needs.release-tag.outputs.created == 'true' && needs.publish-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.release-tag.outputs.tag }}
    steps:
      - name: Build Discord message
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          release_tag = os.environ["RELEASE_TAG"]
          github_token = os.environ.get("GITHUB_TOKEN", "")
          api_base = f"https://api.github.com/repos/{repo}"


          def api_json(url: str):
              headers = {
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "ota-release-discord",
              }
              if github_token:
                  headers["Authorization"] = f"Bearer {github_token}"
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)


          def clean_text(value: str) -> str:
              return re.sub(r"\s+", " ", value.strip())


          def normalize_heading(line: str) -> str | None:
              stripped = line.strip()
              if stripped.startswith("## "):
                  return clean_text(stripped[3:]).lower()
              if stripped.startswith("**") and stripped.endswith("**") and len(stripped) > 4:
                  return clean_text(stripped[2:-2]).lower()
              return None


          def is_heading(line: str) -> bool:
              return normalize_heading(line) is not None


          def bullet_value(line: str) -> str | None:
              match = re.match(r"^\s*[-*]\s+(.+?)\s*$", line)
              if not match:
                  return None
              value = clean_text(match.group(1))
              if not value or value.lower().startswith("full changelog"):
                  return None
              return value


          def extract_section_bullets(text: str, section_patterns: list[re.Pattern[str]]) -> list[str]:
              in_section = False
              bullets: list[str] = []
              for raw_line in text.splitlines():
                  heading = normalize_heading(raw_line)
                  if heading is not None:
                      if any(pattern.search(heading) for pattern in section_patterns):
                          in_section = True
                          continue
                      if in_section:
                          break
                  if in_section:
                      bullet = bullet_value(raw_line)
                      if bullet:
                          bullets.append(bullet)
              return bullets


          def extract_section_text(text: str, section_patterns: list[re.Pattern[str]]) -> str:
              in_section = False
              lines: list[str] = []
              for raw_line in text.splitlines():
                  heading = normalize_heading(raw_line)
                  if heading is not None:
                      if any(pattern.search(heading) for pattern in section_patterns):
                          in_section = True
                          continue
                      if in_section:
                          break
                  if not in_section:
                      continue
                  bullet = bullet_value(raw_line)
                  if bullet:
                      continue
                  candidate = clean_text(raw_line)
                  if candidate:
                      lines.append(candidate)
              return clean_text(" ".join(lines[:2]))


          def extract_first_bullets(text: str) -> list[str]:
              bullets: list[str] = []
              for raw_line in text.splitlines():
                  bullet = bullet_value(raw_line)
                  if bullet:
                      bullets.append(bullet)
              return bullets


          def extract_changelog_bullets(changelog_text: str, version: str) -> list[str]:
              section_header = f"## {version}"
              in_section = False
              bullets: list[str] = []
              for raw_line in changelog_text.splitlines():
                  line = raw_line.rstrip()
                  if line == section_header:
                      in_section = True
                      continue
                  if in_section and line.startswith("## "):
                      break
                  if in_section:
                      bullet = bullet_value(line)
                      if bullet:
                          bullets.append(bullet)
              return bullets


          def filter_high_signal(bullets: list[str]) -> list[str]:
              if not bullets:
                  return bullets
              low_signal = re.compile(
                  r"(post-release github actions job|discord `#releases`|release note files|^release published\.?$)",
                  re.IGNORECASE,
              )
              filtered = [bullet for bullet in bullets if not low_signal.search(bullet)]
              return filtered or bullets


          def compact_bullet(bullet: str) -> str:
              if len(bullet) <= 140:
                  return bullet
              split_indexes = sorted(
                  index
                  for separator in ("; ", ", ", ", and ")
                  if (index := bullet.find(separator)) >= 60
              )
              if split_indexes:
                  return bullet[: split_indexes[0]].rstrip(" ,;.") + "."
              return bullet[:177].rstrip() + "..."


          def summarize_commit_subjects(subjects: list[str]) -> list[str]:
              cleaned: list[str] = []
              for subject in subjects:
                  candidate = clean_text(subject.splitlines()[0])
                  if not candidate:
                      continue
                  if candidate.startswith("Merge pull request #"):
                      continue
                  if re.match(r"^release:\s", candidate, re.IGNORECASE):
                      continue
                  cleaned.append(candidate)
              return cleaned


          release = api_json(f"{api_base}/releases/tags/{release_tag}")
          release_name = release.get("name") or release.get("tag_name") or release_tag
          release_url = release.get("html_url") or f"https://github.com/{repo}/releases/tag/{release_tag}"
          release_body = release.get("body") or ""
          release_version = release_tag[1:] if release_tag.startswith("v") else release_tag

          discord_patterns = [re.compile(r"^discord$")]
          whats_new_patterns = [
              re.compile(r"^what.*new$"),
              re.compile(r"^what.*changed$"),
          ]
          why_patterns = [re.compile(r"^why it matters$")]

          bullets = extract_section_bullets(release_body, discord_patterns)
          why_statement = extract_section_text(release_body, why_patterns)
          source = "release-body-discord"

          if not bullets:
              bullets = extract_section_bullets(release_body, whats_new_patterns)
              if bullets:
                  source = "release-body-highlights"

          changelog_bullets: list[str] = []
          if not bullets:
              try:
                  changelog = api_json(f"{api_base}/contents/CHANGELOG.md?ref={release_tag}")
                  encoded = changelog.get("content", "")
                  changelog_text = base64.b64decode(encoded).decode("utf-8")
                  changelog_bullets = extract_changelog_bullets(changelog_text, release_version)
              except Exception:
                  changelog_bullets = []
              if changelog_bullets:
                  bullets = changelog_bullets
                  source = "changelog"

          if not bullets:
              bullets = extract_first_bullets(release_body)
              if bullets:
                  source = "release-body-bullets"

          previous_tag = release.get("previous_tag_name") or ""
          if not previous_tag:
              try:
                  releases = api_json(f"{api_base}/releases?per_page=10")
                  tags = [entry.get("tag_name", "") for entry in releases]
                  if release_tag in tags:
                      index = tags.index(release_tag)
                      if index + 1 < len(tags):
                          previous_tag = tags[index + 1]
              except Exception:
                  previous_tag = ""

          if not bullets and previous_tag:
              compare = api_json(f"{api_base}/compare/{previous_tag}...{release_tag}")
              commit_subjects = summarize_commit_subjects(
                  [commit.get("commit", {}).get("message", "") for commit in reversed(compare.get("commits", []))]
              )
              if commit_subjects:
                  bullets = commit_subjects
                  source = "compare"

          if not bullets:
              commits = api_json(f"{api_base}/commits?sha={release_tag}&per_page=10")
              commit_subjects = summarize_commit_subjects(
                  [entry.get("commit", {}).get("message", "") for entry in commits]
              )
              if commit_subjects:
                  bullets = commit_subjects
                  source = "commits"

          bullets = filter_high_signal(bullets)
          if source not in {"release-body-discord", "release-body-highlights"}:
              bullets = [compact_bullet(bullet) for bullet in bullets]
          bullets = bullets[:3]

          if not bullets:
              bullets = ["Release published."]
              why_statement = "This release is now live with the latest validated changes."
          elif not why_statement:
              if source == "changelog":
                  why_statement = "This release pulls the highest-signal shipped changes from the tagged changelog."
              elif source in {"compare", "commits"}:
                  why_statement = "This message was generated from recent commit history because the release notes did not include curated highlights."
              else:
                  why_statement = "This release surfaces the highest-signal changes from the published notes."

          message = "\n".join(
              [
                  f"🚀 **{release_name}**",
                  "",
                  "**What's new**",
                  *[f"- {bullet}" for bullet in bullets],
                  "",
                  "**Why it matters**",
                  why_statement,
                  "",
                  f"🔗 {release_url}",
                  "",
              ]
          )
          Path("discord-release-message.txt").write_text(message, encoding="utf-8")
          PY

      - name: Publish Discord message
        shell: bash
        env:
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          webhook_url="${DISCORD_RELEASE_WEBHOOK_URL:-}"
          if [[ -z "${webhook_url}" ]]; then
            echo "Discord webhook secret is not configured; skipping Discord release announcement."
            exit 0
          fi

          jq -Rs '{content: .}' discord-release-message.txt \
            | curl -fsSL -H "Content-Type: application/json" -d @- "${webhook_url}"
