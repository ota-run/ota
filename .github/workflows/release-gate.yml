name: Release Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  annotations-demo:
    name: Annotations Demo
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'codex/ota-annotations-demo'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Create demo contract
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          cat > "$tmpdir/ota.yaml" <<'EOF'
          version: 1
          project:
            name: annotations-demo
          env:
            DEMO_REQUIRED:
              required: true
          EOF
          echo "DEMO_DIR=$tmpdir" >> "${GITHUB_ENV}"

      - name: Diagnose demo contract
        run: cargo run -- doctor --json "$DEMO_DIR" > doctor.json || true

      - name: Emit annotations
        run: sh scripts/emit-ota-findings.sh --mode doctor --format github --input doctor.json

      - name: Fail on blocker
        run: jq -e '.summary.error_count > 0' doctor.json >/dev/null

  release-gate:
    name: Release Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-C link-arg=/STACK:8388608' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install ota
        run: cargo install --path . --locked

      - name: Validate contract
        run: ota validate

      - name: Run release gate
        run: ota run release-gate --backend native

  release-tag:
    name: Create Release Tag
    outputs:
      created: ${{ steps.tag.outputs.created }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    needs: release-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: meta
        run: |
          version="$(awk -F'"' '/^version = / {print $2; exit}' Cargo.toml)"
          tag="v${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Create release tag
        id: tag
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          git fetch --tags --force
          if git rev-parse "${tag}" >/dev/null 2>&1; then
            echo "tag already exists: ${tag}"
            echo "created=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "Release ${tag}"
          git push origin "${tag}"
          echo "created=true" >> "${GITHUB_OUTPUT}"

  release-assets-linux:
    name: Build Release Asset (Linux)
    needs: release-tag
    if: needs.release-tag.outputs.created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --locked --release

      - name: Package release asset
        run: |
          target="$(rustc -vV | awk '/host:/{print $2; exit}')"
          asset="ota-${target}.tar.gz"
          mkdir -p dist
          tar -czf "dist/${asset}" -C target/release ota

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ota-release-linux
          path: dist/*.tar.gz
          if-no-files-found: error

  release-assets-macos:
    name: Build Release Asset (macOS)
    needs: release-tag
    if: needs.release-tag.outputs.created == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --locked --release

      - name: Package release asset
        run: |
          target="$(rustc -vV | awk '/host:/{print $2; exit}')"
          asset="ota-${target}.tar.gz"
          mkdir -p dist
          tar -czf "dist/${asset}" -C target/release ota

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ota-release-macos
          path: dist/*.tar.gz
          if-no-files-found: error

  release-assets-windows:
    name: Build Release Asset (Windows)
    needs: release-tag
    if: needs.release-tag.outputs.created == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --locked --release

      - name: Package release assets
        shell: pwsh
        run: |
          $target = (& rustc -vV | Select-String '^host:' | ForEach-Object { ($_ -split '\s+')[1] })
          $dist = Join-Path $PWD 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          $tarAsset = Join-Path $dist "ota-$target.tar.gz"
          $zipAsset = Join-Path $dist "ota-$target.zip"

          tar -czf $tarAsset -C target/release ota.exe
          Compress-Archive -Path target/release/ota.exe -DestinationPath $zipAsset -Force

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ota-release-windows
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  publish-schemas:
    name: Publish JSON Schemas to R2
    needs: release-tag
    if: needs.release-tag.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: release
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Publish schema files
        run: |
          version="${{ needs.release-tag.outputs.version }}"
          find docs/spec/json-schemas -maxdepth 1 -type f | sort | while read -r file; do
            filename="$(basename "${file}")"
            for prefix in "spec/json-schemas/latest" "spec/json-schemas/v${version}"; do
              key="${prefix}/${filename}"
              npx --yes wrangler r2 object put "${CLOUDFLARE_R2_BUCKET}/${key}" \
                --file "${file}" \
                --remote \
                --content-type application/json
            done
          done

      - name: Publish install scripts
        run: |
          for file in scripts/install.sh scripts/install.ps1 scripts/bootstrap.ps1; do
            filename="$(basename "${file}")"
            npx --yes wrangler r2 object put "${CLOUDFLARE_R2_BUCKET}/${filename}" \
              --file "${file}" \
              --remote \
              --content-type text/plain
          done

  publish-release:
    name: Publish GitHub Release
    needs:
      - release-tag
      - release-assets-linux
      - release-assets-macos
      - release-assets-windows
      - publish-schemas
    if: needs.release-tag.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ota-release-*
          merge-multiple: true

      - name: Generate release checksums
        run: |
          find dist -type f \( -name '*.tar.gz' -o -name '*.zip' \) | sort | while read -r file; do
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$file"
            else
              shasum -a 256 "$file"
            fi
          done > dist/ota-checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-tag.outputs.tag }}
          name: ${{ needs.release-tag.outputs.tag }}
          files: |
            dist/**/*.tar.gz
            dist/**/*.zip
            dist/ota-checksums.txt
          generate_release_notes: true
