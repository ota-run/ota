name: Smoke

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  repo-smoke:
    name: Repo Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-C link-arg=/STACK:8388608' || '' }}
      COLUMNS: "120"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust artifacts
        if: runner.os != 'Windows'
        uses: Swatinem/rust-cache@v2

      - name: Install ota
        shell: bash
        run: |
          set -euo pipefail
          if command -v rustup >/dev/null 2>&1; then
            CARGO_CMD="$(rustup which cargo)"
            RUSTC_CMD="$(rustup which rustc)"
            env -u RUSTC_WRAPPER RUSTC="$RUSTC_CMD" "$CARGO_CMD" install --path . --locked
          else
            env -u RUSTC_WRAPPER cargo install --path . --locked
          fi

      - name: Ensure cargo is on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cargoBin = Join-Path $env:USERPROFILE ".cargo\bin"
          if (-not (Test-Path $cargoBin)) {
            throw "cargo bin path not found: $cargoBin"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $cargoBin

      - name: Validate repo contract
        run: ota validate . --plain

      - name: Smoke repo run preview JSON
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          output = subprocess.run(
              ["ota", "run", "ci", "--dry-run", "--json", "."],
              capture_output=True,
              text=True,
          )
          if output.returncode not in (0, 1):
              sys.stderr.write(output.stderr)
              raise SystemExit(output.returncode)
          payload = output.stdout or output.stderr
          body = json.loads(payload)
          assert body["dry_run"] is True
          assert body["task"] == "ci"
          assert isinstance(body["plan"]["actions"], list)
          assert body["requested_task"]["name"] == "ci"
          assert body["summary"]["verdict"] in {"ready", "blocked"}
          pathlib.Path("repo-run-preview.json").write_text(payload, encoding="utf-8")
          PY

      - name: Smoke repo up preview JSON
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          output = subprocess.run(
              ["ota", "up", "--dry-run", "--json", "."],
              capture_output=True,
              text=True,
          )
          if output.returncode not in (0, 1):
              sys.stderr.write(output.stderr)
              raise SystemExit(output.returncode)
          payload = output.stdout or output.stderr
          body = json.loads(payload)
          assert body["dry_run"] is True
          assert body["phase"] == "preview"
          assert body["status"] in {"READY", "BLOCKED"}
          assert isinstance(body["plan"]["actions"], list)
          assert body["contract_identity"]["project"]["name"] == "ota"
          pathlib.Path("repo-up-preview.json").write_text(payload, encoding="utf-8")
          PY

  examples-smoke:
    name: Examples Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install ota
        shell: bash
        run: |
          set -euo pipefail
          env -u RUSTC_WRAPPER cargo install --path . --locked

      - name: Validate example contracts
        run: |
          ota validate examples/basic-rust --plain
          ota validate examples/basic-node --plain
          ota workspace validate examples/workspace-basic --plain

      - name: Smoke Rust example preview
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess

          output = subprocess.run(
              ["ota", "run", "test", "--dry-run", "--json", "examples/basic-rust"],
              check=True,
              capture_output=True,
              text=True,
          )
          body = json.loads(output.stdout)
          assert body["ok"] is True
          assert body["dry_run"] is True
          assert body["requested_task"]["name"] == "test"
          assert len(body["toolchains"]) == 1
          assert body["toolchains"][0]["name"] == "rust"
          pathlib.Path("basic-rust-run-preview.json").write_text(
              output.stdout,
              encoding="utf-8",
          )
          PY

      - name: Smoke Node example preview
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess

          output = subprocess.run(
              ["ota", "run", "test", "--dry-run", "--json", "examples/basic-node"],
              check=True,
              capture_output=True,
              text=True,
          )
          body = json.loads(output.stdout)
          assert body["ok"] is True
          assert body["dry_run"] is True
          assert body["requested_task"]["name"] == "test"
          assert len(body["toolchains"]) == 1
          assert body["toolchains"][0]["name"] == "node"
          pathlib.Path("basic-node-run-preview.json").write_text(
              output.stdout,
              encoding="utf-8",
          )
          PY

      - name: Smoke workspace tasks JSON
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess

          output = subprocess.run(
              ["ota", "workspace", "tasks", "--json", "examples/workspace-basic"],
              check=True,
              capture_output=True,
              text=True,
          )
          body = json.loads(output.stdout)
          assert body["ok"] is True
          assert len(body["repos"]) == 2
          assert body["summary"]["repo_count"] == 2
          pathlib.Path("workspace-tasks.json").write_text(output.stdout, encoding="utf-8")
          PY
