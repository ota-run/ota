name: Smoke

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  repo-smoke:
    name: Repo Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install ota
        shell: bash
        run: |
          set -euo pipefail
          env -u RUSTC_WRAPPER cargo install --path . --locked

      - name: Validate repo contract
        run: ota validate . --plain

      - name: Smoke repo run preview JSON
        shell: bash
        run: |
          set -euo pipefail
          ota run ci --dry-run --json . > repo-run-preview.json
          jq -e '
            .ok == true and
            .dry_run == true and
            .task == "ci" and
            .summary.verdict == "ready" and
            (.plan.actions | type == "array") and
            (.requested_task.name == "ci")
          ' repo-run-preview.json >/dev/null

      - name: Smoke repo up preview JSON
        shell: bash
        run: |
          set -euo pipefail
          ota up --dry-run --json . > repo-up-preview.json
          jq -e '
            .dry_run == true and
            .phase == "preview" and
            (.plan.actions | type == "array") and
            (.contract_identity.project.name == "ota")
          ' repo-up-preview.json >/dev/null

  examples-smoke:
    name: Examples Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install ota
        shell: bash
        run: |
          set -euo pipefail
          env -u RUSTC_WRAPPER cargo install --path . --locked

      - name: Validate example contracts
        run: |
          ota validate examples/basic-rust --plain
          ota validate examples/basic-node --plain
          ota workspace validate examples/workspace-basic --plain

      - name: Smoke Rust example preview
        shell: bash
        run: |
          set -euo pipefail
          ota run test --dry-run --json examples/basic-rust > basic-rust-run-preview.json
          jq -e '
            .ok == true and
            .dry_run == true and
            .requested_task.name == "test" and
            (.toolchains | length) == 1 and
            .toolchains[0].name == "rust"
          ' basic-rust-run-preview.json >/dev/null

      - name: Smoke Node example preview
        shell: bash
        run: |
          set -euo pipefail
          ota run test --dry-run --json examples/basic-node > basic-node-run-preview.json
          jq -e '
            .ok == true and
            .dry_run == true and
            .requested_task.name == "test" and
            (.toolchains | length) == 1 and
            .toolchains[0].name == "node"
          ' basic-node-run-preview.json >/dev/null

      - name: Smoke workspace tasks JSON
        shell: bash
        run: |
          set -euo pipefail
          ota workspace tasks --json examples/workspace-basic > workspace-tasks.json
          jq -e '
            .ok == true and
            (.repos | length) == 2 and
            (.summary.repo_count == 2)
          ' workspace-tasks.json >/dev/null
