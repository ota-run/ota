name: Smoke

on:
  pull_request:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.event_name == 'push' && github.ref_name || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  repo-smoke:
    name: Repo Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-C link-arg=/STACK:8388608' || '' }}
      COLUMNS: "120"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust artifacts
        if: runner.os != 'Windows'
        uses: Swatinem/rust-cache@v2

      - name: Install ota
        shell: bash
        run: |
          set -euo pipefail
          if command -v rustup >/dev/null 2>&1; then
            CARGO_CMD="$(rustup which cargo)"
            RUSTC_CMD="$(rustup which rustc)"
            env -u RUSTC_WRAPPER RUSTC="$RUSTC_CMD" "$CARGO_CMD" install --path . --locked
          else
            env -u RUSTC_WRAPPER cargo install --path . --locked
          fi

      - name: Ensure cargo is on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cargoBin = Join-Path $env:USERPROFILE ".cargo\bin"
          if (-not (Test-Path $cargoBin)) {
            throw "cargo bin path not found: $cargoBin"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $cargoBin

      - name: Validate repo contract
        run: ota validate . --plain

      - name: Ensure no deprecated JSON schema resolver API in workflows
        shell: bash
        run: |
          set -euo pipefail
          deprecated_import='from jsonschema import .*Ref'"Resolver"
          deprecated_ctor='Ref'"Resolver\\("
          if rg -n "${deprecated_import}|${deprecated_ctor}" .github/workflows; then
            echo "Found deprecated jsonschema.RefResolver usage in workflow files."
            exit 1
          fi

      - name: Smoke repo run preview JSON
        shell: bash
        run: |
          ota json validate \
            --schema run-preview.json \
            --allow-exit 0 \
            --allow-exit 1 \
            --write-payload repo-run-preview.json \
            --assert-eq dry_run=true \
            --assert-eq task=ci \
            --assert-eq requested_task.name=ci \
            --assert-type plan.actions:array \
            --assert-in preview_status='["RUNNABLE","RUNNABLE WITH WARNINGS","BLOCKED"]' \
            --assert-non-empty-string summary.verdict \
            --assert-exit-map 'preview_status=0:["RUNNABLE","RUNNABLE WITH WARNINGS"];1:["BLOCKED"]' \
            -- ota run ci --dry-run --json .

      - name: Smoke repo up preview JSON
        shell: bash
        run: |
          ota json validate \
            --schema up.json \
            --allow-exit 0 \
            --allow-exit 1 \
            --write-payload repo-up-preview.json \
            --assert-eq dry_run=true \
            --assert-eq phase=preview \
            --assert-in preview_status='["RUNNABLE","RUNNABLE WITH WARNINGS","BLOCKED"]' \
            --assert-in status='["READY","READY WITH WARNINGS","BLOCKED"]' \
            --assert-type plan.actions:array \
            --assert-eq contract_identity.project.name=ota \
            -- ota up --dry-run --json .

  examples-smoke:
    name: Examples Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install ota
        shell: bash
        run: |
          set -euo pipefail
          env -u RUSTC_WRAPPER cargo install --path . --locked

      - name: Ensure no deprecated JSON schema resolver API in workflows
        shell: bash
        run: |
          set -euo pipefail
          deprecated_import='from jsonschema import .*Ref'"Resolver"
          deprecated_ctor='Ref'"Resolver\\("
          if rg -n "${deprecated_import}|${deprecated_ctor}" .github/workflows; then
            echo "Found deprecated jsonschema.RefResolver usage in workflow files."
            exit 1
          fi

      - name: Validate example contracts
        run: |
          ota validate examples/basic-rust --plain
          ota validate examples/basic-node --plain
          ota workspace validate examples/workspace-basic --plain

      - name: Smoke Rust example preview
        shell: bash
        run: |
          ota json validate \
            --schema run-preview.json \
            --allow-exit 0 \
            --allow-exit 1 \
            --write-payload basic-rust-run-preview.json \
            --assert-eq dry_run=true \
            --assert-eq requested_task.name=test \
            --assert-in preview_status='["RUNNABLE","RUNNABLE WITH WARNINGS","BLOCKED"]' \
            --assert-eq toolchains.0.name=rust \
            -- ota run test --dry-run --json examples/basic-rust

      - name: Smoke Node example preview
        shell: bash
        run: |
          ota json validate \
            --schema run-preview.json \
            --allow-exit 0 \
            --allow-exit 1 \
            --write-payload basic-node-run-preview.json \
            --assert-eq dry_run=true \
            --assert-eq requested_task.name=test \
            --assert-in preview_status='["RUNNABLE","RUNNABLE WITH WARNINGS","BLOCKED"]' \
            --assert-eq toolchains.0.name=node \
            -- ota run test --dry-run --json examples/basic-node

      - name: Smoke workspace tasks JSON
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess

          output = subprocess.run(
              ["ota", "workspace", "tasks", "--json", "examples/workspace-basic"],
              check=True,
              capture_output=True,
              text=True,
          )
          body = json.loads(output.stdout)
          assert body["ok"] is True
          assert len(body["repos"]) == 2
          assert body["summary"]["repo_count"] == 2
          pathlib.Path("workspace-tasks.json").write_text(output.stdout, encoding="utf-8")
          PY
