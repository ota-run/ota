# GitHub registers manual workflow paths from the default branch. The exact implementation lives
# only on its reviewed implementation ref; this default-branch definition is intentionally inert.
name: secret-delivery-github-oidc-live

on:
  workflow_dispatch:

permissions: {}

jobs:
  registration-only:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Refuse execution from the registration stub
        run: exit 1
