name: secret-delivery-google-sts-live

# Preparation only: dispatch requires separate frozen-source review and hosted authorization.
# V2 request reconciliation is not remote WIF configuration or provider authority proof.

on:
  workflow_dispatch:
    inputs:
      expected_core_revision:
        description: Exact 40-character Core commit provisioned for this run
        required: true
        type: string
      expected_workload_identity_provider:
        description: Public mirror of the installed V2 request provider; never a runtime target override
        required: true
        type: string

permissions: {}

jobs:
  request-one-bounded-google-sts-response:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - ota-authority-independent
    timeout-minutes: 10
    permissions:
      id-token: write
    env:
      AUTHORITY_ID: platform-release-authority
      CLIENT: /usr/lib/ota-authority/bin/ota-authority-systemd-client
      CORE_SOURCE: /opt/ota-build/service-path-core
      INSTALLATION_EVIDENCE: /var/lib/ota/authority-launcher-public/installation-evidence.json
      PRESSURE_BUILDER: /usr/lib/ota-authority/bin/ota-secret-delivery-pressure-authority
      PRESSURE_INSTALLATION_EVIDENCE: /var/lib/ota/authority-launcher-public/secret-delivery-pressure-installation.json
      PRESSURE_REPOSITORY: /srv/ota-v3-pressure
      EXPECTED_CORE_SOURCE_REVISION: ${{ inputs.expected_core_revision }}
      EXPECTED_LAUNCHER_SOURCE_REVISION: dd667c3d6b63d8d26d9e2a40f831e9d08a7a6864
      EXPECTED_PROTOCOL_SOURCE_REVISION: e5fe1c83e562e02f60e27026c7148918bd016155
      EXPECTED_WORKFLOW_REFERENCE: ota-run/ota/.github/workflows/secret-delivery-google-sts-live.yml@refs/heads/1.6.29-implementation

    steps:
      - name: Reconcile the exact protected installation and invocation
        shell: bash
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          EXPECTED_WORKLOAD_IDENTITY_PROVIDER: ${{ inputs.expected_workload_identity_provider }}
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1

          [[ "$EXPECTED_CORE_SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test -n "$EXPECTED_WORKLOAD_IDENTITY_PROVIDER"
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = ota-run/ota
          test "$GITHUB_REF" = refs/heads/1.6.29-implementation
          test "$EXPECTED_CORE_SOURCE_REVISION" = "$GITHUB_SHA"
          test "$GITHUB_WORKFLOW_REF" = "$EXPECTED_WORKFLOW_REFERENCE"
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(git -c safe.directory="$CORE_SOURCE" -C "$CORE_SOURCE" rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git -c safe.directory="$CORE_SOURCE" -C "$CORE_SOURCE" status --porcelain --untracked-files=all)"
          test -z "$(git -c safe.directory="$CORE_SOURCE" -C "$CORE_SOURCE" ls-files --others --ignored --exclude-standard | grep -Ev '^target/' || true)"
          test -z "$(find "$CORE_SOURCE" -xdev \( ! -user root -o -perm /022 \) -print -quit)"
          cmp \
            "$CORE_SOURCE/docs/pressure/fixtures/secret-delivery-service-path/ota.yaml" \
            "$PRESSURE_REPOSITORY/ota.yaml"
          python3 "$CORE_SOURCE/.github/ota/test_verify_protected_runner_listener.py"
          runner_version="$(
            python3 "$CORE_SOURCE/.github/ota/verify-protected-runner-listener.py" \
              --installation-evidence "$INSTALLATION_EVIDENCE"
          )"
          export OTA_CAPABILITY_OBSERVATION_RUNNER_VERSION="$runner_version"

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import stat
          import subprocess
          from pathlib import Path

          def require_root_owned_path(path: Path, expected_mode: int) -> None:
              current = path
              while True:
                  metadata = current.lstat()
                  if stat.S_ISLNK(metadata.st_mode) or metadata.st_uid != 0 or metadata.st_mode & 0o022:
                      raise SystemExit("protected evidence ownership chain is invalid")
                  if current.parent == current:
                      break
                  current = current.parent
              metadata = path.lstat()
              if (
                  not stat.S_ISREG(metadata.st_mode)
                  or metadata.st_nlink != 1
                  or stat.S_IMODE(metadata.st_mode) != expected_mode
              ):
                  raise SystemExit("protected evidence file is invalid")

          if os.geteuid() == 0:
              raise SystemExit("protected runner job must be non-root")
          try:
              sudo = subprocess.run(
                  ["sudo", "-n", "true"],
                  check=False,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
          except FileNotFoundError:
              sudo = None
          if sudo is not None and sudo.returncode == 0:
              raise SystemExit("protected runner job unexpectedly has passwordless sudo")

          status = Path("/proc/self/status").read_text(encoding="utf-8")
          for key, expected in {
              "CapEff:": "0000000000000000",
              "CapPrm:": "0000000000000000",
              "CapInh:": "0000000000000000",
              "CapAmb:": "0000000000000000",
              "NoNewPrivs:": "1",
          }.items():
              observed = next(
                  (line.split()[1] for line in status.splitlines() if line.startswith(key)),
                  None,
              )
              if observed != expected:
                  raise SystemExit(f"protected runner posture mismatch: {key}")
          cgroup = Path("/proc/self/cgroup").read_text(encoding="utf-8").splitlines()
          if "0::/system.slice/ota-authority-pressure-runner.service" not in cgroup:
              raise SystemExit("job is outside the protected runner service cgroup")

          properties = subprocess.run(
              [
                  "systemctl",
                  "show",
                  "ota-authority-pressure-runner.service",
                  "--no-pager",
                  "--property=ProtectSystem",
                  "--property=ReadWritePaths",
              ],
              check=True,
              capture_output=True,
              text=True,
          )
          observed = dict(
              line.split("=", 1) for line in properties.stdout.splitlines() if "=" in line
          )
          expected_write_paths = {
              "/opt/ota-actions-runner/_diag",
              "/opt/ota-actions-runner/_work",
              "/var/lib/ota/authority-job-evidence",
          }
          write_paths = observed.get("ReadWritePaths", "").split()
          if (
              observed.get("ProtectSystem") != "strict"
              or set(write_paths) != expected_write_paths
              or len(write_paths) != len(expected_write_paths)
          ):
              raise SystemExit("protected runner writable-path whitelist is invalid")

          installation_path = Path(os.environ["INSTALLATION_EVIDENCE"])
          pressure_path = Path(os.environ["PRESSURE_INSTALLATION_EVIDENCE"])
          require_root_owned_path(installation_path, 0o644)
          require_root_owned_path(pressure_path, 0o644)
          installation = json.loads(installation_path.read_bytes())
          if {
              "core": installation.get("core_source_revision"),
              "launcher": installation.get("launcher_source_revision"),
              "protocol": installation.get("protocol_source_revision"),
          } != {
              "core": os.environ["EXPECTED_CORE_SOURCE_REVISION"],
              "launcher": os.environ["EXPECTED_LAUNCHER_SOURCE_REVISION"],
              "protocol": os.environ["EXPECTED_PROTOCOL_SOURCE_REVISION"],
          }:
              raise SystemExit("installed source revisions do not match the exact live run")

          # Public installation stays V1/source staging; only the complete request is V2.
          pressure = json.loads(pressure_path.read_bytes())
          if set(pressure) != {
              "schema_version",
              "record_kind",
              "identity",
              "core_source_revision",
              "builder_artifact_identity",
              "request_identity",
              "authority_posture",
              "selected_process_environment",
          }:
              raise SystemExit("pressure authority installation evidence is not closed")
          expected_environment = {
              "GITHUB_RUN_ATTEMPT": os.environ["GITHUB_RUN_ATTEMPT"],
              "GITHUB_RUN_ID": os.environ["GITHUB_RUN_ID"],
              "GITHUB_WORKFLOW_REF": os.environ["GITHUB_WORKFLOW_REF"],
              "OTA_CAPABILITY_OBSERVATION_RUNNER_VERSION": os.environ[
                  "OTA_CAPABILITY_OBSERVATION_RUNNER_VERSION"
              ],
          }
          request = {
              "schema_version": 2,
              "record_kind": "secret_delivery_sts_pressure_authority_request",
              "contract_path": "/srv/ota-v3-pressure/ota.yaml",
              "task": "governed",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "repository_id": os.environ["GITHUB_REPOSITORY_ID"],
              "repository_owner_id": os.environ["GITHUB_REPOSITORY_OWNER_ID"],
              "actor_id": os.environ["GITHUB_ACTOR_ID"],
              "event_name": os.environ["GITHUB_EVENT_NAME"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "workflow_reference": os.environ["GITHUB_WORKFLOW_REF"],
              "runner_version": os.environ["OTA_CAPABILITY_OBSERVATION_RUNNER_VERSION"],
              "workflow_sha": os.environ["GITHUB_WORKFLOW_SHA"],
              "git_ref": os.environ["GITHUB_REF"],
              "commit_sha": os.environ["GITHUB_SHA"],
              "sts_target": {
                  "workload_identity_provider": os.environ["EXPECTED_WORKLOAD_IDENTITY_PROVIDER"],
              },
          }
          canonical_request = json.dumps(
              request, ensure_ascii=False, sort_keys=True, separators=(",", ":")
          ).encode()
          expected_request_identity = "sha256:" + hashlib.sha256(
              b"ota.secret-delivery-sts-pressure.authority-request.v2\0" + canonical_request
          ).hexdigest()
          builder_identity = "sha256:" + hashlib.sha256(
              Path(os.environ["PRESSURE_BUILDER"]).read_bytes()
          ).hexdigest()
          if (
              pressure.get("schema_version") != 1
              or pressure.get("record_kind")
              != "secret_delivery_pressure_public_installation_evidence"
              or pressure.get("authority_posture") != "synthetic_provider_free_installed"
              or pressure.get("core_source_revision")
              != os.environ["EXPECTED_CORE_SOURCE_REVISION"]
              or pressure.get("builder_artifact_identity") != builder_identity
              or pressure.get("request_identity") != expected_request_identity
              or pressure.get("selected_process_environment") != expected_environment
          ):
              raise SystemExit("pressure authority installation did not reconcile")
          claimed_pressure_identity = pressure.get("identity", "")
          canonical_pressure = dict(pressure)
          canonical_pressure["identity"] = ""
          observed_pressure_identity = "sha256:" + hashlib.sha256(
              b"ota.authority-launcher.secret-delivery-pressure-installation.v1\0"
              + json.dumps(
                  canonical_pressure,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
              ).encode()
          ).hexdigest()
          if (
              not re.fullmatch(r"sha256:[0-9a-f]{64}", claimed_pressure_identity)
              or claimed_pressure_identity != observed_pressure_identity
          ):
              raise SystemExit("pressure authority installation identity is invalid")
          PY

      - name: Invoke the bounded STS checkpoint and retain only job-observed public posture
        shell: bash
        env:
          CLIENT_RESULT: ${{ runner.temp }}/secret-delivery-google-sts-live-client.json
          CLIENT_STDERR: ${{ runner.temp }}/secret-delivery-google-sts-live-client.stderr.txt
          PUBLIC_POSTURE: ${{ runner.temp }}/secret-delivery-google-sts-live-posture.json
        run: |
          set -euo pipefail
          umask 077
          cleanup() {
            unset ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN
            rm -f -- "$CLIENT_RESULT" "$CLIENT_STDERR" "$PUBLIC_POSTURE"
          }
          trap cleanup EXIT
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          test ! -e "$PRESSURE_REPOSITORY/selected-work-executed"

          set +e
          "$CLIENT" \
            --authority-id "$AUTHORITY_ID" \
            --repository "$PRESSURE_REPOSITORY" \
            --json -- run governed --grant "$AUTHORITY_ID" \
            >"$CLIENT_RESULT" 2>"$CLIENT_STDERR"
          client_status=$?
          set -e
          test "$client_status" -eq 1

          CLIENT_STATUS="$client_status" python3 - <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          # Never publish parser exceptions, provider errors, JWTs, or token bytes.
          sys.excepthook = lambda *_: sys.stderr.write("bounded STS posture validation failed\n")

          result_path = Path(os.environ["CLIENT_RESULT"])
          stderr_path = Path(os.environ["CLIENT_STDERR"])
          result_bytes = result_path.read_bytes()
          stderr_bytes = stderr_path.read_bytes()
          result = json.loads(result_bytes)
          terminal = result.get("terminal")
          expected = (
              "selected secret requirements completed the bounded STS checkpoint "
              "(github_core_invocations=1, github_outcome=response_received, "
              "sts_core_invocations=1, sts_outcome=response_accepted); any returned token was "
              "discarded; terminally refusing before IAM Credentials, Secret Manager, "
              "materialization, injection, or task execution"
          )
          plain_stderr = re.sub(r"\x1b\[[0-9;]*m", "", stderr_bytes.decode("utf-8"))
          if " ".join(plain_stderr.split()).count(expected) != 1:
              raise SystemExit("bounded STS terminal posture was missing or ambiguous")
          if (
              sorted(result) != ["ok", "output_complete", "request_identity", "terminal"]
              or result["ok"] is not False
              or result["output_complete"] is not True
              or not isinstance(terminal, dict)
              or terminal.get("stage") != "selected_execution_failed_boundary_removed"
              or terminal.get("outcome") != "failed"
              or terminal.get("exit_code") != 1
          ):
              raise SystemExit("protected client terminal envelope is invalid")
          finalization = terminal.get("finalization") or {}
          if any(
              finalization.get(field) is not True
              for field in (
                  "child_reaped",
                  "scope_removed",
                  "cgroup_empty_or_absent",
                  "active_slot_removed",
              )
          ):
              raise SystemExit("protected client cleanup is incomplete")

          observed_output = result_bytes + stderr_bytes
          for name in (
              "ACTIONS_ID_TOKEN_REQUEST_URL",
              "ACTIONS_ID_TOKEN_REQUEST_TOKEN",
          ):
              secret = os.environ[name].encode()
              if not secret or secret in observed_output:
                  raise SystemExit("private GitHub OIDC capability appeared in command output")
          if re.search(rb"eyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+", observed_output):
              raise SystemExit("an unadmitted JWT appeared in command output")

          if Path(os.environ["PRESSURE_REPOSITORY"], "selected-work-executed").exists():
              raise SystemExit("selected work unexpectedly executed")

          # Construct only this closed projection after all terminal and cleanup checks pass.
          posture = {
              "schema_version": 1,
              "record_kind": "secret_delivery_google_sts_live_posture",
              "core_source_revision": os.environ["EXPECTED_CORE_SOURCE_REVISION"],
              "launcher_source_revision": os.environ["EXPECTED_LAUNCHER_SOURCE_REVISION"],
              "protocol_source_revision": os.environ["EXPECTED_PROTOCOL_SOURCE_REVISION"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "github_core_invocations": 1,
              "github_outcome": "response_received",
              "sts_core_invocations": 1,
              "sts_outcome": "response_accepted",
              "jwt_claim_reconciliation": "matched_unadmitted",
              "provider_acknowledgement": "job_observed_only",
              "root_custodied_semantic_attestation": "not_proved",
              "provider_cardinality": "not_proved",
              "lower_layer_cardinality": "not_proved",
              "jwt_independent_verification": "not_proved",
              "jwt_signature_verification": "not_attempted",
              "provider_condition_enforcement": "not_proved",
              "iam_credentials": "not_attempted",
              "secret_manager": "not_attempted",
              "materialization": "not_attempted",
              "injection": "not_attempted",
              "task_execution": "not_attempted",
              "token_disposal": "discarded",
              "token_memory_erasure": "not_proved",
              "provider_revocation": "not_proved",
              "child_reaped": True,
              "scope_removed": True,
              "cgroup_empty_or_absent": True,
              "active_slot_removed": True,
              "selected_work_executed": False,
          }
          Path(os.environ["PUBLIC_POSTURE"]).write_text(
              json.dumps(posture, ensure_ascii=False, sort_keys=True, separators=(",", ":"))
              + "\n",
              encoding="utf-8",
          )
          PY

          unset ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN
          test ! -e "$PRESSURE_REPOSITORY/selected-work-executed"
          cat "$PUBLIC_POSTURE"
