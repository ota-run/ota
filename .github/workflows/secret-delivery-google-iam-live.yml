# GitHub registers manual workflow paths from the default branch. The exact implementation lives
# only on its reviewed implementation ref; this default-branch definition is intentionally inert.
name: secret-delivery-google-iam-live

on:
  workflow_dispatch:
    inputs:
      expected_core_revision:
        description: Exact 40-character Core commit provisioned for this run
        required: true
        type: string
      expected_service_account:
        description: Public mirror of the installed V3 service account; never a runtime target override
        required: true
        type: string
      expected_workload_identity_provider:
        description: Public mirror of the installed V3 request provider; never a runtime target override
        required: true
        type: string

permissions: {}

jobs:
  registration-only:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Refuse execution from the registration stub
        run: exit 1
