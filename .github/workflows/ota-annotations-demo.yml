name: ota-annotations-demo

on:
  pull_request:
  workflow_dispatch:

jobs:
  annotations:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Create demo contract
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          cat > "$tmpdir/ota.yaml" <<'EOF'
          version: 1
          project:
            name: annotations-demo
          env:
            DEMO_REQUIRED:
              required: true
          EOF
          echo "DEMO_DIR=$tmpdir" >> "$GITHUB_ENV"

      - name: Diagnose demo contract
        run: cargo run -- doctor --json "$DEMO_DIR" > doctor.json

      - name: Emit annotations
        run: |
          set -euo pipefail
          primary_blocker="$(jq -r '.summary.primary_blocker?.summary // empty' doctor.json)"
          if [ -n "$primary_blocker" ]; then
            next="$(jq -r '.summary.primary_blocker?.next // empty' doctor.json)"
            echo "::notice title=ota doctor primary blocker::$primary_blocker | $next"
          fi
          jq -r '
            .findings[]
            | if .severity == "error" then "error" else "warning" end as $level
            | "::\($level) title=ota doctor finding::\(.summary) | \(.next)"
          ' doctor.json

      - name: Fail on blocker
        run: jq -e '.summary.error_count > 0' doctor.json >/dev/null
