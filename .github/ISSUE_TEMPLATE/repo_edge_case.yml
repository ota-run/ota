name: Repo edge case
description: Report a real repo shape or operator path that exposes an Ota gap.
labels: [example, triage]
body:
  - type: input
    id: ota_version
    attributes:
      label: Ota version
      description: Run `ota --version` and paste the exact version string.
      placeholder: ota 1.6.15
    validations:
      required: true
  - type: textarea
    id: repo_shape
    attributes:
      label: Repo or workflow shape
      description: Describe the real repo path, stack, or operator flow that exposes the gap.
      placeholder: Monorepo, Windows-native toolchain, multi-front-door service repo, etc.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What breaks or becomes unclear?
      description: Explain the exact trust gap, diagnosis failure, authoring burden, or operator ambiguity.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should Ota do instead?
      description: Describe the honest product behavior or contract shape you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Link a public repo, attach a small contract fragment, or describe the smallest repro.
    validations:
      required: true
