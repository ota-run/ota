name: Docs feedback
description: Report a docs bug or clarity issue.
labels: [documentation]
body:
  - type: textarea
    id: location
    attributes:
      label: Docs location
      description: Link or path to the page that needs work.
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is unclear or wrong?
      description: Explain the specific docs problem.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix
      description: How should the docs be changed?
