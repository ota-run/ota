name: Install Ota From Source
description: Check out an Ota source ref and install the local ota binary through cargo

inputs:
  repository:
    description: Repository that hosts the Ota source tree
    required: false
    default: ota-run/ota
  ref:
    description: Branch, tag, or commit to build
    required: true
  path:
    description: Checkout path for the Ota source tree
    required: false
    default: .ota-source
  rust-toolchain:
    description: Rust toolchain channel to install before building
    required: false
    default: stable

runs:
  using: composite
  steps:
    - name: Checkout ota source
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.ref }}
        path: ${{ inputs.path }}
        persist-credentials: false

    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ inputs.rust-toolchain }}

    - name: Install ota from source
      shell: bash
      run: cargo install --path "${{ inputs.path }}" --locked --force

    - name: Verify ota install
      shell: bash
      run: ota --version
