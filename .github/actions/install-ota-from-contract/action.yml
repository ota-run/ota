name: Install Ota From Contract
description: Install ota in GitHub Actions from repo-owned agent.bootstrap.ota truth in ota.yaml

inputs:
  path:
    description: Path to ota.yaml or a repo directory containing ota.yaml
    required: false
    default: ota.yaml

outputs:
  source-kind:
    description: Resolved ota bootstrap source kind
    value: ${{ steps.install.outputs.source-kind }}
  version:
    description: Resolved ota version when source-kind=version
    value: ${{ steps.install.outputs.version }}
  git-rev:
    description: Resolved ota git revision when source-kind=git_rev
    value: ${{ steps.install.outputs.git-rev }}
  git-branch:
    description: Resolved ota git branch when source-kind=branch
    value: ${{ steps.install.outputs.git-branch }}
  contract-path:
    description: Resolved ota contract file path
    value: ${{ steps.install.outputs.contract-path }}

runs:
  using: composite
  steps:
    - id: install
      name: Install ota from contract bootstrap
      shell: bash
      run: bash "${{ github.action_path }}/install.sh" "${{ inputs.path }}"
